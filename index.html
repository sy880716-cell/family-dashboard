<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFFBF2">
<meta name="color-scheme" content="light">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="format-detection" content="telephone=no">
<meta name="description" content="시아·아윤이의 공부 루틴과 생활 루틴, 일정, 칭찬 도장을 함께 보는 우리집 루틴 보드">
<title>시아·아윤이 루틴 보드</title>
<style>/* ============================================================
   시아·아윤이 루틴 보드 — styles
   먼작귀(치이카와) 느낌의 밀크·딸기우유·버터빛 파스텔 테마
   ============================================================ */
:root {
  color-scheme: light;
  --milk: #FFFCF4;
  --cream: #FFF7E9;
  --cream-2: #FFFDF7;
  --white: #FFFFFF;
  --line: #F3E8D9;
  --line-strong: #EBDCC6;
  --brown: #6B5A4C;
  --brown-soft: #8B7A6B;
  --muted: #AC9C8C;
  --pink: #FFD9E2;
  --pink-deep: #E88BA0;
  --pink-soft: #FFF4F7;
  --sky: #D9EDF9;
  --sky-deep: #5B93BA;
  --sky-soft: #F3FAFE;
  --butter: #FFEFC2;
  --butter-deep: #DDB55C;
  --butter-soft: #FFF9E4;
  --mint: #DDF1DE;
  --mint-deep: #5C9E76;
  --mint-soft: #F4FBF5;
  --lav: #E8DFF7;
  --lav-deep: #8B72BE;
  --shadow: 0 8px 22px rgba(188, 164, 136, 0.13);
  --shadow-sm: 0 4px 12px rgba(188, 164, 136, 0.11);
  --r: 22px;
}

*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  font-family: 'Pretendard', 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', system-ui, -apple-system, sans-serif;
  color: var(--brown);
  background: var(--milk);
  font-size: 15px;
  line-height: 1.45;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
  word-break: keep-all;
  overflow-wrap: break-word;
}
/* 밀크 위에 번지는 파스텔 구름 */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  z-index: 0;
  pointer-events: none;
  background:
    radial-gradient(70% 34% at 6% -4%, #FFF3CC 0%, rgba(255, 243, 204, 0) 62%),
    radial-gradient(60% 30% at 96% 2%, #FFE6EE 0%, rgba(255, 230, 238, 0) 60%),
    radial-gradient(64% 32% at 2% 102%, #EAF7EC 0%, rgba(234, 247, 236, 0) 62%),
    radial-gradient(50% 26% at 100% 96%, #EAF4FD 0%, rgba(234, 244, 253, 0) 60%),
    linear-gradient(180deg, #FFFDF6 0%, #FFFBF1 42%, #FFF7EC 100%);
}
button { font-family: inherit; cursor: pointer; }
input, select, textarea { font-family: inherit; }

.app {
  position: relative;
  z-index: 1;
  max-width: 480px;
  margin: 0 auto;
  padding: 0 14px calc(92px + env(safe-area-inset-bottom));
}

/* ---------------- header ---------------- */
.app-header { position: relative; padding: 18px 2px 4px; }
/* 작은 반짝이 장식 */
.app-header::before,
.app-header::after {
  content: '';
  position: absolute;
  top: 12px;
  width: 9px;
  height: 9px;
  border-radius: 50%;
  pointer-events: none;
  z-index: -1;
}
.app-header::before { left: 34%; background: radial-gradient(circle, #FFD9E2 0%, rgba(255, 217, 226, 0.15) 70%, transparent 72%); }
.app-header::after { right: 30%; top: 46px; width: 12px; height: 12px; background: radial-gradient(circle, #FFEFC2 0%, rgba(255, 239, 194, 0.2) 70%, transparent 72%); }
.brand-row { display: flex; align-items: center; gap: 7px; }
.brand-mascot {
  width: 38px; height: 38px; flex: 0 0 auto;
  display: grid; place-items: center;
  background: linear-gradient(160deg, #FFFDF6, #FFF4E2);
  border: 1px solid var(--line);
  border-radius: 14px; box-shadow: var(--shadow-sm);
}
.brand-mascot svg { width: 30px; height: 30px; display: block; }
.brand-mascot-img { width: 31px; height: 31px; display: block; object-fit: contain; }
.brand { margin: 0; font-size: 19px; line-height: 1.15; font-weight: 900; letter-spacing: -0.9px; flex: 0 1 auto; white-space: nowrap; }
.brand .t1 { color: #6F5A48; }
.brand .t2 { color: #E88BA0; }
.gear-btn {
  margin-left: auto; position: relative; flex: 0 0 auto;
  display: flex; align-items: center; justify-content: center; gap: 4px;
  width: 54px; height: 38px; padding: 0;
  border-radius: 19px; border: 1px solid var(--line);
  background: #fff; box-shadow: var(--shadow-sm); font-size: 15px;
}
.gear-btn:active { transform: scale(0.97); }
.gear-btn .dot {
  width: 8px; height: 8px; border-radius: 50%;
  background: #6ECB96; box-shadow: 0 0 0 3px rgba(110, 203, 150, 0.16);
}
.header-sub { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 8px 8px; margin-top: 12px; }
.header-sub > div { flex: 1 1 auto; min-width: 0; }
.date-main { margin: 0; font-size: 15.5px; font-weight: 800; color: #7C6A58; letter-spacing: -0.3px; }
.tagline { margin: 2px 0 0; font-size: 13px; color: #A2917F; font-weight: 700; letter-spacing: -0.2px; }
.header-pills { flex: 0 0 auto; display: flex; flex-wrap: wrap; align-items: center; justify-content: flex-end; gap: 6px; }

/* 지금 보는 사람 */
.viewer-pill {
  flex: 0 0 auto; display: inline-flex; align-items: center; gap: 5px;
  font-size: 11.5px; font-weight: 900; color: #7A6455;
  background: #FFFFFF; border: 1px solid var(--line); border-radius: 999px;
  padding: 4px 11px 4px 4px; white-space: nowrap; box-shadow: var(--shadow-sm);
}
.viewer-pill .avatar { width: 22px; height: 22px; border-radius: 8px; border: 0; }
.viewer-name { line-height: 1; }

/* 실시간 동기화 상태 */
.sync-pill {
  flex: 0 0 auto; display: inline-flex; align-items: center; gap: 5px;
  font-size: 11px; font-weight: 800; letter-spacing: -0.2px;
  color: #9A8A79; background: #FFFFFF;
  border: 1px solid var(--line); border-radius: 999px;
  padding: 6px 10px; white-space: nowrap;
  box-shadow: var(--shadow-sm);
  transition: color 0.2s ease, background 0.2s ease, border-color 0.2s ease;
}
.sync-dot { width: 7px; height: 7px; border-radius: 50%; background: #E0A24E; flex: 0 0 auto; box-shadow: 0 0 0 3px rgba(224, 162, 78, 0.14); }
.sync-label { line-height: 1; }
.sync-pill[data-state="live"] { color: #3F8B63; border-color: #CDE7D7; background: #F3FBF6; }
.sync-pill[data-state="live"] .sync-dot { background: #4EC07E; box-shadow: 0 0 0 3px rgba(78, 192, 126, 0.18); }
.sync-pill[data-state="connecting"] { color: #A98A3E; border-color: #F0E1B8; background: #FFFAEC; }
.sync-pill[data-state="connecting"] .sync-dot { background: #E8C05A; box-shadow: 0 0 0 3px rgba(232, 192, 90, 0.16); }
.sync-pill[data-state="local"] { color: #A9803E; border-color: #F0E1B8; background: #FFFAEC; }

/* ---------------- layout ---------------- */
.tab { display: none; }
.tab.on { display: block; animation: fade 0.22s ease; }
.tab > * + * { margin-top: 13px; }
.tab > *:first-child { margin-top: 16px; }

@keyframes fade { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
@keyframes stamp-pop { 0% { transform: scale(0.4) rotate(-12deg); } 70% { transform: scale(1.12) rotate(4deg); } 100% { transform: scale(1); } }

.card {
  background: #fff;
  border: 1px solid var(--line);
  border-radius: var(--r);
  padding: 16px;
  box-shadow: var(--shadow);
}
.card-head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 6px 10px; margin-bottom: 6px; }
.card-head h2 {
  margin: 0; font-size: 16px; font-weight: 900; letter-spacing: -0.4px;
  display: flex; align-items: center; gap: 5px;
  flex: 1 1 auto; min-width: 0; line-height: 1.3;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.card-head > *:not(h2) { flex: 0 0 auto; }
.card-desc { margin: 0 0 10px; font-size: 12.5px; color: var(--muted); line-height: 1.5; font-weight: 600; }
.card-desc.center { text-align: center; margin: 10px 0 0; }
.foot-note { text-align: center; font-size: 11px; font-weight: 700; color: #C4B4A2; padding: 18px 0 4px; }

/* ---------------- stamp (치이카와 도장) ---------------- */
.stamp-ico {
  display: inline-flex; align-items: center; justify-content: center;
  width: 16px; height: 16px; flex: 0 0 auto; vertical-align: -3px;
}
.stamp-ico.big { width: 24px; height: 24px; vertical-align: -5px; }
.stamp-svg { width: 100%; height: 100%; display: block; }
.stamp-img { width: 100%; height: 100%; display: block; object-fit: contain; }
/* 아직 도장을 안 찍은 날 — 흐릿한 치이카와 */
.stamp-ico.ghost .stamp-img { opacity: 0.3; filter: grayscale(1) contrast(0.92); }

/* ---------------- buttons & chips ---------------- */
.btn {
  border: 1px solid var(--line);
  background: #fff;
  color: var(--brown);
  font: inherit;
  font-weight: 800;
  font-size: 13.5px;
  padding: 11px 14px;
  border-radius: 15px;
  box-shadow: var(--shadow-sm);
  display: inline-flex; align-items: center; justify-content: center; gap: 5px;
  transition: transform 0.08s ease;
  letter-spacing: -0.3px;
  min-height: 44px;
}
.btn:active { transform: scale(0.98); }
.btn:disabled { opacity: 0.6; box-shadow: none; }
.btn-mint { background: #E3F5E6; border-color: #C6E7CE; color: #47895F; }
.btn-pink { background: #FFE4EB; border-color: #F9CDD8; color: #C4637E; }
.btn-sky { background: #E7F5FD; border-color: #CCE7F8; color: #4A82A8; }
.btn-ghost { background: #FFFDF8; }
.btn-tiny { padding: 8px 11px; min-height: 34px; font-size: 12px; border-radius: 999px; }
.btn-block { width: 100%; }
.row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

.chip {
  flex: 0 0 auto;
  border: 1px solid var(--line); background: #fff; color: #7A6857;
  font: inherit; font-size: 12.5px; font-weight: 800;
  padding: 8px 12px; border-radius: 999px; white-space: nowrap;
}
.chip.on { background: #FFF3D2; border-color: #F2DCA4; color: #96701F; }
.quick {
  display: inline-block; margin: 0 4px 5px 0;
  font: inherit; font-size: 11px; font-weight: 700; color: #9A8A79;
  background: #FFFBF2; border: 1px solid #F3E9D9; border-radius: 999px; padding: 5px 9px;
}
.quick:active { background: #FFF3D8; }
.quick-row { display: block; margin-top: 7px; }

.mini {
  width: 34px; height: 34px; border-radius: 13px;
  border: 1px solid var(--line); background: #FFFDF8;
  display: grid; place-items: center; font-size: 13px; color: #B08A8A;
  box-shadow: 0 1px 4px rgba(190, 160, 120, 0.08);
  flex: 0 0 auto;
}
.mini:active { transform: scale(0.95); }
.mini-on { background: #FFF4D3; border-color: #F1DCA6; }
.mini-x { color: #D98397; }

.member-chips {
  display: flex; gap: 8px; overflow-x: auto; padding: 2px 0 4px;
  -webkit-overflow-scrolling: touch; scrollbar-width: none;
}
.member-chips::-webkit-scrollbar { display: none; }
.member-chip {
  flex: 0 0 auto; display: flex; align-items: center; gap: 7px;
  padding: 5px 12px 5px 5px; border-radius: 999px;
  border: 1px solid var(--line); background: #fff;
  font-size: 13px; font-weight: 800; color: #7A6857;
  box-shadow: var(--shadow-sm);
}
.member-chip.on { border-color: #C4E3F7; background: #F1FAFE; color: #4A82A8; box-shadow: 0 0 0 2px rgba(196, 227, 247, 0.4); }
.member-chip .avatar { width: 30px; height: 30px; border-radius: 11px; border: 0; }
.member-chip.locked { opacity: 0.55; }
.filter-row { flex-wrap: wrap; overflow: visible; padding-bottom: 6px; }
.filter-row .chip { font-size: 11.5px; padding: 7px 10px; }

.pill-flame {
  display: inline-flex; align-items: center; gap: 2px;
  font-size: 11.5px; font-weight: 900; color: #C77A2C;
  background: #FFF4E2; border: 1px solid #F7E1BE;
  border-radius: 999px; padding: 5px 10px; white-space: nowrap;
}
.pill-count {
  font-size: 11.5px; font-weight: 800; color: #A08A70;
  background: #FFFBF2; border: 1px solid #F1E5CD;
  border-radius: 999px; padding: 6px 10px; white-space: nowrap;
}
.pill-stamp {
  display: inline-flex; align-items: center; gap: 4px;
  font-size: 11.5px; font-weight: 900; color: #A9762A;
  background: #FFF6E2; border: 1px solid #F2E1BC;
  border-radius: 999px; padding: 5px 10px; white-space: nowrap;
}
.badge { font-size: 11px; font-weight: 800; padding: 5px 10px; border-radius: 999px; border: 1px solid transparent; }
.badge-warm { background: #FFF4E4; border-color: #F6E1C4; color: #B98335; }
.badge-soft { background: #fff; border-color: var(--line); color: #8A7A69; }

/* ---------------- avatars ---------------- */
.avatar {
  width: 58px; height: 58px; flex: 0 0 auto;
  border-radius: 18px; background: #FFFDF8; border: 1px solid var(--line);
  display: grid; place-items: center; overflow: hidden;
  box-shadow: inset 0 -3px 0 rgba(0, 0, 0, 0.02);
}
.avatar svg { width: 100%; height: 100%; display: block; }
.avatar-img { width: 100%; height: 100%; display: block; object-fit: contain; }
.avatar.lg { width: 72px; height: 72px; border-radius: 24px; }
.avatar.sm { width: 44px; height: 44px; border-radius: 15px; }
.avatar.xs { width: 32px; height: 32px; border-radius: 11px; }
.avatar.xxs { width: 28px; height: 28px; border-radius: 10px; }
.tone-sky { background: linear-gradient(180deg, #F3FBFF, #E4F3FC); }
.tone-pink { background: linear-gradient(180deg, #FFF7FA, #FFEAF1); }
.tone-butter { background: linear-gradient(180deg, #FFFCF0, #FFF0CC); }
.tone-mint { background: linear-gradient(180deg, #F6FCF7, #E5F5E9); }

/* ---------------- home: weather ---------------- */
.weather-card { background: linear-gradient(180deg, #F6FCFF, #EFF8FE); border-color: #DBECF8; }
.weather-top { display: flex; align-items: center; gap: 10px; }
.weather-icon { width: 42px; height: 42px; flex: 0 0 auto; }
.w-place { margin: 0; font-size: 11.5px; font-weight: 800; color: #7A8FA0; }
.w-line { margin: 1px 0 0; font-size: 14px; font-weight: 800; color: #4E6C7C; display: flex; align-items: baseline; gap: 5px; flex-wrap: wrap; }
.w-line b { font-size: 21px; color: #2F5C77; letter-spacing: -0.6px; }
.w-range { font-size: 11.5px; color: #7A8FA0; font-weight: 700; }
.weather-badges { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 9px; }

/* ---------------- home: kid cards ---------------- */
.kid-card {
  border-radius: 26px; border: 1px solid var(--line);
  padding: 15px 14px 14px; background: #fff; box-shadow: var(--shadow);
}
.kid-card.tone-sky { background: linear-gradient(168deg, #F3FBFF 0%, #FDFEFF 46%, #FFFDF8 100%); border-color: #DCEEFA; }
.kid-card.tone-butter { background: linear-gradient(168deg, #FFFCF0 0%, #FFFEF8 46%, #FFFDF8 100%); border-color: #F4E9CC; }
.kid-card.tone-pink { background: linear-gradient(168deg, #FFF7FA 0%, #FFFDF9 46%, #FFFDF8 100%); border-color: #F8E3EA; }
.kid-card.tone-mint { background: linear-gradient(168deg, #F6FCF7 0%, #FDFEFC 46%, #FFFDF8 100%); border-color: #DEEFE2; }
.kid-head { display: flex; align-items: center; gap: 11px; }
.kid-id { min-width: 0; flex: 1; }
.kid-name { margin: 0; font-size: 21px; font-weight: 900; letter-spacing: -0.7px; color: #4F3E32; }
.kid-sub { margin: 1px 0 0; font-size: 11.5px; font-weight: 700; color: #A5947F; }
.kid-badges { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 6px; }

.prog-list { display: flex; flex-direction: column; gap: 7px; margin: 13px 0 2px; }
.prog-row { display: flex; align-items: center; gap: 7px; }
.prog-name { margin: 0; flex: 0 0 auto; width: 84px; font-size: 11.5px; font-weight: 800; color: #7A6857; }
.prog-row .bar { height: 10px; }
.prog-row.prog-sky .bar i { background: linear-gradient(90deg, #A6D6F2, #7BB9E0); }
.prog-row.prog-mint .bar i { background: linear-gradient(90deg, #A7DEB6, #79C68F); }
.prog-num { flex: 0 0 auto; font-size: 11px; font-weight: 900; color: #8C7C6C; }

.kid-todos { margin-top: 13px; }
.kid-todos .todo-item { padding: 8px 0; }
.kid-empty { margin: 6px 0 2px; font-size: 11.5px; font-weight: 700; color: #B7A997; }

.sec { margin-top: 15px; }
.sec-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.sec-title { margin: 0; font-size: 14px; font-weight: 900; color: #5D4B3C; }
.sec-count {
  display: inline-flex; align-items: center; gap: 3px;
  font-size: 11px; font-weight: 800; color: #A08A70;
  background: #FFFBF2; border: 1px solid #F1E5CD; border-radius: 999px; padding: 4px 9px; white-space: nowrap;
}

.kid-mission {
  display: flex; align-items: center; gap: 8px; margin-top: 13px;
  padding: 10px; border-radius: 18px;
  background: #FFF7F1; border: 1px solid #F9E6D6;
}
.km-emoji { font-size: 22px; flex: 0 0 auto; line-height: 1; }
.km-body { flex: 1; min-width: 0; display: block; }
.km-body b { display: block; font-size: 10.5px; font-weight: 900; color: #C08A5E; letter-spacing: -0.2px; }
.km-body span { display: block; font-size: 13px; font-weight: 800; color: #5D4B3C; }

/* 주간 도장판 */
.week-row { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; margin: 13px 0 4px; }
.day-slot { display: flex; flex-direction: column; align-items: center; gap: 5px; }
.dow { margin: 0; font-size: 10.5px; font-weight: 800; color: #B4A291; }
.slot {
  width: 100%; max-width: 38px; aspect-ratio: 1;
  border-radius: 50%; border: 2px dashed #EBDFCE; background: #FFFDF8;
  display: grid; place-items: center; overflow: hidden;
  font-size: 12px; color: #C7B7A5; font-weight: 800;
}
.slot svg { width: 84%; height: 84%; }
.slot .stamp-ico { width: 84%; height: 84%; }
.slot .stamp-ico.big { width: 84%; height: 84%; }
.slot.stamped { border: 2px solid #F6D5DF; background: #FFF6F9; animation: stamp-pop 0.32s ease; }
.slot.today { box-shadow: 0 0 0 3px #CFE8F8; border-style: solid; }

/* ---------------- home: parents ---------------- */
.parent-strip { background: linear-gradient(160deg, #FFF8FB, #FFFDF8); border-color: #F7E6EC; }
.parent-btn {
  display: flex; align-items: center; gap: 8px; width: 100%;
  border: 1px solid var(--line); border-radius: 16px; background: #fff;
  padding: 8px; text-align: left; font: inherit; box-shadow: var(--shadow-sm);
}
.parent-btn:active { transform: scale(0.99); }
.parent-txt { display: flex; flex-direction: column; min-width: 0; }
.parent-name { font-size: 13px; font-weight: 900; color: #5D4B3C; }
.parent-sub { font-size: 10.5px; font-weight: 700; color: #B7A997; }

/* ---------------- routine ---------------- */
.routine-card { background: linear-gradient(160deg, #F4FBFF 0%, #FAFDFF 55%, #FFFDF8 100%); border-color: #DEEEF9; }
.progress-line { display: flex; align-items: center; gap: 10px; margin-top: 12px; }
.bar { flex: 1; height: 12px; border-radius: 999px; background: #F0F4EE; overflow: hidden; box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.04); }
.bar i { display: block; height: 100%; border-radius: 999px; background: linear-gradient(90deg, #A6D6F2, #7BB9E0); transition: width 0.3s ease; }
.progress-line span { font-size: 12px; font-weight: 900; color: #5C7E96; white-space: nowrap; }

.kid-routine { padding: 14px; }
.rt-head { display: flex; align-items: center; gap: 10px; padding-bottom: 10px; border-bottom: 1px dashed #F2E8DA; }
.rt-head .m-name { font-size: 17px; }
.m-name { display: block; margin: 0; font-size: 16px; font-weight: 800; letter-spacing: -0.4px; color: #5D4B3C; }
.m-sub { display: block; margin: 1px 0 0; font-size: 11.5px; color: #A5947F; font-weight: 700; }
.m-info { flex: 1; min-width: 0; display: block; }
.rt-stamp {
  display: inline-flex; align-items: center; gap: 3px;
  font-size: 12px; font-weight: 900; color: #A9762A;
  background: #FFF6E2; border: 1px solid #F2E1BC;
  border-radius: 999px; padding: 6px 10px; white-space: nowrap;
}
.rt-item { display: flex; align-items: center; gap: 10px; padding: 11px 0; border-top: 1px dashed #F2E8DA; }
.rt-item:first-of-type { border-top: 0; }
.check {
  width: 27px; height: 27px; flex: 0 0 auto;
  border-radius: 10px; border: 2px solid #DFD2BF; background: #fff;
  display: grid; place-items: center; color: #fff; padding: 0;
}
.check svg { width: 15px; height: 15px; }
.rt-item.done .check { background: #86C3E5; border-color: #86C3E5; }
.rt-item.done .rt-title { color: #B7A997; text-decoration: line-through; }
.rt-item.done .tag { opacity: 0.6; }
.rt-body { flex: 1 1 auto; min-width: 0; display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.rt-title { margin: 0; font-size: 14.5px; font-weight: 800; color: #5D4B3C; word-break: keep-all; }
.tag { font-size: 10.5px; font-weight: 800; color: #A08453; background: #FFF7E4; border: 1px solid #F4E7C6; border-radius: 999px; padding: 2px 8px; }
.stamp-badge {
  display: inline-flex; align-items: center; gap: 3px;
  font-size: 10.5px; font-weight: 800; color: #A9762A;
  background: #FFF7E3; border: 1px solid #F2E2C0;
  border-radius: 999px; padding: 2px 8px; white-space: nowrap;
}
.rt-actions { display: flex; gap: 5px; flex: 0 0 auto; }
.rt-actions .mini { flex: 0 0 auto; }
.add-dashed {
  width: 100%; margin-top: 10px;
  border: 1.5px dashed #E7D6BB; background: #FFFDF7; color: #A8907A;
  font: inherit; font-size: 13px; font-weight: 800; padding: 11px; border-radius: 15px;
}
.add-dashed:active { background: #FFF8E6; }

/* ---------------- schedule ---------------- */
.todo-card { border-radius: 24px; border: 1px solid var(--line); padding: 14px 13px; background: #fff; box-shadow: var(--shadow); }
.todo-card.tone-sky { background: linear-gradient(170deg, #F7FCFF, #FFFDF8); border-color: #DEEEF9; }
.todo-card.tone-pink { background: linear-gradient(170deg, #FFF8FA, #FFFDF8); border-color: #F8E3EA; }
.todo-card.tone-butter { background: linear-gradient(170deg, #FFFCF1, #FFFDF8); border-color: #F5EACC; }
.todo-card.tone-mint { background: linear-gradient(170deg, #F6FCF7, #FFFDF8); border-color: #DEEFE2; }
.todo-head { display: flex; align-items: center; gap: 9px; padding-bottom: 8px; border-bottom: 1px dashed #F2E8DA; }
.todo-item { display: flex; align-items: center; gap: 8px; padding: 9px 0; border-top: 1px dashed #F3EADC; }
.todo-list .todo-item:first-child, .day-group .todo-item:first-of-type { border-top: 0; }
.todo-item .check { border-radius: 50%; width: 26px; height: 26px; }
.todo-item.done .check { background: #8BCB9C; border-color: #8BCB9C; }
.todo-item.done .todo-title { color: #B9AB9B; text-decoration: line-through; }
.todo-title { flex: 1; margin: 0; font-size: 14px; font-weight: 700; color: #5D4B3C; word-break: keep-all; min-width: 0; }
.todo-time { font-size: 10.5px; font-weight: 900; color: #7E93A4; background: #F1F8FD; border: 1px solid #DCEBF7; border-radius: 999px; padding: 2px 7px; }

.tag.cat-academy { background: #EEF6FF; border-color: #D9E9F8; color: #4A7FA8; }
.tag.cat-school { background: #FFF6E4; border-color: #F5E4C2; color: #A5802F; }
.tag.cat-homework { background: #FFF1F5; border-color: #F8DEE6; color: #BE6880; }
.tag.cat-prep { background: #F1FAF3; border-color: #D8EEDD; color: #4E8B63; }
.tag.cat-etc { background: #F6F1FB; border-color: #E8DDF5; color: #7E68A8; }

.day-group { padding: 7px 0 3px; border-top: 1px dashed #F3EADC; }
.day-group:first-of-type { border-top: 0; }
.day-group.today { background: #FFFCF2; border-radius: 16px; padding: 7px 9px; border-top: 0; }
.day-label { margin: 2px 0 2px; font-size: 11.5px; font-weight: 900; color: #8A7A69; }
.day-group.today .day-label { color: #C1782E; }
.day-empty { margin: 2px 0 4px; font-size: 11px; font-weight: 700; color: #C4B4A2; }

/* ---------------- praise ---------------- */
.praise-card { background: linear-gradient(160deg, #FFF9F3, #FFFDF8); border-color: #F7E9D6; }
textarea.note {
  width: 100%; min-height: 62px; border: 1px solid #F1E7D8; border-radius: 15px;
  background: #fff; padding: 10px 11px; font: inherit; font-size: 13.5px; color: #5D4B3C;
  resize: vertical; outline: 0; display: block; margin-top: 9px;
}
.totals { display: block; margin: 2px 0 4px; }
.total-chip {
  display: inline-flex; align-items: center; gap: 4px; margin: 0 5px 6px 0;
  font-size: 11.5px; font-weight: 800; color: #A9762A;
  background: #FFFAEC; border: 1px solid #F2E6C9; border-radius: 999px; padding: 4px 9px 4px 4px;
}
.total-chip .avatar { width: 22px; height: 22px; border-radius: 8px; border: 0; }
.ledger-item { display: flex; align-items: center; gap: 8px; padding: 9px 0; border-top: 1px dashed #F3EADB; }
.ledger-item:first-of-type { border-top: 0; }
.ledger-text { display: block; flex: 1; min-width: 0; font-size: 12.5px; font-weight: 800; color: #5D4B3C; }
.ledger-text small { display: block; font-size: 10.5px; color: #B7A997; font-weight: 700; margin-top: 1px; }
.ledger-amount {
  flex: 0 0 auto; display: inline-flex; align-items: center; gap: 2px;
  font-size: 11.5px; font-weight: 900; color: #C77A2C;
  background: #FFF7E4; border: 1px solid #F2E2C0; border-radius: 999px; padding: 3px 8px;
}
.feed-item { display: flex; gap: 9px; padding: 10px 0; border-top: 1px dashed #F3EADB; align-items: flex-start; }
.feed-item:first-child { border-top: 0; }
.feed-body { display: block; flex: 1; min-width: 0; }
.feed-head { margin: 0; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; font-size: 12.5px; font-weight: 900; color: #5D4B3C; }
.feed-star { color: #DDB55C; }
.feed-time { margin-left: auto; font-size: 10.5px; font-weight: 700; color: #B7A997; }
.feed-text { display: block; margin: 2px 0 0; font-size: 13px; color: #7A6857; line-height: 1.45; word-break: keep-all; }

/* ---------------- calendar ---------------- */
.cal { margin-top: 4px; }
.modal-body { padding-bottom: 2px; }
.cal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
.cal-title { margin: 0; font-size: 13.5px; font-weight: 900; color: #5D4B3C; }
.cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
.cal-dow { text-align: center; font-size: 10.5px; font-weight: 800; color: #B4A291; padding: 2px 0; }
.cal-cell {
  position: relative; aspect-ratio: 1; border-radius: 12px;
  display: grid; place-items: center; font-size: 11.5px; font-weight: 800;
  color: #9A8A79; background: #FFFDF8; border: 1px solid transparent;
}
.cal-cell.empty { background: transparent; }
.cal-cell.stamped { background: #FFF3F7; border-color: #F8E0E8; color: #B5748A; }
.cal-stamp { position: absolute; top: -3px; right: -3px; width: 15px; height: 15px; display: inline-flex; }
.cal-cell.today { border-color: #C4E3F7; background: #F1FAFE; color: #4A82A8; box-shadow: 0 0 0 2px rgba(196, 227, 247, 0.4); }
.cal-count { margin: 9px 0 0; text-align: center; font-size: 11.5px; font-weight: 800; color: #A08A70; }
.cal-count b { color: #C77A2C; }

/* ---------------- chat ---------------- */
.chat-card { padding: 14px 12px; }
.chat-feed {
  max-height: 54vh; min-height: 190px; overflow-y: auto;
  padding: 10px 4px 6px; display: flex; flex-direction: column; gap: 14px;
  -webkit-overflow-scrolling: touch;
}
.bubble-row { display: flex; align-items: flex-end; gap: 7px; }
.bubble-row.mine { flex-direction: row-reverse; }
.bubble-wrap { max-width: 78%; display: flex; flex-direction: column; gap: 4px; align-items: flex-start; }
.bubble-row.mine .bubble-wrap { align-items: flex-end; }
.bubble-name { margin: 0; font-size: 10.5px; font-weight: 800; color: #B4A291; display: flex; gap: 5px; }
.bubble {
  background: #fff; border: 1px solid var(--line);
  border-radius: 17px 17px 17px 7px; padding: 9px 12px;
  font-size: 14px; color: #5D4B3C; line-height: 1.45;
  box-shadow: 0 2px 8px rgba(190, 160, 120, 0.08); word-break: break-word;
}
.bubble-row.mine .bubble {
  background: linear-gradient(180deg, #EEF8FE, #E2F2FC);
  border-color: #D3E9F7; border-radius: 17px 17px 7px 17px; color: #35618A;
}
.bubble.sticker { background: transparent; border: 0; box-shadow: none; font-size: 44px; line-height: 1.05; padding: 2px; }
.bubble-actions { display: flex; gap: 5px; }
.bubble-row.mine .bubble-actions { justify-content: flex-end; }
.react {
  border: 1px solid var(--line); background: #FFFDF8; border-radius: 999px;
  font-size: 11px; font-weight: 800; color: #C58D97; padding: 3px 8px;
  display: inline-flex; gap: 3px; align-items: center; line-height: 1.3;
}
.react.on { background: #FFF1F5; border-color: #F8DAE1; }
.react.del { color: #C9B7A7; }
.chat-composer { display: flex; gap: 7px; margin-top: 10px; }
.chat-input {
  flex: 1 1 60px; min-width: 0; border: 1px solid #F1E7D8; border-radius: 15px;
  background: #fff; padding: 11px 12px; font: inherit; font-size: 14px; color: #5D4B3C; outline: 0;
}
.send {
  flex: 0 0 auto;
  border: 0; border-radius: 15px; background: linear-gradient(180deg, #8FC7EC, #6FB2DF);
  color: #fff; font: inherit; font-size: 13.5px; font-weight: 900; padding: 0 16px;
  box-shadow: 0 4px 12px rgba(120, 180, 220, 0.3);
}
.send:active { transform: scale(0.97); }
.sticker-row { display: flex; gap: 6px; overflow-x: auto; margin-top: 9px; padding-bottom: 2px; scrollbar-width: none; }
.sticker-row::-webkit-scrollbar { display: none; }
.sticker-btn {
  flex: 0 0 auto; width: 42px; height: 42px; border-radius: 15px;
  border: 1px solid var(--line); background: #FFFBEE; font-size: 21px;
  display: grid; place-items: center; padding: 0;
}
.caption { margin: 8px 0 0; font-size: 10.5px; color: #B7A997; font-weight: 700; line-height: 1.5; }
.lock-note {
  font-size: 11px; font-weight: 800; color: #A08453; background: #FFF8E4;
  border: 1px solid #F4E7C6; border-radius: 12px; padding: 6px 9px; margin: 8px 0 0;
}

/* ---------------- empty ---------------- */
.empty { text-align: center; padding: 20px 10px; color: #B7A997; font-size: 12px; font-weight: 800; line-height: 1.6; }
.empty .emoji { font-size: 28px; display: flex; align-items: center; justify-content: center; margin-bottom: 6px; opacity: 0.9; }

/* ---------------- tabbar ---------------- */
.tabbar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 60;
  background: rgba(255, 252, 242, 0.94);
  -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px);
  border-top: 1px solid var(--line);
  padding: 6px 6px calc(6px + env(safe-area-inset-bottom));
}
.tabbar-inner { max-width: 480px; margin: 0 auto; display: grid; grid-template-columns: repeat(6, 1fr); gap: 1px; }
.tab-btn {
  display: flex; flex-direction: column; align-items: center; gap: 2px;
  padding: 6px 0 5px; border: 0; background: transparent; border-radius: 13px;
  color: #A08E7C; font-size: 9.5px; font-weight: 800; letter-spacing: -0.4px;
  line-height: 1.2;
}
.tab-btn svg { width: 23px; height: 23px; display: block; opacity: 0.85; transition: transform 0.12s ease; }
.tab-btn.on { background: #FFF2D2; color: #96701F; box-shadow: inset 0 0 0 1px #F4E5BB; }
.tab-btn.on svg { opacity: 1; transform: translateY(-1px); }

/* ---------------- modal ---------------- */
.modal-root { position: fixed; inset: 0; z-index: 100; display: flex; align-items: flex-end; justify-content: center; }
.modal-root[hidden] { display: none; }
.modal-backdrop { position: absolute; inset: 0; background: rgba(84, 66, 50, 0.32); }
.modal-sheet {
  position: relative; width: 100%; max-width: 480px; max-height: 88vh; overflow: auto;
  background: var(--cream-2);
  border-radius: 26px 26px 0 0;
  padding: 18px 16px calc(18px + env(safe-area-inset-bottom));
  box-shadow: 0 -10px 30px rgba(120, 90, 60, 0.18);
  animation: sheet-up 0.24s ease;
  -webkit-overflow-scrolling: touch;
}
@keyframes sheet-up { from { transform: translateY(24px); opacity: 0.6; } to { transform: none; opacity: 1; } }
.modal-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 12px; }
.modal-head h2 { margin: 0; font-size: 17px; font-weight: 900; letter-spacing: -0.5px; display: flex; align-items: center; gap: 5px; }
.modal-x { width: 36px; height: 36px; border-radius: 13px; border: 1px solid var(--line); background: #fff; font-size: 13px; color: #A5947F; padding: 0; }
.modal-foot { display: flex; gap: 8px; margin-top: 14px; }
.modal-foot .btn { flex: 1; }
.modal-actions-col { display: flex; flex-direction: column; gap: 8px; margin-top: 14px; }
.confirm-text { margin: 0; font-size: 13.5px; color: #7A6857; font-weight: 700; line-height: 1.6; }

.form-row { margin-bottom: 10px; }
.form-row label { display: block; font-size: 11.5px; font-weight: 800; color: #8A7A69; margin-bottom: 5px; }
.form-row input, .form-row select, .form-row textarea {
  width: 100%; border: 1px solid #F1E7D8; border-radius: 13px; background: #fff;
  padding: 10px 11px; font: inherit; font-size: 14px; color: #5D4B3C; outline: 0;
}
.form-note { font-size: 11.5px; color: #B7A997; font-weight: 700; margin: 0 0 10px; line-height: 1.5; }
.form-err { color: #D98397; font-size: 11.5px; font-weight: 800; margin: 6px 0 0; }

.member-row {
  display: flex; align-items: center; gap: 10px; width: 100%;
  background: #fff; border: 1px solid var(--line); border-radius: 16px;
  padding: 8px 10px; box-shadow: var(--shadow-sm);
  text-align: left; font: inherit;
}
.member-row:active { transform: scale(0.995); }

.edit-list { display: flex; flex-direction: column; gap: 8px; margin-bottom: 12px; }
.edit-row { display: flex; align-items: center; gap: 8px; background: #fff; border: 1px solid var(--line); border-radius: 17px; padding: 8px 10px; }
.edit-fields { display: flex; flex-direction: column; gap: 4px; flex: 1; min-width: 0; }
.edit-input {
  border: 1px solid #F1E7D8; border-radius: 10px; padding: 6px 8px;
  font: inherit; font-size: 13.5px; font-weight: 800; color: #5D4B3C;
  background: #FFFDF9; outline: 0; width: 100%;
}
.edit-input.small { font-size: 11.5px; font-weight: 700; color: #8A7A69; }
.edit-select {
  border: 1px solid #F1E7D8; border-radius: 10px; padding: 6px 4px;
  font: inherit; font-size: 11px; font-weight: 800; color: #7A6857;
  background: #fff; max-width: 82px;
}

.fixed-add { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-bottom: 14px; }
.fixed-add select, .fixed-add input {
  border: 1px solid #F1E7D8; border-radius: 11px; padding: 8px;
  font: inherit; font-size: 12.5px; background: #fff; color: #5D4B3C; outline: 0; min-width: 0; width: 100%;
}
.fixed-add .btn { grid-column: 1 / -1; }
.fixed-group { margin-bottom: 12px; }
.fixed-name { margin: 0 0 4px; font-size: 11.5px; font-weight: 900; color: #8A7A69; }
.fixed-kind { margin: 6px 0 2px; font-size: 11px; font-weight: 900; color: #A0886E; }
.fixed-item { display: flex; align-items: center; gap: 6px; padding: 7px 0; border-top: 1px dashed #F3EADB; font-size: 13px; font-weight: 800; color: #5D4B3C; }
.fixed-item .tag { margin-left: 0; }
.fixed-item .mini-x { margin-left: auto; }

/* ---------------- routine: 오늘의 영어단어 ---------------- */
.word-card { background: linear-gradient(160deg, #F7FCF8 0%, #FCFEFC 55%, #FFFDF8 100%); border-color: #DFEEE2; }
.word-list { display: flex; flex-direction: column; gap: 8px; margin-bottom: 10px; }
.word-row {
  display: flex; align-items: center; gap: 9px;
  padding: 9px 10px; border-radius: 15px;
  background: #fff; border: 1px solid #EAF1E9; box-shadow: 0 2px 8px rgba(150, 180, 155, 0.08);
}
.word-row.done { background: #F5FBF6; border-color: #D6EBDC; }
.word-body { flex: 1 1 auto; min-width: 0; }
.word-en { margin: 0; display: flex; align-items: center; gap: 5px; font-size: 16px; font-weight: 900; color: #3F6B52; letter-spacing: -0.2px; }
.speak {
  flex: 0 0 auto; width: 26px; height: 26px; padding: 0; border-radius: 9px;
  border: 1px solid #CFE6D6; background: #F2FBF4; font-size: 12px; line-height: 1;
}
.speak:active { transform: scale(0.94); }
.word-meaning { margin: 1px 0 0; font-size: 12.5px; font-weight: 900; color: #7A6857; }
.word-ex { margin: 2px 0 0; font-size: 11px; font-weight: 600; color: #A08E7C; line-height: 1.45; word-break: break-word; }
.word-check {
  flex: 0 0 auto; min-width: 74px; padding: 8px 9px; border-radius: 999px;
  border: 1px solid #DFD2BF; background: #FFFDF8; color: #A08A70;
  font: inherit; font-size: 10.5px; font-weight: 900; line-height: 1.2;
}
.word-check.on { background: #E4F6E8; border-color: #BCE3C6; color: #3F8B5C; }

.quiz-box { margin-top: 12px; padding: 13px 12px; border-radius: 20px; background: #FFFFFF; border: 1px solid #E3EEE5; box-shadow: var(--shadow-sm); }
.quiz-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.quiz-dots { display: flex; gap: 4px; }
.quiz-dot { width: 8px; height: 8px; border-radius: 50%; background: #EFE6D8; }
.quiz-dot.now { background: #86C79B; box-shadow: 0 0 0 3px rgba(134, 199, 155, 0.2); }
.quiz-dot.past { background: #CBE7D3; }
.quiz-dot.next { background: #F1E9DC; }
.quiz-count { font-size: 10.5px; font-weight: 900; color: #8FA396; white-space: nowrap; }
.quiz-ask { margin: 9px 0 0; font-size: 11px; font-weight: 800; color: #9AAFA0; }
.quiz-prompt { margin: 2px 0 0; font-size: 24px; font-weight: 900; color: #35644A; letter-spacing: -0.6px; }
.quiz-opts { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; margin-top: 10px; }
.quiz-opt {
  padding: 11px 8px; border-radius: 14px; border: 1px solid #E7DFD2; background: #FFFDF8;
  font: inherit; font-size: 13px; font-weight: 800; color: #6B5A4C; text-align: center;
  word-break: keep-all;
}
.quiz-opt:active { transform: scale(0.98); }
.quiz-opt.right { background: #E4F6E8; border-color: #BCE3C6; color: #3F8B5C; }
.quiz-opt.wrong { background: #FFEDF1; border-color: #F8C9D5; color: #C4637E; }
.quiz-feedback { margin: 10px 0 0; font-size: 12px; font-weight: 800; color: #A08E7C; text-align: center; }
.quiz-feedback.ok { color: #3F8B5C; }
.quiz-feedback.no { color: #C4637E; }
.quiz-emoji { margin: 0; text-align: center; font-size: 30px; line-height: 1.2; }
.quiz-score { margin: 2px 0 0; text-align: center; font-size: 14px; font-weight: 900; color: #5D4B3C; }
.quiz-score b { color: #C77A2C; font-size: 18px; }
.quiz-msg { margin: 6px 0 10px; text-align: center; font-size: 12px; font-weight: 700; color: #8A7A69; line-height: 1.5; }

/* ---------------- snack ---------------- */
.snack-summary { background: linear-gradient(165deg, #FFF9F0 0%, #FFFDF8 55%, #FFF7F2 100%); border-color: #F6E5D2; }
.snack-summary.level-warn { background: linear-gradient(165deg, #FFF7EC 0%, #FFFDF8 60%, #FFF3E4 100%); border-color: #F3DDBC; }
.snack-summary.level-danger { background: linear-gradient(165deg, #FFF0F2 0%, #FFFDF8 60%, #FFEDF0 100%); border-color: #F6D2DA; }
.snack-badge {
  font-size: 11.5px; font-weight: 900; padding: 5px 11px; border-radius: 999px;
  border: 1px solid #DFD2BF; background: #FFFDF8; color: #8A7A69;
}
.snack-badge.level-good { background: #EAF8EE; border-color: #C3E6CE; color: #3F8B5C; }
.snack-badge.level-warn { background: #FFF3E0; border-color: #F4DCB4; color: #B98335; }
.snack-badge.level-danger { background: #FFE9EE; border-color: #F7C7D3; color: #C4526E; }
.snack-stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin: 4px 0 2px; }
.snack-stat {
  display: flex; flex-direction: column; align-items: center; gap: 1px;
  padding: 8px 2px; border-radius: 13px; background: #FFFFFF;
  border: 1px solid #F1E7D8;
}
.snack-stat .ss-num { font-size: 17px; font-weight: 900; color: #6B5A4C; letter-spacing: -0.6px; line-height: 1.15; }
.snack-stat .ss-label { font-size: 9.5px; font-weight: 800; color: #AC9C8C; white-space: nowrap; }
.snack-stat.big { background: #FFF7E4; border-color: #F2E1BC; }
.snack-stat.big .ss-num { color: #C77A2C; font-size: 19px; }
.cube-wall {
  display: flex; flex-wrap: wrap; align-items: center; gap: 4px;
  min-height: 42px; margin: 11px 0 4px; padding: 9px;
  border-radius: 15px; background: rgba(255, 255, 255, 0.8); border: 1px dashed #EFDDC6;
}
.cube-wall.hot { background: #FFF5F7; border-color: #F6CEDA; }
.cube {
  width: 13px; height: 13px; border-radius: 3px; flex: 0 0 auto;
  background: linear-gradient(160deg, #FFFFFF 0%, #FFF3DC 46%, #F3E3C7 100%);
  border: 1px solid #E4D3B4; box-shadow: inset 0 -1px 0 rgba(200, 175, 140, 0.5);
}
.cube-wall.hot .cube { background: linear-gradient(160deg, #FFFFFF 0%, #FFE6EC 46%, #F7C9D5 100%); border-color: #EDB9C7; }
.cube-more { font-size: 10.5px; font-weight: 900; color: #C4526E; background: #FFE9EE; border-radius: 999px; padding: 2px 7px; }
.cube-note { font-size: 11.5px; font-weight: 800; color: #B7A997; }
.limit-line { display: flex; align-items: center; gap: 8px; margin-top: 7px; }
.limit-line .bar { height: 9px; background: #F5EEE3; }
.limit-line .bar i { background: linear-gradient(90deg, #F7D98E, #E8A25C); }
.limit-line span { font-size: 10.5px; font-weight: 900; color: #A08A70; white-space: nowrap; }
.snack-alert {
  margin: 10px 0 0; padding: 9px 11px; border-radius: 13px;
  font-size: 12px; font-weight: 900; line-height: 1.45;
  background: #F4FBF5; border: 1px solid #D8EEDD; color: #4E8B63;
}
.snack-alert.level-warn { background: #FFF8EC; border-color: #F4E2C2; color: #B98335; }
.snack-alert.level-danger { background: #FFF0F3; border-color: #F7CFDA; color: #C4526E; }

.snack-search {
  width: 100%; border: 1px solid #F1E7D8; border-radius: 15px; background: #fff;
  padding: 11px 12px; font: inherit; font-size: 14px; color: #5D4B3C; outline: 0;
  -webkit-appearance: none; appearance: none;
}
.snack-results { margin-top: 9px; }
.snack-hint { margin: 0 0 6px; font-size: 10.5px; font-weight: 800; color: #B7A997; }
.snack-none { padding: 10px 4px; font-size: 11.5px; font-weight: 700; color: #B7A997; line-height: 1.6; }
.snack-hit {
  display: flex; align-items: center; gap: 9px; width: 100%;
  padding: 8px 9px; margin-bottom: 6px; border-radius: 14px;
  border: 1px solid #F1E7D8; background: #FFFDF9; text-align: left; font: inherit;
}
.snack-hit:active { background: #FFF7E6; }
.hit-emoji { font-size: 19px; flex: 0 0 auto; line-height: 1; }
.hit-body { flex: 1; min-width: 0; display: block; }
.hit-name { display: block; font-size: 13.5px; font-weight: 900; color: #5D4B3C; }
.hit-meta { display: block; font-size: 10.5px; font-weight: 700; color: #A5947F; }
.hit-add {
  flex: 0 0 auto; width: 28px; height: 28px; border-radius: 10px;
  display: grid; place-items: center; font-size: 16px; font-weight: 900;
  background: #EAF6EE; color: #4E8B63; border: 1px solid #CFE8D7;
}

.snack-day { padding: 14px 13px; }
.snack-item { display: flex; align-items: center; gap: 8px; padding: 9px 0; border-top: 1px dashed #F2E8DA; }
.snack-item:first-of-type { border-top: 0; }
.si-emoji { font-size: 18px; flex: 0 0 auto; line-height: 1; }
.si-body { flex: 1 1 auto; min-width: 0; }
.si-name { margin: 0; font-size: 13.5px; font-weight: 900; color: #5D4B3C; }
.si-unit { font-size: 10px; font-weight: 800; color: #AC9C8C; }
.si-meta { margin: 1px 0 0; font-size: 10.5px; font-weight: 700; color: #A5947F; }
.si-qty { display: flex; align-items: center; gap: 4px; flex: 0 0 auto; }
.qty-btn {
  width: 26px; height: 26px; border-radius: 9px; padding: 0;
  border: 1px solid #E3D6C3; background: #FFFDF8; color: #8A7A69;
  font: inherit; font-size: 13px; font-weight: 900; line-height: 1;
}
.qty-btn:active { transform: scale(0.94); }
.qty-num { min-width: 18px; text-align: center; font-size: 13px; font-weight: 900; color: #5D4B3C; }
.snack-sum { margin: 10px 0 0; padding-top: 9px; border-top: 1px dashed #F2E8DA; font-size: 11.5px; font-weight: 900; color: #A9762A; text-align: right; }

/* ---------------- toast ---------------- */
.toast {
  position: fixed; left: 50%; bottom: calc(96px + env(safe-area-inset-bottom));
  transform: translate(-50%, 16px);
  background: rgba(93, 75, 60, 0.95); color: #FFF9EC;
  font-size: 12.5px; font-weight: 800; padding: 10px 16px; border-radius: 999px;
  opacity: 0; pointer-events: none; transition: 0.24s ease; z-index: 200;
  max-width: 86vw; text-align: center;
}
.toast.on { opacity: 1; transform: translate(-50%, 0); }

@media (min-width: 520px) {
  .app { margin: 18px auto; }
}
@media (prefers-reduced-motion: reduce) {
  * { animation: none !important; transition: none !important; }
}

  function fmtTime(ts) {

    const shift = (d.getDay() + 6) % 7; /* Monday first */

    const out = [];

  const round1 = (n) => Math.round((Number(n) || 0) * 10) / 10;
  function snackCatMeta(cat) {
    for (let i = 0; i < SNACK_CATS.length; i++) if (SNACK_CATS[i].v === cat) return SNACK_CATS[i];

  /* 한글 이름의 첫소리(초성)만 뽑아서 'ㅎㄹㅂ' 같은 검색도 되게 해요 */
  function chosung(s) {
    const cho = ['ㄱ', 'ㄲ', 'ㄴ', 'ㄷ', 'ㄸ', 'ㄹ', 'ㅁ', 'ㅂ', 'ㅃ', 'ㅅ', 'ㅆ', 'ㅇ', 'ㅈ', 'ㅉ', 'ㅊ', 'ㅋ', 'ㅌ', 'ㅍ', 'ㅎ'];
    let out = '';
    const t = String(s || '');
    for (let i = 0; i < t.length; i++) {
      const c = t.charCodeAt(i);
      if (c >= 0xAC00 && c <= 0xD7A3) out += cho[Math.floor((c - 0xAC00) / 588)];
      else if (c >= 0x3131 && c <= 0x314E) out += t.charAt(i);
    }
    return out;
  }
  function snackMatch(item, q) {
    const query = String(q || '').replace(/\s+/g, '').toLowerCase();
    if (!query) return true;
    const flat = String(item.name || '').replace(/\s+/g, '').toLowerCase();
    if (flat.indexOf(query) >= 0) return true;
    if (/^[\u3131-\u314E]+$/.test(query)) return chosung(item.name).indexOf(query) >= 0;
    return false;
  }

    const out = [];

      out.push(db[i]);
      if (limit && out.length >= limit) break;
    }
    return out;

    const list = snackListRead(memberId, key);

    list.forEach((s) => {
      const q = Math.max(1, toInt(s.qty, 1));

      sugar += (Number(s.sugar) || 0) * q;

  function wordLessons(childId) {
    const bank = WORD_BANK[childId] || WORD_BANK.sia;
    const out = [];
    for (let i = 0; i + WORDS_PER_DAY <= bank.length; i += WORDS_PER_DAY) {
      out.push(bank.slice(i, i + WORDS_PER_DAY).map((w) => ({ w: w[0], m: w[1], e: w[2] })));
    }
    return out;
  }
  function daySerial(key) {
    const p = String(key || tKey()).split('-');
    const d = new Date(toInt(p[0], 2026), toInt(p[1], 1) - 1, toInt(p[2], 1));
    const base = new Date(2026, 0, 1);
    return Math.round((d.getTime() - base.getTime()) / 86400000);
  }
  function wordsForDay(childId, key) {
    const lessons = wordLessons(childId);
    if (!lessons.length) return [];
    const i = ((daySerial(key) % lessons.length) + lessons.length) % lessons.length;

    if (!state.words[k] || typeof state.words[k] !== 'object') { if (!create) return null; state.words[k] = {}; }
    const day = state.words[k];
    if (!day[memberId] || typeof day[memberId] !== 'object') { if (!create) return null; day[memberId] = { done: [], quiz: null }; }
    if (!Array.isArray(day[memberId].done)) day[memberId].done = [];
    return day[memberId];
  }
  function wordProgress(memberId, key) {
    const rec = wordRec(memberId, key, false);
    return rec ? { done: rec.done, quiz: rec.quiz || null } : { done: [], quiz: null };
  }
  function missionIdxFor(childId, key) {
    const s = String(childId) + '|' + key;
    let h = 7;
    for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) % 100003;
    return h % MISSIONS.length;
  }

  /* ------------------------- state ------------------------- */
  let state = null;
  let hadLocalCache = false;
  let currentTab = 'home';
  let calSet = 'sia';
  let calCursor = startOfMonth(new Date());
  let chatDraft = '';
  let praiseDraft = '';
  let schedFilter = 'all';
  let pendingConfirm = null;
  let toastTimer = null;
  let snackQuery = '';
  /* 인게임 영단어 맞추기 — 화면을 다시 그려도 문제가 그대로 남도록 여기에 둠 */
  const quiz = { child: '', stage: 'idle', items: [], idx: 0, score: 0, streak: 0, picked: -1 };

  function kidsOf(st) {
    return (st || state).members.filter((m) => m.role === 'child');
  }
  function childIdsOf(st) {
    return kidsOf(st).map((m) => m.id);
  }
  function children() { return kidsOf(state); }
  function parents() { return state.members.filter((m) => m.role !== 'child'); }
  function safeChild(id) {
    const kids = children();
    for (let i = 0; i < kids.length; i++) if (kids[i].id === id) return kids[i];
    return kids[0] || state.members[0];
  }

  function blankState() {
    const st = {
      v: 2,
      createdAt: Date.now(),
      updatedAt: Date.now(),
      lastSeen: tKey(),
      members: DEFAULT_MEMBERS.map((m) => Object.assign({}, m)),
      weather: { place: '우리 동네', temp: 11, cond: '맑음', low: 6, high: 15, dust: '초미세먼지 보통', tip: '😷 마스크 챙겨요' },
      fixed: {},
      routines: {},
      todos: {},
      missions: {},
      snacks: {},
      snackCustom: [],
      words: {},
      stampLog: [],
      praise: [],
      chat: [],
      chatLock: false,
      viewer: 'sia',
      upgraded: 2,
      active: { routine: 'sia', snack: 'sia', schedule: 'sia', stamp: 'sia', cal: 'sia' },
      praiseTarget: 'sia'
    };
    Object.keys(DEFAULT_FIXED).forEach((k) => {
      st.fixed[k] = DEFAULT_FIXED[k].map((f) => ({
        id: uid('fx'), title: f.title, tag: f.tag || '', stamp: clamp(toInt(f.stamp, 1), 1, 20), kind: normKind(f.kind)
      }));
    });
    ensureDay(st, tKey(), true);
    return st;
  }

  function ensureDay(st, key, seedSamples) {
    const kids = childIdsOf(st);
    if (!st.routines[key] || typeof st.routines[key] !== 'object') {
      st.routines[key] = {};
      kids.forEach((id) => {
        st.routines[key][id] = (st.fixed[id] || []).map((f) => ({
          id: uid('rt'), title: f.title, tag: f.tag || '', stamp: f.stamp == null ? 1 : f.stamp,
          kind: normKind(f.kind), done: false, fixedId: f.id, logId: null
        }));
      });
    }
    if (!st.todos[key] || typeof st.todos[key] !== 'object') {
      st.todos[key] = {};
      kids.forEach((id) => {
        const seed = (seedSamples && SAMPLE_TODOS[id]) ? SAMPLE_TODOS[id] : [];
        st.todos[key][id] = seed.map((t) => ({ id: uid('td'), title: t.t, cat: normCat(t.c), at: '', done: false }));
      });
    }
    if (!st.missions[key] || typeof st.missions[key] !== 'object') st.missions[key] = {};
    kids.forEach((id) => {
      if (!Array.isArray(st.routines[key][id])) st.routines[key][id] = [];
      if (!Array.isArray(st.todos[key][id])) st.todos[key][id] = [];
      const mi = st.missions[key][id];
      if (!mi || typeof mi !== 'object' || mi.idx == null) {
        st.missions[key][id] = { idx: missionIdxFor(id, key), done: false, logId: null };
      }
    });
    /* 엄마·아빠에게는 루틴·일정·미션이 없어요 (예전 기록이 남아 있으면 지워요) */
    [st.routines[key], st.todos[key], st.missions[key]].forEach((bucket) => {
      Object.keys(bucket).forEach((id) => { if (kids.indexOf(id) < 0) delete bucket[id]; });
    });
  }

  function load() {
    let raw = null;
    try { raw = JSON.parse(localStorage.getItem(STORE_KEY) || 'null'); } catch (e) { raw = null; }
    hadLocalCache = !!(raw && typeof raw === 'object');
    const st = normalizeState(raw);
    applyDevicePrefs(st, loadDevicePrefs(raw));
    return st;
  }

  /* 어떤 모양의 저장값이든 화면이 그릴 수 있는 상태로 다듬어요.
     예전 기록(식사·건강·엄마아빠 루틴/도장)은 조용히 버려요. */
  function normalizeState(raw) {
    const base = blankState();
    boardDirty = false;
    if (!raw || typeof raw !== 'object') return base;
    const st = Object.assign({}, base, raw);

    const list = (Array.isArray(raw.members) && raw.members.length) ? raw.members : base.members;
    st.members = list.slice(0, 6).map((m, i) => {
      const id = String(m.id || ('m' + i));
      let role = m.role === 'child' || m.role === 'parent' ? m.role : null;
      if (!role) role = (id === 'mom' || id === 'dad' || i >= 2) ? 'parent' : 'child';
      if (id === 'sia' || id === 'ayun') role = 'child';
      if (id === 'mom' || id === 'dad') role = 'parent';
      return {
        id: id,
        name: String(m.name || '가족').slice(0, 12),
        sub: String(m.sub || '').slice(0, 20),
        avatar: avatarOf(m.avatar, id, role),
        tone: ['sky', 'butter', 'pink', 'mint'].indexOf(m.tone) >= 0 ? m.tone : ['sky', 'butter', 'pink', 'mint'][i % 4],
        role: role
      };
    });
    st.members.forEach((m) => { if (OLD_SUBS[m.sub]) { m.sub = OLD_SUBS[m.sub]; boardDirty = true; } });
    const kids = childIdsOf(st);

    /* 정리해야 할 예전 기록이 남아 있는지 살펴봐요 (정리 뒤 가족에게 한 번 올리려고) */
    if (['meals', 'mealMemo', 'health', 'missionTotal'].some((k) => raw[k] !== undefined)) boardDirty = true;
    if (['fixed', 'routines', 'todos', 'missions'].some((k) => {
      const bucket = raw[k];
      if (!bucket || typeof bucket !== 'object') return false;
      if (k === 'fixed') return Object.keys(bucket).some((id) => kids.indexOf(id) < 0);
      return Object.keys(bucket).some((day) => bucket[day] && typeof bucket[day] === 'object' &&
        Object.keys(bucket[day]).some((id) => kids.indexOf(id) < 0));
    })) boardDirty = true;
    if ((Array.isArray(raw.stampLog) ? raw.stampLog : []).some((e) => e && kids.indexOf(e.memberId) < 0)) boardDirty = true;
    if ((Array.isArray(raw.praise) ? raw.praise : []).some((p) => p && kids.indexOf(p.memberId) < 0)) boardDirty = true;

    /* 없어진 화면의 기록은 남기지 않아요 */
    ['meals', 'mealMemo', 'health', 'missionTotal'].forEach((k) => { delete st[k]; });

    ['fixed', 'routines', 'todos', 'missions'].forEach((k) => {
      if (!st[k] || typeof st[k] !== 'object' || Array.isArray(st[k])) st[k] = {};
    });

    const fixed = {};
    kids.forEach((id) => {
      const arr = Array.isArray(st.fixed[id]) ? st.fixed[id] : [];
      fixed[id] = arr.filter((f) => f && typeof f === 'object' && f.title).map((f) => ({
        id: f.id || uid('fx'),
        title: String(f.title).slice(0, 30),
        tag: String(f.tag || '').slice(0, 12),
        stamp: clamp(toInt(f.stamp, 1), 1, 20),
        kind: normKind(f.kind)
      }));
    });
    st.fixed = fixed;

    const routines = {};
    Object.keys(st.routines).forEach((day) => {
      const src = st.routines[day];
      if (!src || typeof src !== 'object' || Array.isArray(src)) return;
      const out = {};
      kids.forEach((id) => {
        out[id] = (Array.isArray(src[id]) ? src[id] : []).filter((it) => it && typeof it === 'object' && it.title).map((it) => ({
          id: it.id || uid('rt'),
          title: String(it.title).slice(0, 30),
          tag: String(it.tag || '').slice(0, 12),
          stamp: clamp(toInt(it.stamp, 1), 1, 20),
          kind: normKind(it.kind),
          done: !!it.done,
          fixedId: it.fixedId || null,
          logId: it.logId || null
        }));
      });
      routines[day] = out;
    });
    st.routines = routines;

    const todos = {};
    Object.keys(st.todos).forEach((day) => {
      const src = st.todos[day];
      if (!src || typeof src !== 'object' || Array.isArray(src)) return;
      const out = {};
      kids.forEach((id) => {
        out[id] = (Array.isArray(src[id]) ? src[id] : []).filter((t) => t && typeof t === 'object' && t.title).map((t) => ({
          id: t.id || uid('td'),
          title: String(t.title).slice(0, 40),
          cat: normCat(t.cat, t.title),
          at: String(t.at || '').slice(0, 5),
          done: !!t.done
        }));
      });
      todos[day] = out;
    });
    st.todos = todos;

    const missions = {};
    Object.keys(st.missions).forEach((day) => {
      const src = st.missions[day];
      if (!src || typeof src !== 'object' || Array.isArray(src)) return;
      const out = {};
      kids.forEach((id) => {
        const mi = src[id];
        out[id] = (mi && typeof mi === 'object' && mi.idx != null)
          ? { idx: clamp(toInt(mi.idx, 0), 0, MISSIONS.length - 1), done: !!mi.done, logId: mi.logId || null }
          : { idx: missionIdxFor(id, day), done: false, logId: null };
      });
      missions[day] = out;
    });
    st.missions = missions;

    /* 간식 기록 — 날짜 · 아이별로 이름·분류·기준량·칼로리·당류·개수만 남겨요 */
    const snacks = {};
    Object.keys((raw.snacks && typeof raw.snacks === 'object') ? raw.snacks : {}).forEach((day) => {
      if (!isDayKey(day)) return;
      const src = raw.snacks[day];
      if (!src || typeof src !== 'object' || Array.isArray(src)) return;
      const out = {};
      kids.forEach((id) => {
        out[id] = (Array.isArray(src[id]) ? src[id] : []).filter((s) => s && typeof s === 'object' && s.name).map((s) => ({
          id: s.id || uid('sn'),
          name: String(s.name).slice(0, 24),
          cat: normSnackCat(s.cat),
          unit: String(s.unit || '1개').slice(0, 12),
          kcal: clamp(toInt(s.kcal, 0), 0, 2000),
          sugar: round1(Math.max(0, Number(s.sugar) || 0)),
          qty: clamp(toInt(s.qty, 1), 1, 20),
          at: toInt(s.at, Date.now())
        }));
      });
      snacks[day] = out;
    });
    st.snacks = snacks;

    /* 직접 적어 넣은 간식 — 다음에도 검색되도록 따로 기억해요 */
    st.snackCustom = (Array.isArray(raw.snackCustom) ? raw.snackCustom : [])
      .filter((s) => s && typeof s === 'object' && s.name)
      .slice(0, 40)
      .map((s) => ({
        id: s.id || uid('csn'),
        name: String(s.name).slice(0, 24),
        cat: 'custom',
        unit: String(s.unit || '1개').slice(0, 12),
        kcal: clamp(toInt(s.kcal, 0), 0, 2000),
        sugar: round1(Math.max(0, Number(s.sugar) || 0))
      }));

    /* 오늘의 영단어 — 외운 단어와 퀴즈 점수만 남겨요 */
    const words = {};
    Object.keys((raw.words && typeof raw.words === 'object') ? raw.words : {}).forEach((day) => {
      if (!isDayKey(day)) return;
      const src = raw.words[day];
      if (!src || typeof src !== 'object' || Array.isArray(src)) return;
      const out = {};
      kids.forEach((id) => {
        const rec = src[id];
        const done = (rec && Array.isArray(rec.done)) ? rec.done.filter((x) => typeof x === 'string').slice(0, 20).map((x) => String(x).slice(0, 24)) : [];
        const q = (rec && rec.quiz && typeof rec.quiz === 'object')
          ? { score: clamp(toInt(rec.quiz.score, 0), 0, 10), total: clamp(toInt(rec.quiz.total, WORDS_PER_DAY), 1, 10), at: toInt(rec.quiz.at, 0) }
          : null;
        out[id] = { done: done, quiz: q };
      });
      words[day] = out;
    });
    st.words = words;

    st.stampLog = (Array.isArray(raw.stampLog) ? raw.stampLog : [])
      .filter((e) => e && typeof e === 'object' && kids.indexOf(e.memberId) >= 0)
      .map((e) => ({
        id: e.id || uid('sl'),
        memberId: e.memberId,
        kind: e.kind || 'routine',
        text: String(e.text || '').slice(0, 120),
        amount: clamp(toInt(e.amount, 1), 1, 20),
        at: toInt(e.at, Date.now())
      }));

    st.praise = (Array.isArray(raw.praise) ? raw.praise : [])
      .filter((p) => p && typeof p === 'object' && kids.indexOf(p.memberId) >= 0)
      .map((p) => ({
        id: p.id || uid('pr'),
        memberId: p.memberId,
        from: memberIdInList(p.from, st.members) ? p.from : (parentsOf(st)[0] ? parentsOf(st)[0].id : kids[0]),
        text: String(p.text || '').slice(0, 120),
        at: toInt(p.at, Date.now()),
        logId: p.logId || null
      }));

    st.chat = (Array.isArray(raw.chat) ? raw.chat : [])
      .filter((c) => c && typeof c === 'object' && memberIdInList(c.memberId, st.members))
      .map((c) => ({
        id: c.id || uid('ms'),
        memberId: c.memberId,
        type: c.type === 'sticker' ? 'sticker' : 'text',
        text: String(c.text || '').slice(0, 300),
        at: toInt(c.at, Date.now()),
        hearts: Array.isArray(c.hearts) ? c.hearts.filter((h) => memberIdInList(h, st.members)) : []
      }));

    st.weather = Object.assign({}, base.weather, (raw.weather && typeof raw.weather === 'object') ? raw.weather : {});
    st.v = 2;
    st.updatedAt = toInt(raw.updatedAt, 0);
    st.chatLock = !!raw.chatLock;
    st.viewer = memberIdInList(raw.viewer, st.members) ? raw.viewer : kids[0];

    const active = (raw.active && typeof raw.active === 'object') ? raw.active : {};
    st.active = {
      routine: kids.indexOf(active.routine) >= 0 ? active.routine : kids[0],
      snack: kids.indexOf(active.snack) >= 0 ? active.snack : kids[0],
      schedule: kids.indexOf(active.schedule) >= 0 ? active.schedule : kids[0],
      stamp: kids.indexOf(active.stamp) >= 0 ? active.stamp : kids[0],
      cal: kids.indexOf(active.cal) >= 0 ? active.cal : kids[0]
    };
    st.praiseTarget = kids.indexOf(raw.praiseTarget) >= 0 ? raw.praiseTarget : kids[0];
    /* 예전 보드(v1)에서 올라온 기록은 생활 루틴을 한 번만 채워 넣어요 */
    if (toInt(raw.v, 1) < 2) upgradeBoard(st);
    st.upgraded = 2;
    return st;
  }

  /* 공부 루틴만 있던 예전 기록에 생활 루틴을 더해 두 갈래를 갖추게 해요 */
  function upgradeBoard(st) {
    const key = tKey();
    childIdsOf(st).forEach((id) => {
      const defaults = DEFAULT_FIXED[id] || [];
      if (!Array.isArray(st.fixed[id])) st.fixed[id] = [];
      const fx = st.fixed[id];
      if (!fx.length || !fx.some((f) => f.kind === KIND_LIFE)) {
        defaults.filter((d) => !fx.length || d.kind === KIND_LIFE).forEach((d) => {
          if (!fx.some((f) => f.title === d.title)) {
            fx.push({ id: uid('fx'), title: d.title, tag: d.tag, stamp: d.stamp, kind: d.kind });
            boardDirty = true;
          }
        });
      }
      const list = st.routines[key] && st.routines[key][id];
      if (Array.isArray(list) && !list.some((i) => i.kind === KIND_LIFE)) {
        defaults.filter((d) => !list.length || d.kind === KIND_LIFE).forEach((d) => {
          if (!list.some((i) => i.title === d.title)) {
            const f = fx.find((x) => x.title === d.title);
            list.push({
              id: uid('rt'), title: d.title, tag: d.tag, stamp: d.stamp, kind: d.kind,
              done: false, fixedId: f ? f.id : null, logId: null
            });
            boardDirty = true;
          }
        });
      }
    });
    return st;
  }

  function parentsOf(st) { return (st || state).members.filter((m) => m.role !== 'child'); }
  function memberIdInList(id, members) {
    if (!id) return false;
    for (let i = 0; i < members.length; i++) if (members[i].id === id) return true;
    return false;
  }
  /* 예전 캐릭터(고양이·곰돌이)는 새 캐릭터로 옮겨요 */
  function avatarOf(avatar, id, role) {
    if (avatar === 'cat') return id === 'ayun' ? 'shisa' : 'usagi';
    if (avatar === 'bear') return id === 'sia' ? 'usagi' : 'shisa';
    if (AVATAR_VALUES.indexOf(avatar) >= 0) return avatar;
    return role === 'child' ? (id === 'ayun' ? 'shisa' : 'usagi') : 'bunny';
  }

  function save() {
    persistLocal();
    queuePush();
  }

  /* ------------------------- realtime sync ------------------------- */
  function readRoomId() {
    let raw = '';
    try {
      if (typeof location !== 'undefined' && location) {
        const search = String(location.search || '');
        const hash = String(location.hash || '');
        const m = search.match(/[?&]room=([^&#]+)/) || hash.match(/[#?&]room=([^&#]+)/);
        if (m) raw = decodeURIComponent(m[1]);
      }
    } catch (e) { raw = ''; }
    const clean = String(raw).toLowerCase().replace(/[^a-z0-9_-]/g, '').slice(0, 64);
    return clean || DEFAULT_ROOM;
  }

  let fbRef = null;
  let fbConnected = false;
  let syncMode = 'local';
  let unsynced = false;
  let firstSnap = true;
  let applyingRemote = false;
  let boardDirty = false;      /* 예전 기록을 정리했다면, 정리된 모습을 가족에게 한 번만 알려요 */
  let pendingRender = false;
  let pushTimer = null;
  let recentPushes = [];
  let lastRemoteSig = '';

  function syncFootText() {
    return syncMode === 'live'
      ? '도장과 기록은 가족 모두와 실시간으로 나눠요'
      : '지금은 이 기기에만 저장돼요 · 연결되면 가족과 자동으로 나눠요';
  }

  function setSyncMode(mode) {
    syncMode = mode;
    const pill = qs('#syncPill');
    if (pill) {
      pill.setAttribute('data-state', mode);
      const label = qs('.sync-label', pill);
      if (label) label.textContent = mode === 'live' ? '실시간' : (mode === 'connecting' ? '연결 중' : '로컬');
      pill.setAttribute('title', mode === 'live' ? '가족 모두와 실시간으로 연결돼 있어요' : '이 기기에만 저장하고 있어요');
    }
    const foot = qs('#syncFoot');
    if (foot) foot.textContent = syncFootText();
  }

  function devicePrefs() {
    const out = {};
    DEVICE_KEYS.forEach((k) => { if (state[k] !== undefined) out[k] = state[k]; });
    return out;
  }

  function loadDevicePrefs(sharedRaw) {
    let raw = null;
    try { raw = JSON.parse(localStorage.getItem(STORE_DEV_KEY) || 'null'); } catch (e) { raw = null; }
    if (raw && typeof raw === 'object') return raw;
    return (sharedRaw && typeof sharedRaw === 'object') ? sharedRaw : null;   /* 예전 한 파일 저장에서 옮겨와요 */
  }

  function applyDevicePrefs(st, raw) {
    if (!raw || typeof raw !== 'object') return st;
    if (raw.active && typeof raw.active === 'object') {
      const kids = childIdsOf(st);
      ['routine', 'snack', 'schedule', 'stamp', 'cal'].forEach((k) => {
        if (kids.indexOf(raw.active[k]) >= 0) st.active[k] = raw.active[k];
      });
    }
    if (typeof raw.chatLock === 'boolean') st.chatLock = raw.chatLock;
    if (memberIdInList(raw.viewer, st.members)) st.viewer = raw.viewer;
    if (childIdsOf(st).indexOf(raw.praiseTarget) >= 0) st.praiseTarget = raw.praiseTarget;
    return st;
  }

  function persistLocal() {
    try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch (e) { /* 저장 공간 부족 등은 조용히 넘어감 */ }
    try { localStorage.setItem(STORE_DEV_KEY, JSON.stringify(devicePrefs())); } catch (e) { }
  }

  /* 가족 모두와 나누는 부분만 담아요 (이 기기 설정은 빼고) */
  function sharedPayload() {
    const out = {};
    SHARED_KEYS.forEach((k) => { if (state[k] !== undefined) out[k] = state[k]; });
    return JSON.parse(JSON.stringify(out));
  }

  function queuePush() {
    if (applyingRemote || !fbRef) return;
    if (!fbConnected) unsynced = true;
    if (pushTimer) clearTimeout(pushTimer);
    pushTimer = setTimeout(pushNow, 250);
  }

  function pushNow() {
    if (pushTimer) { clearTimeout(pushTimer); pushTimer = null; }
    if (!fbRef) return;
    if (firstSnap) { unsynced = true; return; }   /* 서버 값과 한 번 맞추기 전에는 올리지 않아요 */
    state.updatedAt = Date.now();
    const payload = sharedPayload();
    const sig = JSON.stringify(payload);
    persistLocal();
    if (sig === lastRemoteSig) return;      /* 방금 받은 값 그대로면 되돌려 보내지 않아요 */
    recentPushes.push(sig);
    if (recentPushes.length > 8) recentPushes.shift();
    try { fbRef.set(payload); } catch (e) { setSyncMode('local'); }
  }

  function isEditing() {
    const root = qs('#modalRoot');
    if (root && !root.hidden && qs('.modal-sheet', root)) return true;
    const a = (typeof document !== 'undefined') ? document.activeElement : null;
    return !!(a && /^(INPUT|TEXTAREA|SELECT)$/.test(String(a.tagName || '')));
  }

  function scheduleRender() {
    if (isEditing()) { pendingRender = true; return; }   /* 입력 중이면 잠깐 미뤄요 */
    render();
  }

  function flushPendingRender() {
    if (!pendingRender || isEditing()) return;
    pendingRender = false;
    render();
  }

  /* 다른 기기에서 온 기록을 받아 화면에 반영해요 (이 기기 설정은 그대로) */
  function applyRemote(remote) {
    if (!remote || typeof remote !== 'object') return;
    const next = normalizeState(remote);
    DEVICE_KEYS.forEach((k) => { next[k] = state[k]; });
    state = next;
    if (state.lastSeen !== tKey()) state.lastSeen = tKey();
    ensureDay(state, tKey(), false);
    if (!memberIdInList(state.viewer, state.members)) state.viewer = children()[0].id;
    applyingRemote = true;
    persistLocal();
    scheduleRender();
    applyingRemote = false;
    if (boardDirty) { boardDirty = false; pushNow(); }   /* 정리가 끝난 모습은 한 번만 올려요 */
  }

  function onRemoteValue(snap) {
    let remote = null;
    try { remote = snap ? snap.val() : null; } catch (e) { remote = null; }
    if (firstSnap) {
      firstSnap = false;
      const localAt = toInt(state.updatedAt, 0);
      const remoteAt = toInt(remote && remote.updatedAt, 0);
      /* 방이 비었거나 · 이 기기에 쓰던 기록이 있고 그게 더 최신이면 지금 값을 올려요 */
      if (!remote || (hadLocalCache && (unsynced || localAt > remoteAt + 1000))) {
        unsynced = false;
        pushNow();
        return;
      }
      unsynced = false;
      lastRemoteSig = JSON.stringify(remote);
      applyRemote(remote);
      return;
    }
    if (!remote) return;
    lastRemoteSig = JSON.stringify(remote);
    if (recentPushes.indexOf(lastRemoteSig) >= 0) return;   /* 내가 보낸 값이 되돌아온 것 */
    applyRemote(remote);
  }

  function initSync() {
    if (typeof firebase === 'undefined' || !firebase || typeof firebase.initializeApp !== 'function') {
      setSyncMode('local');
      return;
    }
    setSyncMode('connecting');
    try {
      const app = (firebase.apps && firebase.apps.length) ? firebase.app() : firebase.initializeApp(FIREBASE_CONFIG);
      const db = firebase.database(app);
      try {
        db.ref('.info/connected').on('value', (snap) => {
          const on = !!(snap && snap.val() === true);
          fbConnected = on;
          setSyncMode(on ? 'live' : 'local');
          if (on && unsynced && !firstSnap) { unsynced = false; pushNow(); }   /* 끊긴 동안 쌓인 기록을 보내요 */
        }, () => setSyncMode('local'));
      } catch (e) { }
      fbRef = db.ref(DB_PATH);
      fbRef.on('value', onRemoteValue, () => setSyncMode('local'));
    } catch (e) {
      fbRef = null;
      setSyncMode('local');
    }
  }

  function memberById(id) {
    for (let i = 0; i < state.members.length; i++) if (state.members[i].id === id) return state.members[i];
    return null;
  }
  function safeMember(id) { return memberById(id) || state.members[0]; }
  function nameOf(id) {
    const m = memberById(id);
    return m ? m.name : '';
  }
  function missionOf(childId) {
    const key = tKey();
    if (!state.missions[key]) state.missions[key] = {};
    let mi = state.missions[key][childId];
    if (!mi || typeof mi !== 'object' || mi.idx == null) {
      mi = { idx: missionIdxFor(childId, key), done: false, logId: null };
      state.missions[key][childId] = mi;
    }
    return mi;
  }

  /* ------------------------- stamps ------------------------- */
  function addLog(memberId, kind, text, amount) {
    const entry = { id: uid('sl'), memberId: memberId, kind: kind, text: text || '', amount: Math.max(1, toInt(amount, 1)), at: Date.now() };
    state.stampLog.push(entry);
    return entry;
  }
  function removeLog(id) {
    const i = state.stampLog.findIndex((e) => e.id === id);
    if (i >= 0) state.stampLog.splice(i, 1);
  }
  function stampTotal(memberId) {
    return state.stampLog.reduce((s, e) => (e.memberId === memberId ? s + (e.amount || 1) : s), 0);
  }
  function stampToday(memberId) {
    const k = tKey();
    return state.stampLog.reduce((s, e) => (e.memberId === memberId && ymd(new Date(e.at)) === k ? s + (e.amount || 1) : s), 0);
  }
  function dayHasStamp(memberId, key) {
    return state.stampLog.some((e) => e.memberId === memberId && ymd(new Date(e.at)) === key);
  }
  function monthStamps(memberId) {
    const y = calCursor.getFullYear();
    const m = calCursor.getMonth();
    const set = {};
    state.stampLog.forEach((e) => {
      if (e.memberId !== memberId) return;
      const d = new Date(e.at);
      if (d.getFullYear() === y && d.getMonth() === m) set[ymd(d)] = true;
    });
    return Object.keys(set).length;
  }
  function monthStampsNow(memberId) {
    const now = new Date();
    const y = now.getFullYear();
    const m = now.getMonth();
    const set = {};
    state.stampLog.forEach((e) => {
      if (e.memberId !== memberId) return;
      const d = new Date(e.at);
      if (d.getFullYear() === y && d.getMonth() === m) set[ymd(d)] = true;
    });
    return Object.keys(set).length;
  }
  function streakFor(memberId) {
    let cursor = new Date();
    if (!dayHasStamp(memberId, ymd(cursor))) cursor.setDate(cursor.getDate() - 1);
    let n = 0;
    let guard = 0;
    while (dayHasStamp(memberId, ymd(cursor)) && guard++ < 400) {
      n++;
      cursor.setDate(cursor.getDate() - 1);
    }
    return n;
  }
  function grandStampTotal() {
    return state.stampLog.reduce((s, e) => s + (e.amount || 1), 0);
  }
  function starsOf(memberId) {
    return state.praise.reduce((s, p) => (p.memberId === memberId ? s + 1 : s), 0);
  }
