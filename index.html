      '<div class="card-head"><h2>👨‍👩‍👧 엄마·아빠</h2><span class="pill-count">칭찬과 채팅으로 함께해요</span></div>' +
      '<p class="card-desc">도장판·루틴·일정은 시아·아윤이 것만 있어요. 엄마·아빠는 칭찬 별과 응원 한마디를 보내 주세요.</p>' +
      '<div class="row-2">' + ps.map((p) =>
        '<button class="parent-btn" type="button" data-act="praise-as" data-member="' + p.id + '">' +
          '<span class="avatar xs tone-' + p.tone + '">' + avatarSVG(p.avatar) + '</span>' +
          '<span class="parent-txt"><b class="parent-name">' + esc(p.name) + '</b><span class="parent-sub">칭찬 보내기 →</span></span>' +
        '</button>').join('') + '</div>' +
    '</div>';
  }

  /* ------------------------- render: routine ------------------------- */
  function routineHTML() {
    const key = tKey();
    const kids = children();
    const active = safeChild(state.active.routine);
    const day = state.routines[key] || {};
    const list = day[active.id] || [];
    const study = list.filter((i) => i.kind === KIND_STUDY);
    const life = list.filter((i) => i.kind === KIND_LIFE);
    const done = list.filter((i) => i.done).length;
    let allDone = 0;
    let allTotal = 0;
    kids.forEach((m) => {
      const l = day[m.id] || [];
      allTotal += l.length;
      allDone += l.filter((i) => i.done).length;
    });
    const pct = allTotal ? Math.round((allDone / allTotal) * 100) : 0;

    return '<div class="card routine-card">' +
        '<div class="card-head"><h2>📚 오늘의 루틴</h2><span class="pill-count">' + kids.map((m) => m.name).join('·') + ' ' + allDone + '/' + allTotal + '</span></div>' +
        '<p class="card-desc">공부 루틴과 생활 루틴을 스스로 체크해요 · 하나 마칠 때마다 도장이 쌓여요</p>' +
        '<div class="progress-line"><div class="bar"><i style="width:' + pct + '%"></i></div><span>' + allDone + ' / ' + allTotal + ' 완료</span></div>' +
        '<div class="row-2" style="margin-top:10px">' +
          '<button class="btn btn-ghost" type="button" data-act="open-fixed">⚙️ 고정 루틴</button>' +
          '<button class="btn btn-ghost" type="button" data-act="open-add-routine" data-member="' + active.id + '" data-kind="' + KIND_STUDY + '">+ 루틴 추가</button>' +
        '</div>' +
      '</div>' +
      childChipsHTML('routine-member', active.id) +
      wordCardHTML(active) +
      '<div class="card kid-routine tone-' + active.tone + '">' +
        '<div class="rt-head">' +
          '<span class="avatar sm tone-' + active.tone + '">' + avatarSVG(active.avatar) + '</span>' +
          '<div style="flex:1;min-width:0">' +
            '<p class="m-name">' + esc(active.name) + '</p>' +
            '<p class="m-sub">' + done + '/' + list.length + '개 완료 · 오늘 도장 +' + stampToday(active.id) + '</p>' +
          '</div>' +
          '<span class="rt-stamp">' + stampSVG() + ' ' + stampTotal(active.id) + '개</span>' +
        '</div>' +
        routineSectionHTML(active, KIND_STUDY, study) +
        routineSectionHTML(active, KIND_LIFE, life) +
      '</div>';
  }

  function routineSectionHTML(m, kind, items) {
    const meta = kindMeta(kind);
    const done = items.filter((i) => i.done).length;
    const stamps = items.reduce((s, i) => s + (i.done ? (i.stamp == null ? 1 : toInt(i.stamp, 1)) : 0), 0);
    return '<div class="sec">' +
      '<div class="sec-head"><p class="sec-title">' + meta.emoji + ' ' + meta.l + '</p>' +
        '<span class="sec-count">' + done + '/' + items.length + ' · ' + stampSVG() + ' ' + stamps + '</span></div>' +
      (items.length ? items.map(routineItemHTML).join('') : '<p class="kid-empty">' + meta.l + ' 항목이 아직 없어요</p>') +
      '<button class="add-dashed" type="button" data-act="open-add-routine" data-member="' + m.id + '" data-kind="' + kind + '">+ ' + meta.l + ' 추가</button>' +
    '</div>';
  }

  function routineItemHTML(it) {
    const amount = it.stamp == null ? 1 : toInt(it.stamp, 1);
    return '<div class="rt-item ' + (it.done ? 'done' : '') + '">' +
      '<button class="check" type="button" data-act="toggle-routine" data-id="' + it.id + '" aria-label="완료 체크">' + (it.done ? CHECK_SVG : '') + '</button>' +
      '<div class="rt-body">' +
        '<p class="rt-title">' + esc(it.title) + '</p>' +
        (it.tag ? '<span class="tag">' + esc(it.tag) + '</span>' : '') +
        '<span class="stamp-badge">' + stampSVG() + ' 도장 +' + amount + '</span>' +
      '</div>' +
      '<div class="rt-actions">' +
        '<button class="mini ' + (it.fixedId ? 'mini-on' : '') + '" type="button" data-act="pin-routine" data-id="' + it.id + '" aria-label="고정 루틴">📍</button>' +
        '<button class="mini" type="button" data-act="edit-routine" data-id="' + it.id + '" aria-label="수정">✏️</button>' +
        '<button class="mini mini-x" type="button" data-act="del-routine" data-id="' + it.id + '" aria-label="삭제">✕</button>' +
      '</div>' +
    '</div>';
  }

  /* ------------------------- render: routine — 오늘의 영단어 ------------------------- */
  function gradeLabel(m) {
    const gm = String(m.sub || '').match(/초등\s*(\d)학년/);
    return gm ? '초등 ' + gm[1] + '학년' : '우리 아이';
  }

  function wordRowHTML(item, done) {
    return '<div class="word-row ' + (done ? 'done' : '') + '">' +
      '<div class="word-body">' +
        '<p class="word-en">' + esc(item.w) +
          '<button class="speak" type="button" data-act="speak-word" data-w="' + esc(item.w) + '" aria-label="' + esc(item.w) + ' 발음 듣기">🔊</button></p>' +
        '<p class="word-meaning">' + esc(item.m) + '</p>' +
        '<p class="word-ex">' + esc(item.e) + '</p>' +
      '</div>' +
      '<button class="word-check ' + (done ? 'on' : '') + '" type="button" data-act="toggle-word" data-w="' + esc(item.w) + '" aria-pressed="' + (done ? 'true' : 'false') + '">' +
        (done ? '✓ 외웠어요' : '외웠어요') + '</button>' +
    '</div>';
  }

  function quizDotsHTML() {
    let out = '<div class="quiz-dots">';
    for (let i = 0; i < quiz.items.length; i++) {
      out += '<span class="quiz-dot ' + (i < quiz.idx ? 'past' : (i === quiz.idx ? 'now' : 'next')) + '"></span>';
    }
    return out + '</div>';
  }

  function quizBoxHTML(m) {
    if (quiz.child !== m.id || quiz.stage === 'idle') return '';
    if (quiz.stage === 'result') {
      const total = quiz.items.length;
      const sc = quiz.score;
      const msg = sc >= total ? '완벽해요! 오늘 단어를 다 외웠네요 🌟'
        : sc >= total - 1 ? '아주 잘했어요! 한 문제만 더 맞히면 만점 ✨'
          : sc >= Math.ceil(total / 2) ? '잘했어요! 틀린 단어를 한 번 더 읽어 봐요'
            : '괜찮아요! 오늘 단어를 다시 보고 또 도전해 봐요 🌱';
      const rec = wordProgress(m.id, tKey());
      const claimed = !!(rec.quiz && rec.quiz.at);
      return '<div class="quiz-box">' +
        '<p class="quiz-emoji">🎉</p>' +
        '<p class="quiz-score">' + total + '문제 중 <b>' + sc + '</b>개 맞혔어요</p>' +
        '<p class="quiz-msg">' + msg + '</p>' +
        '<div class="row-2">' +
          '<button class="btn btn-ghost" type="button" data-act="quiz-again" data-member="' + m.id + '">🔁 한 번 더</button>' +
          '<button class="btn ' + (claimed ? 'btn-ghost' : 'btn-pink') + '" type="button" data-act="quiz-stamp" data-member="' + m.id + '"' + (claimed ? ' disabled' : '') + '>' +
            (claimed ? '✓ 오늘 도장 받음' : '💮 도장 받기') + '</button>' +
        '</div>' +
      '</div>';
    }
    const it = quiz.items[quiz.idx];
    const picked = quiz.picked;
    const answered = picked >= 0;
    const right = picked === it.answer;
    let opts = '';
    it.opts.forEach((o, i) => {
      let cls = 'quiz-opt';
      if (answered && i === it.answer) cls += ' right';
      else if (answered && i === picked) cls += ' wrong';
      opts += '<button class="' + cls + '" type="button" data-act="quiz-answer" data-idx="' + i + '">' + esc(it.dir === 'e2m' ? o.m : o.w) + '</button>';
    });
    const prompt = it.dir === 'e2m' ? it.word.w : it.word.m;
    const ask = it.dir === 'e2m' ? '이 영단어의 뜻은?' : '이 뜻에 맞는 영단어는?';
    return '<div class="quiz-box">' +
      '<div class="quiz-top">' + quizDotsHTML() + '<span class="quiz-count">' + (quiz.idx + 1) + ' / ' + quiz.items.length + ' · 점수 ' + quiz.score + '</span></div>' +
      '<p class="quiz-ask">' + ask + '</p>' +
      '<p class="quiz-prompt">' + esc(prompt) + '</p>' +
      '<div class="quiz-opts">' + opts + '</div>' +
      (answered
        ? '<p class="quiz-feedback ' + (right ? 'ok' : 'no') + '">' +
            (right ? '정답이에요! 🎯 연속 ' + quiz.streak + '개' : '아쉬워요! 정답은 "' + esc(it.dir === 'e2m' ? it.word.m : it.word.w) + '"') + '</p>' +
          '<button class="btn btn-sky btn-block" type="button" data-act="quiz-next" data-member="' + m.id + '">' +
            (quiz.idx + 1 < quiz.items.length ? '다음 문제 →' : '결과 보기 →') + '</button>'
        : '<p class="quiz-feedback">보기에서 골라 보세요</p>') +
    '</div>';
  }

  function wordCardHTML(m) {
    const key = tKey();
    const list = wordsForDay(m.id, key);
    const prog = wordProgress(m.id, key);
    const doneN = list.filter((w) => prog.done.indexOf(w.w) >= 0).length;
    const pct = list.length ? Math.round((doneN / list.length) * 100) : 0;
    return '<div class="card word-card tone-' + m.tone + '">' +
      '<div class="card-head"><h2>📖 오늘의 영어단어 5개</h2>' +
        '<span class="pill-count">' + esc(gradeLabel(m)) + ' · ' + doneN + '/' + list.length + ' 외움</span></div>' +
      '<p class="card-desc">' + esc(m.name) + ' 수준에 맞춘 단어예요 · 뜻과 예문을 소리 내어 읽고, 🔊 로 발음을 들어 봐요</p>' +
      '<div class="word-list">' + list.map((w) => wordRowHTML(w, prog.done.indexOf(w.w) >= 0)).join('') + '</div>' +
      '<div class="progress-line"><div class="bar"><i style="width:' + pct + '%"></i></div><span>' + doneN + ' / ' + list.length + ' 외웠어요</span></div>' +
      '<button class="btn btn-mint btn-block" type="button" data-act="quiz-start" data-member="' + m.id + '" style="margin-top:10px">🎮 영단어 맞추기 인게임</button>' +
      quizBoxHTML(m) +
    '</div>';
  }

  /* ------------------------- render: snack ------------------------- */
  function cubesHTML(cubes, hasItems) {
    const n = Math.min(24, Math.ceil(Math.max(0, Number(cubes) || 0)));
    let out = '<div class="cube-wall' + (sugarLevel(cubes) === 'danger' ? ' hot' : '') + '">';
    if (!hasItems) out += '<span class="cube-note">오늘 먹은 간식이 없어요 — 각설탕 0개</span>';
    for (let i = 0; i < n; i++) out += '<span class="cube" aria-hidden="true"></span>';
    if (cubes > n) out += '<span class="cube-more">+' + Math.round(cubes - n) + '</span>';
    return out + '</div>';
  }

  const SNACK_QUICK_PICK = ['가나초콜릿', '하리보 골드베렌', '새우깡', '츄파춥스', '포카칩', '마이구미', '초코파이', '홈런볼'];

  function snackHits() {
    if (!String(snackQuery).trim()) {
      const out = [];
      SNACK_QUICK_PICK.forEach((name) => {
        const hit = snackDb().find((s) => s.name === name);
        if (hit) out.push(hit);
      });
      return out;
    }
    return searchSnacks(snackQuery, 8);
  }

  function snackResultsHTML() {
    const hits = snackHits();
    if (!hits.length) {
      return '<div class="snack-none">"' + esc(snackQuery) + '" 를 찾지 못했어요<br>오른쪽 위 <b>+ 직접 입력</b>으로 칼로리·당류를 적어 넣을 수 있어요</div>';
    }
    return '<p class="snack-hint">' + (String(snackQuery).trim() ? '검색 결과 ' + hits.length + '개' : '자주 먹는 간식이에요 · 이름을 검색해 보세요') + '</p>' +
      hits.map((it) => {
        const meta = snackCatMeta(it.cat);
        return '<button class="snack-hit" type="button" data-act="snack-add" data-id="' + esc(it.id) + '">' +
          '<span class="hit-emoji" aria-hidden="true">' + meta.emoji + '</span>' +
          '<span class="hit-body"><span class="hit-name">' + esc(it.name) + '</span>' +
            '<span class="hit-meta">' + esc(it.unit) + ' · ' + toInt(it.kcal, 0) + ' kcal · 당류 ' + round1(it.sugar) + 'g</span></span>' +
          '<span class="hit-add">+</span></button>';
      }).join('');
  }

  function snackItemHTML(s) {
    const meta = snackCatMeta(s.cat);
    const q = Math.max(1, toInt(s.qty, 1));
    const kcal = Math.round((Number(s.kcal) || 0) * q);
    const sugar = round1((Number(s.sugar) || 0) * q);
    return '<div class="snack-item">' +
      '<span class="si-emoji" aria-hidden="true">' + meta.emoji + '</span>' +
      '<div class="si-body">' +
        '<p class="si-name">' + esc(s.name) + ' <span class="si-unit">' + esc(s.unit) + '</span></p>' +
        '<p class="si-meta">' + kcal + ' kcal · 당류 ' + sugar + 'g · 각설탕 ' + round1(sugar / SUGAR_PER_CUBE) + '개</p>' +
      '</div>' +
      '<div class="si-qty">' +
        '<button class="qty-btn" type="button" data-act="snack-minus" data-id="' + s.id + '" aria-label="하나 빼기">−</button>' +
        '<span class="qty-num">' + q + '</span>' +
        '<button class="qty-btn" type="button" data-act="snack-plus" data-id="' + s.id + '" aria-label="하나 더">+</button>' +
      '</div>' +
      '<button class="mini mini-x" type="button" data-act="snack-del" data-id="' + s.id + '" aria-label="삭제">✕</button>' +
    '</div>';
  }

  function snackHTML() {
    const key = tKey();
    const m = safeChild(state.active.snack);
    const t = snackTotals(m.id, key);
    const list = snackListRead(m.id, key);
    const level = sugarLevel(t.cubes);
    const limitCubes = Math.round(SUGAR_LIMIT / SUGAR_PER_CUBE);
    const limitPct = Math.min(100, Math.round((t.cubes / limitCubes) * 100));
    const badge = level === 'danger' ? '경고' : (level === 'warn' ? '주의' : '양호');
    const msg = level === 'danger'
      ? '🚨 각설탕 ' + limitCubes + '개를 넘었어요! 오늘은 그만 먹고 물 한 잔 마셔요'
      : level === 'warn'
        ? '⚠️ 각설탕 5개를 넘었어요. 남은 간식은 내일로 미뤄 볼까요?'
        : '🌱 오늘은 아직 괜찮아요. 다음 간식은 물 한 잔과 함께 먹어요';
    return childChipsHTML('snack-member', m.id) +
      '<div class="card snack-summary level-' + level + '">' +
        '<div class="card-head"><h2>🍬 ' + esc(m.name) + ' 간식 각설탕</h2><span class="snack-badge level-' + level + '">' + badge + '</span></div>' +
        '<p class="card-desc">각설탕 1개 = 당류 3g 기준 · 어린이 1일 첨가당 권장량은 약 ' + SUGAR_LIMIT + 'g(각설탕 ' + limitCubes + '개)이에요</p>' +
        '<div class="snack-stats">' +
          '<div class="snack-stat"><span class="ss-num">' + t.qty + '</span><span class="ss-label">먹은 개수</span></div>' +
          '<div class="snack-stat"><span class="ss-num">' + t.kcal + '</span><span class="ss-label">칼로리(kcal)</span></div>' +
          '<div class="snack-stat"><span class="ss-num">' + t.sugar + '</span><span class="ss-label">당류(g)</span></div>' +
          '<div class="snack-stat big"><span class="ss-num">' + t.cubes + '</span><span class="ss-label">각설탕(개)</span></div>' +
        '</div>' +
        cubesHTML(t.cubes, t.rows > 0) +
        '<div class="limit-line"><div class="bar"><i style="width:' + limitPct + '%"></i></div><span>1일 기준 ' + limitPct + '%</span></div>' +
        '<p class="snack-alert level-' + level + '">' + msg + '</p>' +
      '</div>' +
      '<div class="card">' +
        '<div class="card-head"><h2>🔍 간식 찾기</h2><button class="btn btn-ghost btn-tiny" type="button" data-act="open-add-snack">+ 직접 입력</button></div>' +
        '<p class="card-desc">초콜릿 · 젤리 · 사탕 · 과자 이름을 검색해요 (초성도 돼요)</p>' +
        '<input class="snack-search" id="snackSearch" type="search" value="' + esc(snackQuery) + '" placeholder="예: 하리보, 가나, ㅅㅇㄲ" data-input="snack-search" aria-label="간식 검색">' +
        '<div class="snack-results" id="snackResults">' + snackResultsHTML() + '</div>' +
      '</div>' +
      '<div class="card snack-day tone-' + m.tone + '">' +
        '<div class="card-head"><h2>🍽️ ' + esc(m.name) + ' 오늘 먹은 간식</h2><span class="pill-count">' + list.length + '가지</span></div>' +
        '<p class="card-desc">같은 간식을 더 먹었으면 + 를 눌러 개수를 늘려요</p>' +
        (list.length
          ? list.map(snackItemHTML).join('')
          : '<div class="empty"><span class="emoji">🍪</span>아직 기록한 간식이 없어요<br>위에서 검색해 추가해 보세요</div>') +
        (list.length ? '<p class="snack-sum">합계 · ' + t.qty + '개 · ' + t.kcal + ' kcal · 당류 ' + t.sugar + 'g · 각설탕 ' + t.cubes + '개</p>' : '') +
      '</div>';
  }

  /* ------------------------- render: schedule ------------------------- */
  function scheduleHTML() {
    const key = tKey();
    const m = safeChild(state.active.schedule);
    const today = ((state.todos[key] || {})[m.id] || []).filter(catMatches);
    const days = weekAhead().map((d) => {
      const k = ymd(d);
      const items = ((state.todos[k] || {})[m.id] || []).filter(catMatches);
      if (!items.length && k !== key) return '';   /* 빈 날은 접어 두고, 오늘만 항상 보여 줌 */
      return dayGroupHTML(m, d, items);
    }).join('');
    const ahead = weekAhead();
    const laterItems = ahead.slice(1).some((d) => ((state.todos[ymd(d)] || {})[m.id] || []).filter(catMatches).length);
    return childChipsHTML('schedule-member', m.id) +
      '<div class="card todo-card tone-' + m.tone + '">' +
        '<div class="card-head"><h2>📌 ' + esc(m.name) + ' 오늘 일정</h2>' +
          '<button class="btn btn-ghost btn-tiny" type="button" data-act="open-add-todo" data-member="' + m.id + '">+ 일정 추가</button></div>' +
        '<p class="card-desc">학원·학교·숙제·준비물을 한눈에 봐요 · 다 하면 직접 체크해요</p>' +
        filterChipsHTML() +
        (today.length ? today.map((t) => todoRowHTML(m, key, t)).join('') : '<div class="empty" style="padding:14px 6px"><span class="emoji">🐣</span>오늘 일정이 없어요<br>아래에서 추가해 보세요</div>') +
        '<button class="add-dashed" type="button" data-act="open-add-todo" data-member="' + m.id + '">+ ' + esc(m.name) + ' 일정 추가</button>' +
      '</div>' +
      '<div class="card">' +
        '<div class="card-head"><h2>🗓️ 이번 주 일정</h2><span class="pill-count">오늘부터 ' + (ahead[0].getMonth() + 1) + '/' + ahead[0].getDate() + ' ~ ' + (ahead[6].getMonth() + 1) + '/' + ahead[6].getDate() + '</span></div>' +
        '<p class="card-desc">' + esc(m.name) + '가 앞으로 일주일 동안 챙길 일이에요</p>' +
        days +

  function calendarHTML(memberId) {
    const y = calCursor.getFullYear();
    const mo = calCursor.getMonth();
    const first = new Date(y, mo, 1);
    const startPad = first.getDay();
    const days = new Date(y, mo + 1, 0).getDate();
    const cells = [];
    for (let i = 0; i < startPad; i++) cells.push('<div class="cal-cell empty"></div>');
    for (let d = 1; d <= days; d++) {
      const k = ymd(new Date(y, mo, d));
      const stamped = dayHasStamp(memberId, k);
      const isToday = k === tKey();
      cells.push('<div class="cal-cell ' + (stamped ? 'stamped' : '') + ' ' + (isToday ? 'today' : '') + '">' + d +
        (stamped ? '<span class="cal-stamp">' + stampSVG() + '</span>' : '') + '</div>');
    }
    return '<div class="cal">' +
      '<div class="cal-head">' +
        '<button class="mini" type="button" data-act="cal-prev" aria-label="이전 달">‹</button>' +
        '<p class="cal-title">' + y + '년 ' + (mo + 1) + '월</p>' +
        '<button class="mini" type="button" data-act="cal-next" aria-label="다음 달">›</button>' +
      '</div>' +
      '<div class="cal-grid">' + WEEK_MIN.map((w) => '<div class="cal-dow">' + w + '</div>').join('') + cells.join('') + '</div>' +
      '<p class="cal-count">이번 달 도장 <b>' + monthStamps(memberId) + '</b>개</p>' +
    '</div>';
  }

  function bubbleHTML(msg, me) {
    const m = memberById(msg.memberId) || state.members[0];
    const mine = msg.memberId === me.id;
    const hearts = Array.isArray(msg.hearts) ? msg.hearts : [];
    const hearted = hearts.indexOf(me.id) >= 0;
    const isSticker = msg.type === 'sticker';
    return '<div class="bubble-row ' + (mine ? 'mine' : 'other') + '">' +
      (mine ? '' : '<span class="avatar xxs tone-' + m.tone + '">' + avatarSVG(m.avatar) + '</span>') +
      '<div class="bubble-wrap">' +
        (mine ? '' : '<p class="bubble-name">' + esc(m.name) + ' <span>' + fmtWhen(msg.at) + '</span></p>') +
        '<div class="bubble ' + (isSticker ? 'sticker' : '') + '">' + esc(msg.text) + '</div>' +
        '<div class="bubble-actions">' +
          '<button class="react ' + (hearted ? 'on' : '') + '" type="button" data-act="chat-heart" data-id="' + msg.id + '" aria-label="하트">❤️' + (hearts.length ? ' ' + hearts.length : '') + '</button>' +
          '<button class="react del" type="button" data-act="chat-del" data-id="' + msg.id + '" aria-label="메시지 삭제">✕</button>' +
        '</div>' +
      '</div>' +
      (mine ? '<span class="avatar xxs tone-' + m.tone + '">' + avatarSVG(m.avatar) + '</span>' : '') +
    '</div>';
  }

    renderViewer();

    setHTML('#tab-home', homeHTML());

    setHTML('#tab-praise', praiseHTML());

  function setHTML(sel, html) {
    const el = qs(sel);

  function toast(msg) {
    const el = qs('#toast');
    if (!el) return;
    el.textContent = msg;
    el.classList.add('on');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove('on'), 1900);
  }

  /* ------------------------- modal ------------------------- */
  function openModal(opts) {
    const root = qs('#modalRoot');
    if (!root) return;
    root.innerHTML = '<div class="modal-backdrop" data-act="close-modal"></div>' +
      '<div class="modal-sheet" role="dialog" aria-modal="true" aria-label="' + esc(opts.label || '설정') + '">' +
        '<div class="modal-head"><h2>' + (opts.title || '') + '</h2>' +
          '<button class="modal-x" type="button" data-act="close-modal" aria-label="닫기">✕</button></div>' +
        '<div class="modal-body">' + (opts.body || '') + '</div>' +
        (opts.footer ? '<div class="modal-foot">' + opts.footer + '</div>' : '') +
      '</div>';
    root.hidden = false;
    document.body.style.overflow = 'hidden';
    if (opts.onMount) opts.onMount(root);
  }
  function closeModal() {
    const root = qs('#modalRoot');
    if (!root) return;
    root.hidden = true;
    root.innerHTML = '';
    document.body.style.overflow = '';
    pendingConfirm = null;
    flushPendingRender();
  }
  function readFields(root) {
    const out = {};
    qsa('[data-field]', root).forEach((el) => { out[el.dataset.field] = String(el.value || '').trim(); });
    return out;
  }
  function fieldInput(name, label, value, placeholder, type) {
    return '<div class="form-row"><label>' + label + '</label>' +
      '<input data-field="' + name + '" type="' + (type || 'text') + '" value="' + esc(value == null ? '' : value) + '" placeholder="' + esc(placeholder || '') + '"' +
      (type === 'number' ? ' inputmode="numeric"' : ' autocomplete="off"') + '></div>';
  }
  function fieldSelect(name, label, options, value) {
    return '<div class="form-row"><label>' + label + '</label><select data-field="' + name + '">' +
      options.map((o) => '<option value="' + esc(o.v) + '"' + (String(o.v) === String(value) ? ' selected' : '') + '>' + esc(o.l) + '</option>').join('') +
      '</select></div>';
  }
  function childOptions() {
    return children().map((m) => ({ v: m.id, l: m.name }));
  }
  function dayOptions(selected) {
    const out = [];
    for (let i = 0; i < 7; i++) {
      const d = new Date();
      d.setDate(d.getDate() + i);
      const k = ymd(d);
      const label = (i === 0 ? '오늘 · ' : i === 1 ? '내일 · ' : WEEK_MIN[d.getDay()] + '요일 · ') + (d.getMonth() + 1) + '/' + d.getDate();
      out.push({ v: k, l: label });
    }
    return out;
  }
  function confirmModal(title, message, okLabel, onOk) {
    pendingConfirm = onOk;
    openModal({
      title: title,
      label: title,
      body: '<p class="confirm-text">' + message + '</p>',
      footer: '<button class="btn btn-ghost" type="button" data-act="close-modal">취소</button>' +
        '<button class="btn btn-pink" type="button" data-act="confirm-ok">' + okLabel + '</button>'
    });
  }

  /* ------------------------- finders ------------------------- */  function findRoutine(id) {
    const day = state.routines[tKey()] || {};
    const kids = children();
    for (let i = 0; i < kids.length; i++) {
      const m = kids[i];
      const list = day[m.id] || [];
      const idx = list.findIndex((x) => x.id === id);
      if (idx >= 0) return { member: m, list: list, index: idx, item: list[idx] };
    }
    return null;
  }
  function findTodo(id, memberId, day) {
    const dayKey = isDayKey(day) ? day : tKey();
    const d = state.todos[dayKey] || {};
    if (!d[memberId]) return null;
    const list = d[memberId];
    const idx = list.findIndex((x) => x.id === id);
    if (idx < 0) return null;
    return { member: safeMember(memberId), list: list, index: idx, item: list[idx], day: dayKey };
  }

  function speakWord(w) {
    try {
      const syn = (typeof window !== 'undefined') ? window.speechSynthesis : null;
      const Utter = (typeof window !== 'undefined') ? window.SpeechSynthesisUtterance : null;
      if (!syn || typeof syn.speak !== 'function' || typeof Utter !== 'function') {

  }

  function quizPool(memberId) {
    const pool = [];
    const seen = {};
    for (let back = 0; back < 4; back++) {
      const d = new Date();
      d.setDate(d.getDate() - back);
      wordsForDay(memberId, ymd(d)).forEach((w) => {
        if (seen[w.w]) return;
        seen[w.w] = true;
        pool.push(w);
      });
    }
    return pool;
  }

  function shuffle(list) {
    const a = list.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      const t = a[i];
      a[i] = a[j];
      a[j] = t;
    }
    return a;
  }

  function startQuiz(memberId) {
    const m = safeChild(memberId || state.active.routine);
    state.active.routine = m.id;
    const pool = quizPool(m.id);
    const bank = (WORD_BANK[m.id] || WORD_BANK.sia).map((w) => ({ w: w[0], m: w[1], e: w[2] })).concat(pool);
    const picks = shuffle(pool).slice(0, 5);
    const items = picks.map((p, i) => {
      const used = {};
      used[p.w] = true;
      const distract = shuffle(bank.concat(pool)).filter((x) => {
        if (used[x.w]) return false;
        used[x.w] = true;
        return true;
      }).slice(0, 3);
      const opts = shuffle([p].concat(distract));
      return {
        dir: i % 2 === 0 ? 'e2m' : 'm2e',
        word: p,
        opts: opts,
        answer: opts.findIndex((o) => o.w === p.w)
      };
    });
    quiz.child = m.id;
    quiz.stage = items.length ? 'quiz' : 'idle';
    quiz.items = items;
    quiz.idx = 0;
    quiz.score = 0;
    quiz.streak = 0;
    quiz.picked = -1;
    currentTab = 'routine';
    render();
    if (items.length) toast('🎮 영단어 맞추기! 5문제예요');
  }

  function answerQuiz(idx) {
    if (quiz.stage !== 'quiz' || quiz.picked >= 0) return;
    const it = quiz.items[quiz.idx];
    if (!it) return;
    quiz.picked = clamp(toInt(idx, -1), 0, it.opts.length - 1);
    if (quiz.picked === it.answer) {
      quiz.score += 1;
      quiz.streak += 1;
    } else {
      quiz.streak = 0;
    }
    render();
  }

  function nextQuiz() {
    if (quiz.stage !== 'quiz' || quiz.picked < 0) return;
    if (quiz.idx + 1 < quiz.items.length) {
      quiz.idx += 1;
      quiz.picked = -1;
      render();
      return;
    }
    quiz.stage = 'result';
    render();
  }

  function claimQuizStamp(memberId) {
    const m = safeChild(memberId || quiz.child || state.active.routine);

    const total = quiz.items.length || WORDS_PER_DAY;
    rec.quiz = { score: quiz.score, total: total, at: Date.now() };
    addLog(m.id, 'word', '영단어 맞추기 ' + quiz.score + '/' + total, 1);
    render();
    toast('💮 ' + m.name + ' 영단어 도장 +1');
  }

      render();
      toast('🎉 ' + safeMember(id).name + ' 미션 성공! 도장 +1');
    },

    'routine-member': (el) => { state.active.routine = el.dataset.member; quiz.stage = 'idle'; quiz.child = ''; render(); },
    'schedule-member': (el) => { state.active.schedule = el.dataset.member; render(); },
    'cat-filter': (el) => { schedFilter = el.dataset.cat || 'all'; render(); },
    'open-add-routine': (el) => openAddRoutine(el.dataset.member, el.dataset.kind),
    'save-add-routine': () => saveAddRoutine(),
    'edit-routine': (el) => openEditRoutine(el.dataset.id),
    'save-edit-routine': (el) => saveEditRoutine(el.dataset.id),
    'toggle-routine': (el) => toggleRoutine(el.dataset.id),
    'pin-routine': (el) => pinRoutine(el.dataset.id),
    'del-routine': (el) => delRoutine(el.dataset.id),
    'open-fixed': () => openFixed(),
    'fixed-add': () => fixedAdd(),
    'fixed-del': (el) => fixedDel(el.dataset.id, el.dataset.member),

    /* 간식 */
    'snack-member': (el) => { state.active.snack = el.dataset.member; render(); },
    'snack-add': (el) => addSnackById(el.dataset.id),
    'snack-plus': (el) => bumpSnack(el.dataset.id, 1),
    'snack-minus': (el) => bumpSnack(el.dataset.id, -1),
    'snack-del': (el) => delSnack(el.dataset.id),
    'open-add-snack': () => openAddSnack(),
    'save-add-snack': () => saveAddSnack(),

    /* 오늘의 영어단어 */
    'speak-word': (el) => speakWord(el.dataset.w),
    'toggle-word': (el) => toggleWord(el.dataset.w),
    'quiz-start': (el) => startQuiz(el.dataset.member),
    'quiz-again': (el) => startQuiz(el.dataset.member),
    'quiz-answer': (el) => answerQuiz(el.dataset.idx),
    'quiz-next': () => nextQuiz(),
    'quiz-stamp': (el) => claimQuizStamp(el.dataset.member),

    'open-add-todo': (el) => openAddTodo(el.dataset.member, el.dataset.day),
    'save-add-todo': () => saveAddTodo(),
    'edit-todo': (el) => openEditTodo(el.dataset.id, el.dataset.member, el.dataset.day),
    'save-edit-todo': (el) => saveEditTodo(el.dataset.id, el.dataset.member, el.dataset.day),
    'toggle-todo': (el) => toggleTodo(el.dataset.id, el.dataset.member, el.dataset.day),
    'del-todo': (el) => delTodo(el.dataset.id, el.dataset.member, el.dataset.day),

    'praise-member': (el) => { state.praiseTarget = el.dataset.member; render(); },
    'praise-quick': (el) => {
      const ta = qs('#praiseNote');
      const text = el.dataset.text || '';
      if (ta) {
        const cur = ta.value.trim();
        ta.value = cur ? cur + ' ' + text : text;
        praiseDraft = ta.value;
        ta.focus();
      } else {
        praiseDraft = text;
      }
      render();
    },
    'send-praise': () => sendPraise(),
    'del-praise': (el) => delPraise(el.dataset.id),

    'cal-prev': () => { calCursor = new Date(calCursor.getFullYear(), calCursor.getMonth() - 1, 1); render(); },
    'cal-next': () => { calCursor = new Date(calCursor.getFullYear(), calCursor.getMonth() + 1, 1); render(); },
    'cal-member': (el) => { calSet = el.dataset.member; render(); },

    'chat-member': (el) => {
      if (state.chatLock) { toast('🔒 잠겨 있어요. 잠금을 풀면 바꿀 수 있어요'); return; }
      state.viewer = el.dataset.member;
      render();
    },
    'toggle-lock': () => {
      state.chatLock = !state.chatLock;
      render();
      toast(state.chatLock ? '🔒 이 기기 잠금 — ' + safeMember(state.viewer).name + '(으)로 고정했어요' : '🔓 잠금을 풀었어요');
    },
    'send-chat': () => sendChat(),
    'chat-sticker': (el) => sendSticker(el.dataset.sticker),
    'chat-heart': (el) => toggleHeart(el.dataset.id),
    'chat-del': (el) => delChat(el.dataset.id),

    'reset-data': () => {
      confirmModal('🧹 데이터 초기화', '이 기기에 저장된 기록(루틴·일정·도장·칭찬·채팅)이 모두 지워져요.<br>되돌릴 수 없어요.', '초기화', () => {
        try { localStorage.removeItem(STORE_KEY); localStorage.removeItem(STORE_DEV_KEY); } catch (e) { }
        state = blankState();
        calCursor = startOfMonth(new Date());
        calSet = state.active.stamp;
        chatDraft = '';
        praiseDraft = '';
        schedFilter = 'all';
        snackQuery = '';
        quiz.stage = 'idle';
        quiz.child = '';
        render();
        toast('새로 시작했어요 🌱');
      });
    }
  };

  function setViewer(id) {
    if (!memberIdInList(id, state.members)) return;
    if (state.chatLock && id !== state.viewer) {
      toast('🔒 잠겨 있어요. 잠금을 풀면 바꿀 수 있어요');
      return;
    }
    state.viewer = id;
    closeModal();
    render();
    toast('지금 ' + safeMember(id).name + '(으)로 보고 있어요');
  }

  function toggleRoutine(id) {
    const found = findRoutine(id);
    if (!found) return;
    const item = found.item;
    const m = found.member;
    if (!item.done) {
      item.done = true;
      const amount = clamp(toInt(item.stamp, 1), 1, 20);
      const log = addLog(m.id, 'routine', item.title, amount);
      item.logId = log.id;
      render();
      toast('💮 ' + m.name + ' 도장 +' + amount + ' · 오늘 ' + stampToday(m.id) + '개');
    } else {
      item.done = false;
      if (item.logId) { removeLog(item.logId); item.logId = null; }
      render();
      toast('도장을 하나 돌려놓았어요');
    }
  }

  function pinRoutine(id) {
    const found = findRoutine(id);
    if (!found) return;
    const item = found.item;
    const m = found.member;
    if (item.fixedId) {
      const list = state.fixed[m.id] || [];
      const i = list.findIndex((f) => f.id === item.fixedId);
      if (i >= 0) list.splice(i, 1);
      item.fixedId = null;
      render();
      toast('고정을 풀었어요 (매일 올라오지 않아요)');
    } else {
      if (!state.fixed[m.id]) state.fixed[m.id] = [];
      const fx = { id: uid('fx'), title: item.title, tag: item.tag || '', stamp: item.stamp == null ? 1 : item.stamp, kind: normKind(item.kind) };
      state.fixed[m.id].push(fx);
      item.fixedId = fx.id;
      render();
      toast('매일 아침 자동으로 올라오는 고정 루틴이에요 📍');
    }
  }

  function delRoutine(id) {
    const found = findRoutine(id);
    if (!found) return;
    const wasFixed = !!found.item.fixedId;
    if (found.item.logId) removeLog(found.item.logId);
    found.list.splice(found.index, 1);
    render();
    toast(wasFixed ? '오늘 목록에서 지웠어요 · 고정 루틴이라 내일 다시 올라와요' : '오늘 목록에서 지웠어요');
  }

  function toggleTodo(id, memberId, day) {
    const found = findTodo(id, memberId, day);
    if (!found) return;
    found.item.done = !found.item.done;
    render();
    if (found.item.done) toast('✔️ ' + found.member.name + ' 일정 완료!');
  }

  function delTodo(id, memberId, day) {
    const found = findTodo(id, memberId, day);
    if (!found) return;
    found.list.splice(found.index, 1);
    render();
    toast('일정을 지웠어요');
  }

  function sendPraise() {
    const ta = qs('#praiseNote');
    const text = String(ta ? ta.value : praiseDraft).trim();
    const m = safeChild(state.praiseTarget);
    const from = safeMember(state.viewer);
    const log = addLog(m.id, 'praise', text || '칭찬 별', 1);
    state.praise.push({ id: uid('pr'), memberId: m.id, from: from.id, text: text.slice(0, 120), at: Date.now(), logId: log.id });
    praiseDraft = '';
    render();
    toast('⭐ ' + from.name + ' → ' + m.name + ' 별과 도장을 보냈어요');
  }

  function delPraise(id) {
    const i = state.praise.findIndex((p) => p.id === id);
    if (i < 0) return;
    const entry = state.praise[i];
    if (entry.logId) removeLog(entry.logId);
    state.praise.splice(i, 1);
    render();
    toast('칭찬을 지웠어요');
  }

  function sendChat() {
    const input = qs('#chatInput');
    const text = String(input ? input.value : chatDraft).trim();
    if (!text) { toast('한마디 적어 주세요'); return; }
    state.chat.push({ id: uid('ms'), memberId: state.viewer, type: 'text', text: text.slice(0, 300), at: Date.now(), hearts: [] });
    chatDraft = '';
    render();
    scrollChat();
  }
  function sendSticker(emoji) {
    state.chat.push({ id: uid('ms'), memberId: state.viewer, type: 'sticker', text: emoji, at: Date.now(), hearts: [] });
    render();
    scrollChat();
  }
  function toggleHeart(id) {
    const msg = state.chat.find((x) => x.id === id);
    if (!msg) return;
    if (!Array.isArray(msg.hearts)) msg.hearts = [];
    const me = state.viewer;
    const i = msg.hearts.indexOf(me);
    if (i >= 0) msg.hearts.splice(i, 1);
    else msg.hearts.push(me);
    render();
  }
  function delChat(id) {
    const i = state.chat.findIndex((x) => x.id === id);
    if (i < 0) return;
    state.chat.splice(i, 1);
    render();
    toast('메시지를 지웠어요');
  }

  /* ------------------------- events ------------------------- */
  function bindEvents() {
    document.addEventListener('click', (e) => {
      const el = e.target.closest ? e.target.closest('[data-act]') : null;
      if (!el) return;
      const fn = actions[el.dataset.act];
      if (!fn) return;
      if (el.tagName === 'BUTTON' || el.tagName === 'A') e.preventDefault();
      fn(el);
    });

    document.addEventListener('input', (e) => {
      const el = e.target.closest ? e.target.closest('[data-input]') : null;
      if (!el) return;
      const k = el.dataset.input;
      if (k === 'chat-draft') chatDraft = el.value;
      else if (k === 'praise-note') praiseDraft = el.value;
      else if (k === 'snack-search') {
        snackQuery = el.value;
        const box = qs('#snackResults');
        if (box) box.innerHTML = snackResultsHTML();   /* 입력 중에 초점이 풀리지 않게 결과만 다시 그려요 */
      }
    });

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') { const root = qs('#modalRoot'); if (root && !root.hidden) closeModal(); }
      if (e.key === 'Enter' && e.target && e.target.id === 'chatInput') { e.preventDefault(); sendChat(); }
    });

    /* 입력창에서 손을 땠을 때, 미뤄 둔 다른 기기 기록을 반영해요 */
    document.addEventListener('focusout', () => { setTimeout(flushPendingRender, 0); });
  }

  /* ------------------------- midnight watch ------------------------- */
  function watchMidnight() {
    setInterval(() => {
      const k = tKey();
      if (k !== state.lastSeen) {
        state.lastSeen = k;
        ensureDay(state, k, false);
        save();
        render();
        toast('새로운 하루예요! 오늘 루틴이 올라왔어요 🌞');
      }
    }, 30000);
  }

  /* ------------------------- init ------------------------- */
  function paintArt() {
    const logo = qs('#brandMascot');
    if (logo && !logo.getAttribute('src')) logo.setAttribute('src', ART.chii);
  }

  function init() {
    state = load();
    ensureDay(state, tKey(), false);
    state.lastSeen = tKey();
    if (!memberIdInList(state.viewer, state.members)) state.viewer = children()[0].id;
    if (!children().some((m) => m.id === state.active.routine)) state.active.routine = children()[0].id;
    if (!children().some((m) => m.id === state.active.schedule)) state.active.schedule = children()[0].id;
    if (!children().some((m) => m.id === state.active.snack)) state.active.snack = children()[0].id;
    if (!children().some((m) => m.id === state.active.stamp)) state.active.stamp = children()[0].id;
    if (!children().some((m) => m.id === calSet)) calSet = state.active.stamp;
    if (!children().some((m) => m.id === state.praiseTarget)) state.praiseTarget = children()[0].id;
    bindEvents();
    paintArt();
    render();
    watchMidnight();
    initSync();
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
  else init();
})();
</script>
</body>
</html>
