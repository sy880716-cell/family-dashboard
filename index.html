        '<p class="card-desc">한마디 남기면 별 1개와 도장 1개가 함께 쌓여요</p>' +
        childChipsHTML('praise-member', target.id) +
        '<div class="quick-row">' + PRAISE_QUICK.map((q) =>
          '<button type="button" class="quick" data-act="praise-quick" data-text="' + esc(q) + '">' + esc(q) + '</button>').join('') + '</div>' +
        '<textarea class="note" id="praiseNote" data-input="praise-note" placeholder="칭찬 한마디를 적어 주세요 (예: 스스로 숙제 다 함!)">' + esc(praiseDraft) + '</textarea>' +
        '<button class="btn btn-pink btn-block" type="button" data-act="send-praise" style="margin-top:9px">⭐ ' + esc(target.name) + '에게 별 · 도장 보내기</button>' +
      '</div>' +
      '<div class="card">' +
        '<div class="card-head"><h2>' + stampSVG('big') + ' 도장 적립</h2><span class="pill-count">모두 ' + grandStampTotal() + '개</span></div>' +
        '<div class="totals">' + children().map((m) =>
          '<span class="total-chip"><span class="avatar tone-' + m.tone + '">' + avatarSVG(m.avatar) + '</span>' + esc(m.name) + ' ' + stampSVG() + ' ' + stampTotal(m.id) + '</span>').join('') + '</div>' +
        ledgerHTML() +
      '</div>' +
      '<div class="card">' +
        '<div class="card-head"><h2>💌 최근 칭찬</h2><span class="pill-count">' + state.praise.length + '개</span></div>' +
        feedHTML() +
      '</div>' +
      '<div class="card">' +
        '<div class="card-head"><h2>📅 도장 달력</h2></div>' +
        childChipsHTML('cal-member', safeChild(calSet).id) +
        calendarHTML(safeChild(calSet).id) +
      '</div>';
  }

  function ledgerHTML() {
    const log = state.stampLog.slice().sort((a, b) => b.at - a.at).slice(0, 25);
    if (!log.length) {
      return '<div class="empty"><span class="emoji">' + stampSVG('big') + '</span>아직 쌓인 도장이 없어요<br>루틴을 하나 마치면 도장이 쌓여요</div>';
    }
    return log.map((e) => {
      const m = memberById(e.memberId) || children()[0];
      return '<div class="ledger-item">' +
        '<span class="avatar xxs tone-' + m.tone + '">' + avatarSVG(m.avatar) + '</span>' +
        '<span class="ledger-text">' + esc(m.name) + ' · ' + esc(e.text || '도장') +
          '<small>' + kindLabel(e.kind) + ' · ' + fmtWhen(e.at) + '</small></span>' +
        '<span class="ledger-amount">' + stampSVG() + ' +' + (e.amount || 1) + '</span>' +
      '</div>';
    }).join('');
  }

  function kindLabel(kind) {
    if (kind === 'praise') return '칭찬 도장';
    if (kind === 'mission') return '미션 도장';
    return '루틴 완료';
  }

  function feedHTML() {
    const feed = state.praise.slice().sort((a, b) => b.at - a.at).slice(0, 30);
    if (!feed.length) {
      return '<div class="empty"><span class="emoji">💌</span>아직 남긴 칭찬이 없어요<br>첫 칭찬을 남겨 보세요</div>';
    }
    return feed.map((p) => {
      const m = memberById(p.memberId) || children()[0];
      return '<div class="feed-item">' +
        '<span class="avatar xs tone-' + m.tone + '">' + avatarSVG(m.avatar) + '</span>' +
        '<span class="feed-body">' +
          '<span class="feed-head"><b>' + esc(nameOf(p.from)) + ' → ' + esc(m.name) + '</b><span class="feed-star">⭐ +1</span><span class="feed-time">' + fmtWhen(p.at) + '</span></span>' +
          '<span class="feed-text">' + esc(p.text || '칭찬 별을 보냈어요') + '</span>' +
        '</span>' +
        '<button class="mini mini-x" type="button" data-act="del-praise" data-id="' + p.id + '" aria-label="칭찬 지우기">✕</button>' +
      '</div>';
    }).join('');
  }

  function calendarHTML(memberId) {
    const y = calCursor.getFullYear();
    const mo = calCursor.getMonth();
    const first = new Date(y, mo, 1);
    const startPad = first.getDay();
    const days = new Date(y, mo + 1, 0).getDate();
    const cells = [];
    for (let i = 0; i < startPad; i++) cells.push('<div class="cal-cell empty"></div>');
    for (let d = 1; d <= days; d++) {
      const k = ymd(new Date(y, mo, d));
      const stamped = dayHasStamp(memberId, k);
      const isToday = k === tKey();
      cells.push('<div class="cal-cell ' + (stamped ? 'stamped' : '') + ' ' + (isToday ? 'today' : '') + '">' + d +
        (stamped ? '<span class="cal-stamp">' + stampSVG() + '</span>' : '') + '</div>');
    }
    return '<div class="cal">' +
      '<div class="cal-head">' +
        '<button class="mini" type="button" data-act="cal-prev" aria-label="이전 달">‹</button>' +
        '<p class="cal-title">' + y + '년 ' + (mo + 1) + '월</p>' +
        '<button class="mini" type="button" data-act="cal-next" aria-label="다음 달">›</button>' +
      '</div>' +
      '<div class="cal-grid">' + WEEK_MIN.map((w) => '<div class="cal-dow">' + w + '</div>').join('') + cells.join('') + '</div>' +
      '<p class="cal-count">이번 달 도장 <b>' + monthStamps(memberId) + '</b>개</p>' +
    '</div>';
  }

  /* ------------------------- render: chat ------------------------- */
  function chatHTML() {
    const me = safeMember(state.viewer);
    const msgs = state.chat.slice().sort((a, b) => a.at - b.at);
    return '<div class="card chat-card">' +
        '<div class="card-head"><h2>💬 우리 가족 채팅</h2>' +
          '<button class="btn btn-ghost btn-tiny" type="button" data-act="toggle-lock">' + (state.chatLock ? '🔓 잠금 풀기' : '🔒 이 기기 잠금') + '</button>' +
        '</div>' +
        '<p class="card-desc">' + state.members.map((m) => esc(m.name)).join('·') + '가 말풍선과 스티커로 이야기해요</p>' +
        '<div class="member-chips">' + state.members.map((m) =>
          '<button type="button" class="member-chip ' + (m.id === me.id ? 'on' : '') + (state.chatLock && m.id !== me.id ? ' locked' : '') + '" data-act="chat-member" data-member="' + m.id + '">' +
            '<span class="avatar tone-' + m.tone + '">' + avatarSVG(m.avatar) + '</span>' + esc(m.name) + '</button>').join('') + '</div>' +
        (state.chatLock ? '<p class="lock-note">🔒 잠겨 있어요 — 이 기기에서는 ' + esc(me.name) + '(으)로 기록돼요</p>' : '') +
        '<p class="caption">한 번 고르면 이 기기에 기억돼요 · 메시지는 가족 모두와 실시간으로 공유돼요</p>' +
        '<div class="chat-feed" id="chatFeed">' + (msgs.length ? msgs.map((msg) => bubbleHTML(msg, me)).join('') : '<div class="empty"><span class="emoji">💬</span>아직 이야기가 없어요<br>첫 마디를 남겨 보세요</div>') + '</div>' +
        '<div class="chat-composer">' +
          '<input class="chat-input" id="chatInput" type="text" value="' + esc(chatDraft) + '" placeholder="' + esc(me.name) + '(으)로 한마디..." data-input="chat-draft" aria-label="메시지">' +
          '<button class="send" type="button" data-act="send-chat">보내기</button>' +
        '</div>' +
        '<div class="sticker-row">' + STICKERS.map((s) =>
          '<button class="sticker-btn" type="button" data-act="chat-sticker" data-sticker="' + esc(s) + '" aria-label="스티커 ' + esc(s) + '">' + s + '</button>').join('') + '</div>' +
        '<p class="caption">💡 스티커를 누르면 바로 보내져요</p>' +
      '</div>';
  }

  function bubbleHTML(msg, me) {
    const m = memberById(msg.memberId) || state.members[0];
    const mine = msg.memberId === me.id;
    const hearts = Array.isArray(msg.hearts) ? msg.hearts : [];
    const hearted = hearts.indexOf(me.id) >= 0;
    const isSticker = msg.type === 'sticker';
    return '<div class="bubble-row ' + (mine ? 'mine' : 'other') + '">' +
      (mine ? '' : '<span class="avatar xxs tone-' + m.tone + '">' + avatarSVG(m.avatar) + '</span>') +
      '<div class="bubble-wrap">' +
        (mine ? '' : '<p class="bubble-name">' + esc(m.name) + ' <span>' + fmtWhen(msg.at) + '</span></p>') +
        '<div class="bubble ' + (isSticker ? 'sticker' : '') + '">' + esc(msg.text) + '</div>' +
        '<div class="bubble-actions">' +
          '<button class="react ' + (hearted ? 'on' : '') + '" type="button" data-act="chat-heart" data-id="' + msg.id + '" aria-label="하트">❤️' + (hearts.length ? ' ' + hearts.length : '') + '</button>' +
          '<button class="react del" type="button" data-act="chat-del" data-id="' + msg.id + '" aria-label="메시지 삭제">✕</button>' +
        '</div>' +
      '</div>' +
      (mine ? '<span class="avatar xxs tone-' + m.tone + '">' + avatarSVG(m.avatar) + '</span>' : '') +
    '</div>';
  }

  function scrollChat() {
    const f = qs('#chatFeed');
    if (f) f.scrollTop = f.scrollHeight;
  }

  /* ------------------------- render root ------------------------- */
  function renderViewer() {
    const el = qs('#viewerPill');
    if (!el) return;
    const me = safeMember(state.viewer);
    el.innerHTML = '<span class="avatar xxs tone-' + me.tone + '">' + avatarSVG(me.avatar) + '</span>' +
      '<span class="viewer-name">' + esc(me.name) + '</span>';
    el.setAttribute('title', '지금 ' + me.name + '(으)로 보고 있어요 · 눌러서 바꾸기');
    el.setAttribute('aria-label', '지금 보는 사람: ' + me.name + ' · 바꾸기');
  }

  function render() {
    pendingRender = false;
    const dateEl = qs('#headerDate');
    if (dateEl) dateEl.textContent = fmtKoreanDate(new Date());
    renderViewer();
    renderTabbar();
    setHTML('#tab-home', homeHTML());
    setHTML('#tab-routine', routineHTML());
    setHTML('#tab-schedule', scheduleHTML());
    setHTML('#tab-praise', praiseHTML());
    setHTML('#tab-chat', chatHTML());
    qsa('.tab').forEach((s) => s.classList.toggle('on', s.dataset.tab === currentTab));
    save();
    if (currentTab === 'chat') scrollChat();
  }
  function setHTML(sel, html) {
    const el = qs(sel);
    if (el) el.innerHTML = html;
  }
  function toast(msg) {
    const el = qs('#toast');
    if (!el) return;
    el.textContent = msg;
    el.classList.add('on');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove('on'), 1900);
  }

  /* ------------------------- modal ------------------------- */
  function openModal(opts) {
    const root = qs('#modalRoot');
    if (!root) return;
    root.innerHTML = '<div class="modal-backdrop" data-act="close-modal"></div>' +
      '<div class="modal-sheet" role="dialog" aria-modal="true" aria-label="' + esc(opts.label || '설정') + '">' +
        '<div class="modal-head"><h2>' + (opts.title || '') + '</h2>' +
          '<button class="modal-x" type="button" data-act="close-modal" aria-label="닫기">✕</button></div>' +
        '<div class="modal-body">' + (opts.body || '') + '</div>' +
        (opts.footer ? '<div class="modal-foot">' + opts.footer + '</div>' : '') +
      '</div>';
    root.hidden = false;
    document.body.style.overflow = 'hidden';
    if (opts.onMount) opts.onMount(root);
  }
  function closeModal() {
    const root = qs('#modalRoot');
    if (!root) return;
    root.hidden = true;
    root.innerHTML = '';
    document.body.style.overflow = '';
    pendingConfirm = null;
    flushPendingRender();
  }
  function readFields(root) {
    const out = {};
    qsa('[data-field]', root).forEach((el) => { out[el.dataset.field] = String(el.value || '').trim(); });
    return out;
  }
  function fieldInput(name, label, value, placeholder, type) {
    return '<div class="form-row"><label>' + label + '</label>' +
      '<input data-field="' + name + '" type="' + (type || 'text') + '" value="' + esc(value == null ? '' : value) + '" placeholder="' + esc(placeholder || '') + '"' +
      (type === 'number' ? ' inputmode="numeric"' : ' autocomplete="off"') + '></div>';
  }
  function fieldSelect(name, label, options, value) {
    return '<div class="form-row"><label>' + label + '</label><select data-field="' + name + '">' +
      options.map((o) => '<option value="' + esc(o.v) + '"' + (String(o.v) === String(value) ? ' selected' : '') + '>' + esc(o.l) + '</option>').join('') +
      '</select></div>';
  }
  function childOptions() {
    return children().map((m) => ({ v: m.id, l: m.name }));
  }
  function dayOptions(selected) {
    const out = [];
    for (let i = 0; i < 7; i++) {
      const d = new Date();
      d.setDate(d.getDate() + i);
      const k = ymd(d);
      const label = (i === 0 ? '오늘 · ' : i === 1 ? '내일 · ' : WEEK_MIN[d.getDay()] + '요일 · ') + (d.getMonth() + 1) + '/' + d.getDate();
      out.push({ v: k, l: label });
    }
    return out;
  }
  function confirmModal(title, message, okLabel, onOk) {
    pendingConfirm = onOk;
    openModal({
      title: title,
      label: title,
      body: '<p class="confirm-text">' + message + '</p>',
      footer: '<button class="btn btn-ghost" type="button" data-act="close-modal">취소</button>' +
        '<button class="btn btn-pink" type="button" data-act="confirm-ok">' + okLabel + '</button>'
    });
  }

  /* ------------------------- modals ------------------------- */
  function openViewer() {
    openModal({
      title: '🙋 지금 보는 사람',
      label: '보는 사람',
      body: '<p class="form-note">이 기기에서 누구로 볼지 골라요. 시아·아윤이는 자기 루틴과 일정을 체크하고, 엄마·아빠는 칭찬과 채팅으로 함께해요.</p>' +
        '<div class="edit-list">' + state.members.map((m) =>
          '<button class="member-row" type="button" data-act="set-viewer" data-member="' + m.id + '">' +
            '<span class="avatar sm tone-' + m.tone + '">' + avatarSVG(m.avatar) + '</span>' +
            '<span class="m-info"><span class="m-name">' + esc(m.name) + '</span><span class="m-sub">' + esc(m.sub) + '</span></span>' +
            (m.id === state.viewer ? '<span class="pill-count">지금</span>' : '') +
          '</button>').join('') + '</div>',
      footer: '<button class="btn btn-ghost" type="button" data-act="close-modal">닫기</button>'
    });
  }

  function openSettings() {
    const body = '<p class="form-note">' + (syncMode === 'live' ? '🟢 가족 모두와 실시간으로 연결돼 있어요.' : '⚪ 지금은 이 기기에만 저장돼요 · 인터넷이 되면 자동으로 이어져요.') + '</p>' +
      '<p class="form-note">이름과 소개, 캐릭터를 바꾸면 앱 전체에 바로 반영돼요.</p>' +
      '<div class="edit-list">' + state.members.map((m) =>
        '<div class="edit-row">' +
          '<span class="avatar xs tone-' + m.tone + '">' + avatarSVG(m.avatar) + '</span>' +
          '<div class="edit-fields">' +
            '<input class="edit-input" data-field="name_' + m.id + '" value="' + esc(m.name) + '" aria-label="이름">' +
            '<input class="edit-input small" data-field="sub_' + m.id + '" value="' + esc(m.sub) + '" placeholder="소개 한마디" aria-label="소개">' +
          '</div>' +
          '<select class="edit-select" data-field="avatar_' + m.id + '" aria-label="캐릭터">' +
            AVATARS.map((a) => '<option value="' + a.v + '"' + (a.v === m.avatar ? ' selected' : '') + '>' + a.l + '</option>').join('') +
          '</select>' +
        '</div>').join('') + '</div>' +
      '<div class="form-row"><label>우리 동네 (날씨 카드에 표시)</label>' +
        '<input data-field="place" value="' + esc(state.weather.place) + '"></div>' +
      '<div class="modal-actions-col">' +
        '<button class="btn btn-ghost" type="button" data-act="open-fixed">⚙️ 고정 루틴 관리</button>' +
        '<button class="btn btn-ghost" type="button" data-act="reset-data">🧹 데이터 초기화</button>' +
      '</div>';
    openModal({
      title: '⚙️ 설정',
      label: '설정',
      body: body,
      footer: '<button class="btn btn-ghost" type="button" data-act="close-modal">닫기</button>' +
        '<button class="btn btn-sky" type="button" data-act="save-settings">저장</button>'
    });
  }

  function saveSettings() {
    const root = qs('#modalRoot');
    const v = readFields(root);
    state.members.forEach((m) => {
      const n = v['name_' + m.id];
      if (n) m.name = n.slice(0, 12);
      if (v['sub_' + m.id] != null) m.sub = v['sub_' + m.id].slice(0, 20);
      if (v['avatar_' + m.id]) m.avatar = avatarOf(v['avatar_' + m.id], m.id, m.role);
    });
    if (v.place) state.weather.place = v.place.slice(0, 20);
    closeModal();
    render();
    toast('설정을 저장했어요');
  }

  function openWeather() {
    const w = state.weather;
    openModal({
      title: '🌤️ 날씨 정보 수정',
      label: '날씨',
      body: '<p class="form-note">이 앱은 인터넷에 연결하지 않고, 적어 둔 날씨를 보여 줘요.</p>' +
        fieldInput('place', '지역', w.place, '예: 우리 동네') +
        fieldSelect('cond', '날씨', [{ v: '맑음', l: '맑음' }, { v: '구름', l: '구름' }, { v: '비', l: '비' }, { v: '눈', l: '눈' }], w.cond) +
        '<div class="row-2">' + fieldInput('temp', '지금 기온(°)', w.temp, '11', 'number') + fieldInput('low', '최저(°)', w.low, '6', 'number') + '</div>' +
        '<div class="row-2">' + fieldInput('high', '최고(°)', w.high, '15', 'number') + fieldInput('dust', '미세먼지', w.dust, '초미세먼지 보통') + '</div>' +
        fieldInput('tip', '한마디', w.tip, '☂️ 우산 챙겨요'),
      footer: '<button class="btn btn-ghost" type="button" data-act="close-modal">취소</button>' +
        '<button class="btn btn-sky" type="button" data-act="save-weather">저장</button>'
    });
  }

  function saveWeather() {
    const v = readFields(qs('#modalRoot'));
    state.weather = {
      place: (v.place || state.weather.place).slice(0, 20),
      cond: v.cond || '맑음',
      temp: toInt(v.temp, 11),
      low: toInt(v.low, 6),
      high: toInt(v.high, 15),
      dust: (v.dust || '').slice(0, 20),
      tip: (v.tip || '').slice(0, 20)
    };
    closeModal();
    render();
    toast('날씨를 저장했어요');
  }

  function openAddRoutine(memberId, kind) {
    const m = safeChild(memberId || state.active.routine);
    const k = normKind(kind);
    state.active.routine = m.id;
    openModal({
      title: '📚 ' + kindMeta(k).l + ' 추가',
      label: '루틴 추가',
      body: '<p class="form-note">항목을 마치면 정한 만큼 도장이 쌓여요.</p>' +
        fieldSelect('member', '누구', childOptions(), m.id) +
        fieldSelect('kind', '종류', KINDS.map((x) => ({ v: x.v, l: x.emoji + ' ' + x.l })), k) +
        fieldInput('title', '항목 이름', '', '예: 받아쓰기 연습') +
        fieldInput('tag', '태그 (선택)', '', '예: 10문제 · 30분 · 1장') +
        fieldInput('stamp', '도장 개수', 1, '1', 'number') +
        '<p class="form-err" data-err hidden></p>',
      footer: '<button class="btn btn-ghost" type="button" data-act="close-modal">취소</button>' +
        '<button class="btn btn-sky" type="button" data-act="save-add-routine">추가</button>'
    });
  }

  function saveAddRoutine() {
    const root = qs('#modalRoot');
    const v = readFields(root);
    if (!v.title) {
      const err = qs('[data-err]', root);
      if (err) { err.textContent = '항목 이름을 적어 주세요'; err.hidden = false; }
      return;
    }
    const m = safeChild(v.member);
    const kind = normKind(v.kind);
    const key = tKey();
    if (!state.routines[key]) state.routines[key] = {};
    const list = state.routines[key][m.id] || (state.routines[key][m.id] = []);
    list.push({ id: uid('rt'), title: v.title.slice(0, 30), tag: (v.tag || '').slice(0, 12), stamp: clamp(toInt(v.stamp, 1), 1, 20), kind: kind, done: false, fixedId: null, logId: null });
    state.active.routine = m.id;

  /* ------------------------- finders ------------------------- */  function findRoutine(id) {
    const day = state.routines[tKey()] || {};
    const kids = children();
    for (let i = 0; i < kids.length; i++) {
      const m = kids[i];
      const list = day[m.id] || [];
      const idx = list.findIndex((x) => x.id === id);
      if (idx >= 0) return { member: m, list: list, index: idx, item: list[idx] };
    }
    return null;
  }
  function findTodo(id, memberId, day) {
    const dayKey = isDayKey(day) ? day : tKey();
    const d = state.todos[dayKey] || {};
    if (!d[memberId]) return null;
    const list = d[memberId];
    const idx = list.findIndex((x) => x.id === id);
    if (idx < 0) return null;
    return { member: safeMember(memberId), list: list, index: idx, item: list[idx], day: dayKey };
  }

  /* ------------------------- timer ------------------------- */
  const timer = { mode: 'down', minutes: 10, remaining: 600, elapsed: 0, running: false, endAt: 0, startAt: 0, base: 0, iv: null, audio: null };

  function fmtClock(sec) {
    const s = Math.max(0, Math.floor(sec));
    const h = Math.floor(s / 3600);
    const m = Math.floor((s % 3600) / 60);
    const r = s % 60;
    return h > 0 ? h + ':' + pad2(m) + ':' + pad2(r) : pad2(m) + ':' + pad2(r);
  }
  function timerSeconds() { return timer.mode === 'down' ? timer.remaining : timer.elapsed; }
  function timerHintText() {
    if (timer.running) return timer.mode === 'down' ? '집중하는 중... 화이팅!' : '재는 중... 화이팅!';
    return timer.mode === 'down' ? timer.minutes + '분 · 시작을 눌러요' : '시작을 누르면 시간을 재요';
  }
  function timerHTML() {
    const secs = timerSeconds();
    return '<div class="timer-tabs">' +
        '<button type="button" data-act="timer-mode" data-mode="down" class="' + (timer.mode === 'down' ? 'on' : '') + '">⏳ 남은 시간</button>' +
        '<button type="button" data-act="timer-mode" data-mode="up" class="' + (timer.mode === 'up' ? 'on' : '') + '">⏱️ 재는 시간</button>' +
      '</div>' +
      '<p class="timer-hint" id="timerHint">' + timerHintText() + '</p>' +
      '<p class="timer-display' + (timer.mode === 'down' && secs === 0 ? ' done' : '') + '" id="timerDisplay">' + fmtClock(secs) + '</p>' +
      '<div class="row-2" style="margin-top:14px">' +
        '<button class="btn btn-mint" type="button" data-act="timer-toggle" id="timerToggle">' + (timer.running ? '⏸ 일시정지' : '▶ 시작') + '</button>' +
        '<button class="btn btn-ghost" type="button" data-act="timer-reset">↺ 초기화</button>' +
      '</div>' +
      '<div class="preset-row">' +
        [10, 20, 30].map((mm) => '<button type="button" class="chip ' + (timer.mode === 'down' && timer.minutes === mm ? 'on' : '') + '" data-act="timer-preset" data-min="' + mm + '">' + mm + '분</button>').join('') +
        '<label class="custom-min"><input id="customMin" type="number" min="1" max="180" inputmode="numeric" placeholder="직접" aria-label="직접 분 입력"><span>분</span></label>' +
        '<button type="button" class="btn btn-sky btn-tiny" data-act="timer-custom">맞추기</button>' +
      '</div>';
  }
  function renderTimerBody() {
    const el = qs('#timerBody');
    if (el) el.innerHTML = timerHTML();
  }
  function updateTimerDisplay() {
    const d = qs('#timerDisplay');
    const h = qs('#timerHint');
    if (d) {
      d.textContent = fmtClock(timerSeconds());
      d.classList.toggle('done', timer.mode === 'down' && timer.remaining === 0);
    }
    if (h) h.textContent = timerHintText();
  }
  function beep() {
    try {
      if (!timer.audio) {
        const Ctx = window.AudioContext || window.webkitAudioContext;
        if (Ctx) timer.audio = new Ctx();
      }
      const ctx = timer.audio;
      if (!ctx) return;
      if (ctx.state === 'suspended' && ctx.resume) ctx.resume();
      const o = ctx.createOscillator();
      const g = ctx.createGain();
      o.type = 'sine';
      o.frequency.value = 880;
      o.connect(g);
      g.connect(ctx.destination);
      const t = ctx.currentTime;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.2, t + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.9);
      o.start(t);
      o.stop(t + 1);
    } catch (e) { /* 소리는 없어도 괜찮아요 */ }
    if (navigator.vibrate) { try { navigator.vibrate([120, 80, 120]); } catch (e) { } }
  }
  function timerTick() {
    const now = Date.now();
    if (timer.mode === 'down') {
      timer.remaining = Math.max(0, Math.ceil((timer.endAt - now) / 1000));
      if (timer.remaining <= 0) { finishTimer(); return; }
    } else {
      timer.elapsed = timer.base + Math.floor((now - timer.startAt) / 1000);
    }
    updateTimerDisplay();
  }
  function startTimer() {
    if (timer.running) return;
    if (timer.mode === 'down' && timer.remaining <= 0) timer.remaining = timer.minutes * 60;
    timer.running = true;
    timer.endAt = Date.now() + timer.remaining * 1000;
    timer.startAt = Date.now();
    timer.base = timer.elapsed;
    clearInterval(timer.iv);
    timer.iv = setInterval(timerTick, 250);
    beepInit();
    renderTimerBody();
    updateTimerDisplay();
  }
  function beepInit() {
    try {
      if (!timer.audio) {
        const Ctx = window.AudioContext || window.webkitAudioContext;
        if (Ctx) timer.audio = new Ctx();
      }
    } catch (e) { }
  }
  function pauseTimer() {
    if (!timer.running) return;
    if (timer.mode === 'down') timer.remaining = Math.max(0, Math.ceil((timer.endAt - Date.now()) / 1000));
    else timer.elapsed = timer.base + Math.floor((Date.now() - timer.startAt) / 1000);
    timer.running = false;
    clearInterval(timer.iv);
    timer.iv = null;
    renderTimerBody();
    updateTimerDisplay();
  }
  function finishTimer() {
    timer.running = false;
    timer.remaining = 0;
    clearInterval(timer.iv);
    timer.iv = null;
    renderTimerBody();
    updateTimerDisplay();
    beep();
    toast('⏰ 시간 다 됐어요! 정말 잘했어요');
  }
  function resetTimer() {
    clearInterval(timer.iv);
    timer.iv = null;
    timer.running = false;
    timer.remaining = timer.minutes * 60;
    timer.elapsed = 0;
    timer.base = 0;
    renderTimerBody();
    updateTimerDisplay();
  }
  function setTimerMode(mode) {
    if (mode !== 'down' && mode !== 'up') return;
    clearInterval(timer.iv);
    timer.iv = null;
    timer.running = false;
    timer.mode = mode;
    if (mode === 'down') timer.remaining = timer.minutes * 60;
    else { timer.elapsed = 0; timer.base = 0; }
    renderTimerBody();
    updateTimerDisplay();
  }
  function setPreset(min) {
    const v = clamp(toInt(min, 10), 1, 180);
    clearInterval(timer.iv);
    timer.iv = null;
    timer.running = false;
    timer.mode = 'down';
    timer.minutes = v;
    timer.remaining = v * 60;
    renderTimerBody();
    updateTimerDisplay();
  }

  function setViewer(id) {
    if (!memberIdInList(id, state.members)) return;
    if (state.chatLock && id !== state.viewer) {
      toast('🔒 잠겨 있어요. 잠금을 풀면 바꿀 수 있어요');
      return;
    }
    state.viewer = id;
    closeModal();
    render();
    toast('지금 ' + safeMember(id).name + '(으)로 보고 있어요');
  }

  function toggleRoutine(id) {
    const found = findRoutine(id);
    if (!found) return;
    const item = found.item;
    const m = found.member;
    if (!item.done) {
      item.done = true;
      const amount = clamp(toInt(item.stamp, 1), 1, 20);
      const log = addLog(m.id, 'routine', item.title, amount);
      item.logId = log.id;
      render();
      toast('💮 ' + m.name + ' 도장 +' + amount + ' · 오늘 ' + stampToday(m.id) + '개');
    } else {
      item.done = false;
      if (item.logId) { removeLog(item.logId); item.logId = null; }
      render();
      toast('도장을 하나 돌려놓았어요');
    }
  }

  function pinRoutine(id) {
    const found = findRoutine(id);
    if (!found) return;
    const item = found.item;
    const m = found.member;
    if (item.fixedId) {
      const list = state.fixed[m.id] || [];
      const i = list.findIndex((f) => f.id === item.fixedId);
      if (i >= 0) list.splice(i, 1);
      item.fixedId = null;
      render();
      toast('고정을 풀었어요 (매일 올라오지 않아요)');
    } else {
      if (!state.fixed[m.id]) state.fixed[m.id] = [];
      const fx = { id: uid('fx'), title: item.title, tag: item.tag || '', stamp: item.stamp == null ? 1 : item.stamp, kind: normKind(item.kind) };
      state.fixed[m.id].push(fx);
      item.fixedId = fx.id;
      render();
      toast('매일 아침 자동으로 올라오는 고정 루틴이에요 📍');
    }
  }

  function delRoutine(id) {
    const found = findRoutine(id);
    if (!found) return;
    const wasFixed = !!found.item.fixedId;
    if (found.item.logId) removeLog(found.item.logId);
    found.list.splice(found.index, 1);
    render();
    toast(wasFixed ? '오늘 목록에서 지웠어요 · 고정 루틴이라 내일 다시 올라와요' : '오늘 목록에서 지웠어요');
  }

  function toggleTodo(id, memberId, day) {
    const found = findTodo(id, memberId, day);
    if (!found) return;
    found.item.done = !found.item.done;
    render();
    if (found.item.done) toast('✔️ ' + found.member.name + ' 일정 완료!');
  }

  function delTodo(id, memberId, day) {
    const found = findTodo(id, memberId, day);
    if (!found) return;
    found.list.splice(found.index, 1);
    render();
    toast('일정을 지웠어요');
  }

  function sendPraise() {
    const ta = qs('#praiseNote');
    const text = String(ta ? ta.value : praiseDraft).trim();
    const m = safeChild(state.praiseTarget);
    const from = safeMember(state.viewer);
    const log = addLog(m.id, 'praise', text || '칭찬 별', 1);
    state.praise.push({ id: uid('pr'), memberId: m.id, from: from.id, text: text.slice(0, 120), at: Date.now(), logId: log.id });
    praiseDraft = '';
    render();
    toast('⭐ ' + from.name + ' → ' + m.name + ' 별과 도장을 보냈어요');
  }

  function delPraise(id) {
    const i = state.praise.findIndex((p) => p.id === id);
    if (i < 0) return;
    const entry = state.praise[i];
    if (entry.logId) removeLog(entry.logId);
    state.praise.splice(i, 1);
    render();
    toast('칭찬을 지웠어요');
  }

  function sendChat() {
    const input = qs('#chatInput');
    const text = String(input ? input.value : chatDraft).trim();
    if (!text) { toast('한마디 적어 주세요'); return; }
    state.chat.push({ id: uid('ms'), memberId: state.viewer, type: 'text', text: text.slice(0, 300), at: Date.now(), hearts: [] });
    chatDraft = '';
    render();
    scrollChat();
  }
  function sendSticker(emoji) {
    state.chat.push({ id: uid('ms'), memberId: state.viewer, type: 'sticker', text: emoji, at: Date.now(), hearts: [] });
    render();
    scrollChat();
  }
  function toggleHeart(id) {
    const msg = state.chat.find((x) => x.id === id);
    if (!msg) return;
    if (!Array.isArray(msg.hearts)) msg.hearts = [];
    const me = state.viewer;
    const i = msg.hearts.indexOf(me);
    if (i >= 0) msg.hearts.splice(i, 1);
    else msg.hearts.push(me);
    render();
  }
  function delChat(id) {
    const i = state.chat.findIndex((x) => x.id === id);
    if (i < 0) return;
    state.chat.splice(i, 1);
    render();
    toast('메시지를 지웠어요');
  }

  /* ------------------------- events ------------------------- */
  function bindEvents() {
    document.addEventListener('click', (e) => {
      const el = e.target.closest ? e.target.closest('[data-act]') : null;
      if (!el) return;
      const fn = actions[el.dataset.act];
      if (!fn) return;
      if (el.tagName === 'BUTTON' || el.tagName === 'A') e.preventDefault();
      fn(el);
    });

    document.addEventListener('input', (e) => {
      const el = e.target.closest ? e.target.closest('[data-input]') : null;
      if (!el) return;
      const k = el.dataset.input;
      if (k === 'chat-draft') chatDraft = el.value;
      else if (k === 'praise-note') praiseDraft = el.value;
    });

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') { const root = qs('#modalRoot'); if (root && !root.hidden) closeModal(); }
      if (e.key === 'Enter' && e.target && e.target.id === 'chatInput') { e.preventDefault(); sendChat(); }
    });

    /* 입력창에서 손을 땠을 때, 미뤄 둔 다른 기기 기록을 반영해요 */
    document.addEventListener('focusout', () => { setTimeout(flushPendingRender, 0); });
  }

  /* ------------------------- midnight watch ------------------------- */
  function watchMidnight() {
    setInterval(() => {
      const k = tKey();
      if (k !== state.lastSeen) {
        state.lastSeen = k;
        ensureDay(state, k, false);
        save();
        render();
        toast('새로운 하루예요! 오늘 루틴이 올라왔어요 🌞');
      }
    }, 30000);
  }

  /* ------------------------- init ------------------------- */
  function init() {
    state = load();
    ensureDay(state, tKey(), false);
    state.lastSeen = tKey();
    if (!memberIdInList(state.viewer, state.members)) state.viewer = children()[0].id;
    if (!children().some((m) => m.id === state.active.routine)) state.active.routine = children()[0].id;
    if (!children().some((m) => m.id === state.active.schedule)) state.active.schedule = children()[0].id;
    if (!children().some((m) => m.id === state.active.stamp)) state.active.stamp = children()[0].id;
    if (!children().some((m) => m.id === calSet)) calSet = state.active.stamp;
    if (!children().some((m) => m.id === state.praiseTarget)) state.praiseTarget = children()[0].id;
    bindEvents();
    render();
    watchMidnight();
    initSync();
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
  else init();
})();
</script>
</body>
</html>
