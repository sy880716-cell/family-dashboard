<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFF8E7">
<meta name="color-scheme" content="light">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="format-detection" content="telephone=no">
<title>우리 가족 기록장</title>
<style>/* ============================================================
   우리 가족 기록장 — styles
   ============================================================ */
:root {
  color-scheme: light;
  --cream: #FFF8E7;
  --cream-2: #FFFBEB;
  --white: #FFFFFF;
  --line: #F3E8D2;
  --line-strong: #EADCC0;
  --brown: #6B5646;
  --brown-soft: #8A7462;
  --muted: #AA9B8B;
  --pink: #FFC7D2;
  --pink-deep: #E8798E;
  --pink-soft: #FFF1F4;
  --sky: #CFE8F8;
  --sky-deep: #4A90C2;
  --sky-soft: #F1F8FD;
  --butter: #FFE9A8;
  --butter-deep: #D9A73C;
  --butter-soft: #FFF9E6;
  --mint: #D2EDD9;
  --mint-deep: #4E9C71;
  --mint-soft: #F2FAF4;
  --lav: #E3D9F6;
  --lav-deep: #8B72BE;
  --shadow: 0 6px 18px rgba(190, 160, 120, 0.12);
  --shadow-sm: 0 3px 10px rgba(190, 160, 120, 0.10);
  --r: 20px;
}

*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  font-family: 'Pretendard', 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', system-ui, -apple-system, sans-serif;
  color: var(--brown);
  background: var(--cream);
  font-size: 15px;
  line-height: 1.45;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
  word-break: keep-all;
  overflow-wrap: break-word;
}
body::before {
  content: '';
  position: fixed;
  inset: 0;
  z-index: 0;
  pointer-events: none;
  background:
    radial-gradient(120% 55% at 8% -8%, #FFF3C9 0%, rgba(255, 243, 201, 0) 62%),
    radial-gradient(95% 45% at 100% 6%, #FFE7EE 0%, rgba(255, 231, 238, 0) 58%),
    radial-gradient(90% 45% at 0% 100%, #EAF6EC 0%, rgba(234, 246, 236, 0) 60%),
    linear-gradient(180deg, #FFF8E7 0%, #FFFBEB 45%, #FFF6E3 100%);
}
button { font-family: inherit; cursor: pointer; }
input, select, textarea { font-family: inherit; }

.app {
  position: relative;
  z-index: 1;
  max-width: 480px;
  margin: 0 auto;
  padding: 0 14px calc(92px + env(safe-area-inset-bottom));
}

/* ---------------- header ---------------- */
.app-header { padding: 18px 2px 4px; }
.brand-row { display: flex; align-items: center; gap: 8px; }
.brand-mascot {
  width: 46px; height: 46px; flex: 0 0 auto;
  display: grid; place-items: center;
  background: #fff; border: 1px solid var(--line);
  border-radius: 16px; box-shadow: var(--shadow-sm);
}
.brand-mascot svg { width: 36px; height: 36px; display: block; }
.brand { margin: 0; font-size: 25px; line-height: 1.15; font-weight: 900; letter-spacing: -1.2px; flex: 0 1 auto; }
.brand .t1 { color: #7A5C42; }
.brand .t2 { color: #E8798E; }
.gear-btn {
  margin-left: auto; position: relative; flex: 0 0 auto;
  display: flex; align-items: center; justify-content: center; gap: 5px;
  width: 60px; height: 42px; padding: 0;
  border-radius: 21px; border: 1px solid var(--line);
  background: #fff; box-shadow: var(--shadow-sm); font-size: 17px;
}
.gear-btn:active { transform: scale(0.97); }
.gear-btn .dot {
  width: 9px; height: 9px; border-radius: 50%;
  background: #5CC98B; box-shadow: 0 0 0 3px rgba(92, 201, 139, 0.16);
}
.header-sub { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 8px 10px; margin-top: 14px; }
.header-sub > div { flex: 1 1 auto; min-width: 0; }
.date-main { margin: 0; font-size: 16px; font-weight: 800; color: #7C6A58; letter-spacing: -0.3px; }
.tagline { margin: 2px 0 0; font-size: 14.5px; color: #9A8A79; font-weight: 700; letter-spacing: -0.3px; }
.hello-pill {
  flex: 0 0 auto; max-width: 56%; overflow: hidden; text-overflow: ellipsis;
  font-size: 11.5px; font-weight: 800; color: #8A6A2E;
  background: #FFF7E0; border: 1px solid #F0E1B8;
  border-radius: 999px; padding: 7px 11px; white-space: nowrap;
  box-shadow: var(--shadow-sm);
}
.header-pills { flex: 0 0 auto; display: flex; flex-wrap: wrap; align-items: center; justify-content: flex-end; gap: 6px; }
.header-pills .hello-pill { max-width: 100%; }

/* 실시간 동기화 상태 */
.sync-pill {
  flex: 0 0 auto; display: inline-flex; align-items: center; gap: 5px;
  font-size: 11px; font-weight: 800; letter-spacing: -0.2px;
  color: #9A8A79; background: #FFFFFF;
  border: 1px solid var(--line); border-radius: 999px;
  padding: 6px 10px; white-space: nowrap;
  box-shadow: var(--shadow-sm);
  transition: color 0.2s ease, background 0.2s ease, border-color 0.2s ease;
}
.sync-dot { width: 7px; height: 7px; border-radius: 50%; background: #E0A24E; flex: 0 0 auto; box-shadow: 0 0 0 3px rgba(224, 162, 78, 0.14); }
.sync-label { line-height: 1; }
.sync-pill[data-state="live"] { color: #3F8B63; border-color: #CDE7D7; background: #F3FBF6; }
.sync-pill[data-state="live"] .sync-dot { background: #4EC07E; box-shadow: 0 0 0 3px rgba(78, 192, 126, 0.18); }
.sync-pill[data-state="connecting"] { color: #A98A3E; border-color: #F0E1B8; background: #FFFAEC; }
.sync-pill[data-state="connecting"] .sync-dot { background: #E8C05A; box-shadow: 0 0 0 3px rgba(232, 192, 90, 0.16); }
.sync-pill[data-state="local"] { color: #A9803E; border-color: #F0E1B8; background: #FFFAEC; }

/* ---------------- layout ---------------- */
.tab { display: none; }
.tab.on { display: block; animation: fade 0.22s ease; }
.tab > * + * { margin-top: 13px; }
.tab > *:first-child { margin-top: 16px; }

@keyframes fade { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }

.card {
  background: #fff;
  border: 1px solid var(--line);
  border-radius: var(--r);
  padding: 16px;
  box-shadow: var(--shadow);
}
.card-head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 6px 10px; margin-bottom: 6px; }
.card-head h2 {
  margin: 0; font-size: 16.5px; font-weight: 800; letter-spacing: -0.4px;
  display: flex; align-items: center; gap: 5px;
  flex: 1 1 auto; min-width: 0; line-height: 1.3;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.card-head > *:not(h2) { flex: 0 0 auto; }
.card-desc { margin: 0 0 10px; font-size: 12.5px; color: var(--muted); line-height: 1.5; font-weight: 600; }
.card-desc.center { text-align: center; margin: 10px 0 0; }
.foot-note { text-align: center; font-size: 11px; font-weight: 700; color: #C4B4A2; padding: 18px 0 4px; }

/* ---------------- buttons & chips ---------------- */
.btn {
  border: 1px solid var(--line);
  background: #fff;
  color: var(--brown);
  font: inherit;
  font-weight: 800;
  font-size: 13.5px;
  padding: 11px 14px;
  border-radius: 14px;
  box-shadow: var(--shadow-sm);
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  transition: transform 0.08s ease;
  letter-spacing: -0.3px;
  min-height: 44px;
}
.btn:active { transform: scale(0.98); }
.btn:disabled { opacity: 0.6; box-shadow: none; }
.btn-mint { background: #DEF3E2; border-color: #BFE4C7; color: #3F8259; }
.btn-pink { background: #FFDFE7; border-color: #F8C6D2; color: #C15876; }
.btn-sky { background: #E4F3FD; border-color: #C7E4F7; color: #3E7BA6; }
.btn-ghost { background: #FFFDF7; }
.btn-tiny { padding: 8px 12px; min-height: 34px; font-size: 12px; border-radius: 999px; }
.btn-block { width: 100%; }
.row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

.chip {
  flex: 0 0 auto;
  border: 1px solid var(--line); background: #fff; color: #7A6857;
  font: inherit; font-size: 12.5px; font-weight: 800;
  padding: 8px 12px; border-radius: 999px; white-space: nowrap;
}
.chip.on { background: #FFF3D2; border-color: #F0D79A; color: #9A7220; }
.quick {
  display: inline-block; margin: 0 4px 5px 0;
  font: inherit; font-size: 11px; font-weight: 700; color: #9A8A79;
  background: #FFFBF2; border: 1px solid #F1E7D6; border-radius: 999px; padding: 4px 8px;
}
.quick:active { background: #FFF3D8; }
.quick-row { display: block; margin-top: 7px; }

.mini {
  width: 34px; height: 34px; border-radius: 12px;
  border: 1px solid var(--line); background: #FFFDF7;
  display: grid; place-items: center; font-size: 14px; color: #B08A8A;
  box-shadow: 0 1px 4px rgba(190, 160, 120, 0.08);
  flex: 0 0 auto;
}
.mini:active { transform: scale(0.95); }
.mini-on { background: #FFF1C9; border-color: #EFD79A; }
.mini-x { color: #D1697C; }

.member-chips {
  display: flex; gap: 8px; overflow-x: auto; padding: 2px 0 4px;
  -webkit-overflow-scrolling: touch; scrollbar-width: none;
}
.member-chips::-webkit-scrollbar { display: none; }
.member-chip {
  flex: 0 0 auto; display: flex; align-items: center; gap: 7px;
  padding: 6px 12px 6px 6px; border-radius: 999px;
  border: 1px solid var(--line); background: #fff;
  font-size: 13px; font-weight: 800; color: #7A6857;
}
.member-chip.on { border-color: #B9DCF3; background: #EFF8FE; color: #3E7BA6; box-shadow: 0 0 0 2px rgba(185, 220, 243, 0.45); }
.member-chip .avatar { width: 28px; height: 28px; border-radius: 10px; border: 0; }
.member-chip.locked { opacity: 0.55; }

.pill-flame {
  font-size: 12px; font-weight: 900; color: #C77A2C;
  background: #FFF3E0; border: 1px solid #F6DFBC;
  border-radius: 999px; padding: 6px 11px; white-space: nowrap;
}
.pill-count {
  font-size: 11.5px; font-weight: 800; color: #A08A70;
  background: #FFFBF0; border: 1px solid #F0E4CB;
  border-radius: 999px; padding: 6px 10px; white-space: nowrap;
}
.badge { font-size: 11px; font-weight: 800; padding: 5px 10px; border-radius: 999px; border: 1px solid transparent; }
.badge-warm { background: #FFF3E2; border-color: #F5DFC0; color: #B98335; }
.badge-soft { background: #fff; border-color: var(--line); color: #8A7A69; }

/* ---------------- avatars ---------------- */
.avatar {
  width: 58px; height: 58px; flex: 0 0 auto;
  border-radius: 18px; background: #FFFDF7; border: 1px solid var(--line);
  display: grid; place-items: center; overflow: hidden;
  box-shadow: inset 0 -3px 0 rgba(0, 0, 0, 0.02);
}
.avatar svg { width: 100%; height: 100%; display: block; }
.avatar.sm { width: 44px; height: 44px; border-radius: 14px; }
.avatar.xs { width: 32px; height: 32px; border-radius: 11px; }
.avatar.xxs { width: 30px; height: 30px; border-radius: 10px; }
.tone-sky { background: linear-gradient(180deg, #F2FAFF, #E6F4FD); }
.tone-pink { background: linear-gradient(180deg, #FFF5F8, #FFE9F0); }
.tone-butter { background: linear-gradient(180deg, #FFFBEE, #FFF3D6); }
.tone-mint { background: linear-gradient(180deg, #F5FCF6, #E7F6EC); }

/* ---------------- home: weather ---------------- */
.weather-card { background: linear-gradient(180deg, #F5FBFF, #EFF7FE); border-color: #D8EAF6; }
.weather-top { display: flex; align-items: center; gap: 10px; }
.weather-icon { width: 44px; height: 44px; flex: 0 0 auto; }
.w-place { margin: 0; font-size: 11.5px; font-weight: 800; color: #7A8FA0; }
.w-line { margin: 1px 0 0; font-size: 14px; font-weight: 800; color: #4E6C7C; display: flex; align-items: baseline; gap: 5px; flex-wrap: wrap; }
.w-line b { font-size: 22px; color: #2F5C77; letter-spacing: -0.6px; }
.w-range { font-size: 11.5px; color: #7A8FA0; font-weight: 700; }
.weather-badges { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }

/* ---------------- home: members ---------------- */
.member-group {
  background: linear-gradient(160deg, #E9F7EC 0%, #F7FCF5 45%, #FFFDF7 100%);
  border: 1px solid #E0EFDF; border-radius: 24px; padding: 10px;
  display: flex; flex-direction: column; gap: 9px; box-shadow: var(--shadow);
}
.member-row {
  display: flex; align-items: center; gap: 11px; width: 100%;
  background: #fff; border: 1px solid #EFF3EA; border-radius: 18px;
  padding: 10px 12px; box-shadow: 0 2px 8px rgba(160, 180, 150, 0.10);
  text-align: left; font: inherit;
}
.member-row:active { transform: scale(0.995); }
.m-info { flex: 1; min-width: 0; display: block; }
.m-name { display: block; margin: 0; font-size: 16px; font-weight: 800; letter-spacing: -0.4px; color: #5D4B3C; }
.m-sub { display: block; margin: 1px 0 0; font-size: 11.5px; color: #A5947F; font-weight: 700; }
.m-pill {
  display: inline-block; margin-top: 4px;
  font-size: 10.5px; font-weight: 800; color: #7A8FA0;
  background: #F4F8FB; border: 1px solid #E4EEF5; border-radius: 999px; padding: 2px 7px;
}
.m-right { display: block; margin-left: auto; text-align: right; flex: 0 0 auto; }
.m-star { margin: 0; font-size: 16.5px; font-weight: 900; color: #5D4B3C; display: flex; align-items: center; gap: 4px; justify-content: flex-end; }
.m-cap { display: block; margin: 1px 0 0; font-size: 10.5px; font-weight: 800; color: #C79A9A; }
.m-stamp { display: flex; align-items: center; gap: 3px; justify-content: flex-end; margin: 0; font-size: 17px; font-weight: 900; color: #8A6A2E; }
.m-stamp b { font-size: 19px; letter-spacing: -0.6px; }
.stamp-badge {
  font-size: 10.5px; font-weight: 800; color: #A07A2E;
  background: #FFF6DF; border: 1px solid #F0E0B8;
  border-radius: 999px; padding: 2px 8px; white-space: nowrap;
}
.rt-stamp {
  font-size: 12px; font-weight: 900; color: #A07A2E;
  background: #FFF6DF; border: 1px solid #F0E0B8;
  border-radius: 999px; padding: 6px 10px; white-space: nowrap;
}
.totals { display: block; margin: 2px 0 4px; }
.total-chip {
  display: inline-flex; align-items: center; gap: 5px; margin: 0 5px 6px 0;
  font-size: 11.5px; font-weight: 800; color: #8A6A2E;
  background: #FFFAEC; border: 1px solid #F1E4C4; border-radius: 999px; padding: 4px 9px 4px 5px;
}
.total-chip .avatar { width: 22px; height: 22px; border-radius: 8px; border: 0; }
.ledger-item { display: flex; align-items: center; gap: 8px; padding: 9px 0; border-top: 1px dashed #F2E9DA; }
.ledger-item:first-of-type { border-top: 0; }
.ledger-text { display: block; flex: 1; min-width: 0; font-size: 12.5px; font-weight: 800; color: #5D4B3C; }
.ledger-text small { display: block; font-size: 10.5px; color: #B7A997; font-weight: 700; margin-top: 1px; }
.ledger-amount {
  flex: 0 0 auto; font-size: 11.5px; font-weight: 900; color: #C77A2C;
  background: #FFF6E0; border: 1px solid #F0E0B8; border-radius: 999px; padding: 3px 8px;
}

/* ---------------- home: stamp board ---------------- */
.stamp-card { background: linear-gradient(150deg, #FFF3F6 0%, #FFF9F6 48%, #FFFDF8 100%); border-color: #FBE3E8; }
.week-row { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; margin: 14px 0 12px; }
.day-slot { display: flex; flex-direction: column; align-items: center; gap: 6px; }
.dow { margin: 0; font-size: 10.5px; font-weight: 800; color: #B4A291; }
.slot {
  width: 100%; max-width: 40px; aspect-ratio: 1;
  border-radius: 50%; border: 2px dashed #E7DCCB; background: #FFFDF8;
  display: grid; place-items: center; overflow: hidden;
  font-size: 12px; color: #C7B7A5; font-weight: 800;
}
.slot svg { width: 84%; height: 84%; }
.slot.stamped { border: 2px solid #F2D49B; background: #FFFBEE; }
.slot.today { box-shadow: 0 0 0 3px #BEE0F5; border-style: solid; }
.stamp-foot { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.stamp-foot .btn { margin-left: auto; }

/* ---------------- home: mission ---------------- */
.mission-card { background: linear-gradient(160deg, #FFF1F0 0%, #FFF8F3 55%, #FFFCF7 100%); border-color: #FBE0D9; }
.mission-emoji { margin: 8px 0 2px; font-size: 40px; line-height: 1; }
.mission-text { margin: 0 0 14px; font-size: 19px; font-weight: 900; color: #6B4E45; letter-spacing: -0.6px; word-break: keep-all; }
.mission-actions { display: grid; grid-template-columns: 1.1fr 1fr; gap: 8px; }

/* ---------------- routine ---------------- */
.routine-card { background: linear-gradient(160deg, #F2F9FF 0%, #F9FCFF 55%, #FFFDF7 100%); border-color: #DCEBF7; }
.progress-line { display: flex; align-items: center; gap: 10px; margin-top: 12px; }
.bar { flex: 1; height: 12px; border-radius: 999px; background: #EFF3EA; overflow: hidden; box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.05); }
.bar i { display: block; height: 100%; border-radius: 999px; background: linear-gradient(90deg, #8CC7EE, #63A9DC); transition: width 0.3s ease; }
.progress-line span { font-size: 12px; font-weight: 900; color: #5C7E96; white-space: nowrap; }

.member-routine { padding: 14px; }
.rt-head { display: flex; align-items: center; gap: 10px; padding-bottom: 10px; border-bottom: 1px dashed #F0E6D6; }
.rt-head .m-name { font-size: 17px; }
.rt-item { display: flex; align-items: center; gap: 10px; padding: 11px 0; border-top: 1px dashed #F0E6D6; }
.rt-item:first-child { border-top: 0; }
.check {
  width: 26px; height: 26px; flex: 0 0 auto;
  border-radius: 9px; border: 2px solid #DACCB8; background: #fff;
  display: grid; place-items: center; color: #fff; padding: 0;
}
.check svg { width: 15px; height: 15px; }
.rt-item.done .check { background: #6FB3E0; border-color: #6FB3E0; }
.rt-item.done .rt-title { color: #B7A997; text-decoration: line-through; }
.rt-item.done .tag { opacity: 0.6; }
.rt-body { flex: 1 1 auto; min-width: 0; display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.rt-title { margin: 0; font-size: 14.5px; font-weight: 800; color: #5D4B3C; word-break: keep-all; }
.tag { font-size: 10.5px; font-weight: 800; color: #A08453; background: #FFF6E0; border: 1px solid #F3E5C2; border-radius: 999px; padding: 2px 8px; }
.rt-actions { display: flex; gap: 5px; flex: 0 0 auto; }
.rt-actions .mini { flex: 0 0 auto; }
.add-dashed {
  width: 100%; margin-top: 10px;
  border: 1.5px dashed #E3D2B8; background: #FFFDF6; color: #A8907A;
  font: inherit; font-size: 13px; font-weight: 800; padding: 11px; border-radius: 14px;
}
.add-dashed:active { background: #FFF7E4; }

.timer-card { background: linear-gradient(160deg, #F3F9FE 0%, #FBFDFF 55%, #FFFCF4 100%); border-color: #DCEBF7; }
.timer-box { margin-top: 4px; padding: 16px 12px; border: 2px dashed #CFE3F5; border-radius: 20px; background: rgba(255, 255, 255, 0.72); text-align: center; }
.timer-tabs { display: inline-flex; gap: 4px; padding: 4px; background: #fff; border: 1px solid #DCEAF6; border-radius: 999px; box-shadow: var(--shadow-sm); }
.timer-tabs button { border: 0; background: transparent; font: inherit; font-size: 12.5px; font-weight: 800; color: #89A0B2; padding: 8px 13px; border-radius: 999px; }
.timer-tabs button.on { background: #E7F2FD; color: #3E7BA6; box-shadow: inset 0 0 0 1px #C9E2F7; }
.timer-hint { margin: 10px 0 0; font-size: 11.5px; font-weight: 800; color: #9BB0BE; }
.timer-display { margin: 2px 0 0; font-size: 52px; line-height: 1.15; font-weight: 900; color: #2F5C86; letter-spacing: -2.5px; font-variant-numeric: tabular-nums; }
.timer-display.done { color: #D1697C; }
.preset-row { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; align-items: center; margin-top: 12px; }
.custom-min { display: flex; align-items: center; gap: 2px; border: 1px solid var(--line); border-radius: 999px; background: #fff; padding: 4px 10px; }
.custom-min input { width: 52px; border: 0; outline: 0; font: inherit; font-size: 13px; font-weight: 800; color: #3E7BA6; text-align: center; background: transparent; }
.custom-min span { font-size: 11.5px; font-weight: 700; color: #9BB0BE; }

/* ---------------- meals ---------------- */
.meal-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; }
.meal-card { border-radius: 16px; padding: 10px 11px; border: 1px solid var(--line); background: #FFFDF8; }
.meal-card.breakfast { background: linear-gradient(180deg, #FFF9EC, #FFFDF8); border-color: #F6E7C8; }
.meal-card.lunch { background: linear-gradient(180deg, #F1FAF3, #FDFEFC); border-color: #D9EEDF; }
.meal-card.dinner { background: linear-gradient(180deg, #F2F8FE, #FCFEFF); border-color: #D8E9F7; }

.todo-title { flex: 1; margin: 0; font-size: 14px; font-weight: 700; color: #5D4B3C; word-break: keep-all; min-width: 0; }

.round {

.water-dots i { flex: 1; height: 7px; border-radius: 999px; background: #EDF3F8; }

.toggle-chip {

.toggle-chip .state { margin-left: auto; font-size: 11px; font-weight: 800; color: #B4A291; }
.toggle-chip.on .state { color: #4E9C71; }

.praise-card { background: linear-gradient(160deg, #FFF8F2, #FFFDF8); border-color: #F6E7D2; }
textarea.note {
  width: 100%; min-height: 62px; border: 1px solid #EFE6D8; border-radius: 14px;
  background: #fff; padding: 10px 11px; font: inherit; font-size: 13.5px; color: #5D4B3C;

}
.feed-item { display: flex; gap: 9px; padding: 10px 0; border-top: 1px dashed #F2E9DA; align-items: flex-start; }

.feed-body { display: block; flex: 1; min-width: 0; }
.feed-head { margin: 0; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; font-size: 12.5px; font-weight: 900; color: #5D4B3C; }
.feed-star { color: #D9A73C; }
.feed-time { margin-left: auto; font-size: 10.5px; font-weight: 700; color: #B7A997; }

.star-total span { font-size: 11.5px; font-weight: 800; color: #A08A70; background: #FFFBF0; border: 1px solid #F0E4CB; border-radius: 999px; padding: 4px 9px; }

/* ---------------- calendar ---------------- */
.cal { margin-top: 4px; }
.modal-body { padding-bottom: 2px; }
.cal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
.cal-title { margin: 0; font-size: 13.5px; font-weight: 900; color: #5D4B3C; }
.cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
.cal-dow { text-align: center; font-size: 10.5px; font-weight: 800; color: #B4A291; padding: 2px 0; }
.cal-cell {

  color: #9A8A79; background: #FFFDF7; border: 1px solid transparent;
}
.cal-cell.empty { background: transparent; }
.cal-cell.stamped { background: #FFF6E0; border-color: #F0E1B8; color: #A08453; }
.cal-cell.stamped::after { content: '★'; position: absolute; top: 1px; right: 3px; font-size: 7px; color: #E8B94A; }
.cal-cell.today { border-color: #B9DCF3; background: #EFF8FE; color: #3E7BA6; box-shadow: 0 0 0 2px rgba(185, 220, 243, 0.45); }
.cal-count { margin: 9px 0 0; text-align: center; font-size: 11.5px; font-weight: 800; color: #A08A70; }
.cal-count b { color: #C77A2C; }

.bubble-row { display: flex; align-items: flex-end; gap: 7px; }

.bubble-wrap { max-width: 78%; display: flex; flex-direction: column; gap: 4px; align-items: flex-start; }
.bubble-row.mine .bubble-wrap { align-items: flex-end; }
.bubble-name { margin: 0; font-size: 10.5px; font-weight: 800; color: #B4A291; display: flex; gap: 5px; }

.react.del { color: #C9B7A7; }

.chat-input {

}
.send {

  box-shadow: 0 4px 12px rgba(90, 169, 223, 0.3);

.sticker-row { display: flex; gap: 6px; overflow-x: auto; margin-top: 9px; padding-bottom: 2px; scrollbar-width: none; }

.sticker-btn {

.caption { margin: 8px 0 0; font-size: 10.5px; color: #B7A997; font-weight: 700; line-height: 1.5; }
.lock-note {

/* ---------------- tabbar ---------------- */
.tabbar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 60;
  background: rgba(255, 251, 235, 0.95);

.tab-btn.on { background: #FFF2CE; color: #8A6A2E; box-shadow: inset 0 0 0 1px #F3E3B6; }

.modal-root { position: fixed; inset: 0; z-index: 100; display: flex; align-items: flex-end; justify-content: center; }
.modal-root[hidden] { display: none; }
.modal-backdrop { position: absolute; inset: 0; background: rgba(80, 62, 45, 0.34); }

  border-radius: 24px 24px 0 0;
  padding: 18px 16px calc(18px + env(safe-area-inset-bottom));

  animation: sheet-up 0.24s ease;
  -webkit-overflow-scrolling: touch;
}
@keyframes sheet-up { from { transform: translateY(24px); opacity: 0.6; } to { transform: none; opacity: 1; } }
.modal-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 12px; }
.modal-head h2 { margin: 0; font-size: 17.5px; font-weight: 900; letter-spacing: -0.5px; }
.modal-x { width: 34px; height: 34px; border-radius: 12px; border: 1px solid var(--line); background: #fff; font-size: 13px; color: #A5947F; padding: 0; }

.modal-foot .btn { flex: 1; }
.modal-actions-col { display: flex; flex-direction: column; gap: 8px; margin-top: 14px; }
.confirm-text { margin: 0; font-size: 13.5px; color: #7A6857; font-weight: 700; line-height: 1.6; }

.form-row { margin-bottom: 10px; }
.form-row label { display: block; font-size: 11.5px; font-weight: 800; color: #8A7A69; margin-bottom: 5px; }
.form-row input, .form-row select, .form-row textarea {
  width: 100%; border: 1px solid #EFE6D8; border-radius: 12px; background: #fff;

}

.edit-list { display: flex; flex-direction: column; gap: 8px; margin-bottom: 12px; }

  background: #FFFDF8; outline: 0; width: 100%;

    const out = [];
    for (let i = 0; i < 7; i++) {

    }

  /* 어떤 모양의 저장값이든 화면이 그릴 수 있는 상태로 다듬어요 */
  function normalizeState(raw) {
    const base = blankState();
    if (!raw || typeof raw !== 'object') return base;
    const st = Object.assign({}, base, raw);
    const list = (Array.isArray(raw.members) && raw.members.length) ? raw.members : base.members;
    st.members = list.slice(0, 6).map((m, i) => ({

      if (!st[k] || typeof st[k] !== 'object') st[k] = base[k] || {};

    if (!raw || typeof raw !== 'object') return st;

    if (typeof raw.chatLock === 'boolean') st.chatLock = raw.chatLock;

  /* 가족 모두와 나누는 부분만 담아요 (이 기기 설정은 빼고) */
  function sharedPayload() {
    const out = {};
    SHARED_KEYS.forEach((k) => { if (state[k] !== undefined) out[k] = state[k]; });
    return JSON.parse(JSON.stringify(out));
  }

  function queuePush() {
    if (applyingRemote || !fbRef) return;
    if (!fbConnected) unsynced = true;
    if (pushTimer) clearTimeout(pushTimer);
    pushTimer = setTimeout(pushNow, 250);
  }

  function pushNow() {
    if (pushTimer) { clearTimeout(pushTimer); pushTimer = null; }
    if (!fbRef) return;
    if (firstSnap) { unsynced = true; return; }   /* 서버 값과 한 번 맞추기 전에는 올리지 않아요 */
    state.updatedAt = Date.now();
    const payload = sharedPayload();
    const sig = JSON.stringify(payload);
    persistLocal();
    if (sig === lastRemoteSig) return;      /* 방금 받은 값 그대로면 되돌려 보내지 않아요 */
    recentPushes.push(sig);
    if (recentPushes.length > 8) recentPushes.shift();

  function applyRemote(remote) {
    if (!remote || typeof remote !== 'object') return;
    const next = normalizeState(remote);
    DEVICE_KEYS.forEach((k) => { next[k] = state[k]; });
    state = next;
    if (state.lastSeen !== tKey()) state.lastSeen = tKey();

    if (!memberById(state.active.schedule)) state.active.schedule = state.members[0].id;

      const remoteAt = toInt(remote && remote.updatedAt, 0);
      /* 방이 비었거나 · 이 기기에 쓰던 기록이 있고 그게 더 최신이면 지금 값을 올려요 */
      if (!remote || (hadLocalCache && (unsynced || localAt > remoteAt + 1000))) {
        unsynced = false;
        pushNow();
        return;
      }
      unsynced = false;
      lastRemoteSig = JSON.stringify(remote);
      applyRemote(remote);
      return;
    }
    if (!remote) return;
    lastRemoteSig = JSON.stringify(remote);
    if (recentPushes.indexOf(lastRemoteSig) >= 0) return;   /* 내가 보낸 값이 되돌아온 것 */
    applyRemote(remote);

  function initSync() {
    if (typeof firebase === 'undefined' || !firebase || typeof firebase.initializeApp !== 'function') {

      return;

    setSyncMode('connecting');
    try {
      const app = (firebase.apps && firebase.apps.length) ? firebase.app() : firebase.initializeApp(FIREBASE_CONFIG);
      const db = firebase.database(app);
      try {
        db.ref('.info/connected').on('value', (snap) => {
          const on = !!(snap && snap.val() === true);
          fbConnected = on;
          setSyncMode(on ? 'live' : 'local');
          if (on && unsynced && !firstSnap) { unsynced = false; pushNow(); }   /* 끊긴 동안 쌓인 기록을 보내요 */
        }, () => setSyncMode('local'));
      } catch (e) { }
      fbRef = db.ref(DB_PATH);
      fbRef.on('value', onRemoteValue, () => setSyncMode('local'));
    } catch (e) {
      fbRef = null;
      setSyncMode('local');
    }

  function memberById(id) {
    for (let i = 0; i < state.members.length; i++) if (state.members[i].id === id) return state.members[i];

  function pickMission(excludeIdx) {
    let i = Math.floor(Math.random() * MISSIONS.length);
    let guard = 0;
    while (i === excludeIdx && MISSIONS.length > 1 && guard++ < 30) i = Math.floor(Math.random() * MISSIONS.length);
    return i;
  }

  /* ------------------------- stamps ------------------------- */
  function addLog(memberId, kind, text, amount) {
    const entry = { id: uid('sl'), memberId: memberId, kind: kind, text: text || '', amount: Math.max(1, toInt(amount, 1)), at: Date.now() };
    state.stampLog.push(entry);
    return entry;
  }
  function removeLog(id) {
    const i = state.stampLog.findIndex((e) => e.id === id);
    if (i >= 0) state.stampLog.splice(i, 1);
  }
  function stampTotal(memberId) {
    return state.stampLog.reduce((s, e) => (e.memberId === memberId ? s + (e.amount || 1) : s), 0);
  }
  function stampToday(memberId) {
    const k = tKey();
    return state.stampLog.reduce((s, e) => (e.memberId === memberId && ymd(new Date(e.at)) === k ? s + (e.amount || 1) : s), 0);
  }
  function dayHasStamp(memberId, key) {
    return state.stampLog.some((e) => e.memberId === memberId && ymd(new Date(e.at)) === key);
  }
  function monthStamps(memberId) {
    const y = calCursor.getFullYear();
    const m = calCursor.getMonth();
    const set = {};
    state.stampLog.forEach((e) => {
      if (e.memberId !== memberId) return;
      const d = new Date(e.at);
      if (d.getFullYear() === y && d.getMonth() === m) set[ymd(d)] = true;
    });
    return Object.keys(set).length;
  }
  function monthStampsNow(memberId) {
    const now = new Date();
    const y = now.getFullYear();
    const m = now.getMonth();
    const set = {};
    state.stampLog.forEach((e) => {
      if (e.memberId !== memberId) return;
      const d = new Date(e.at);
      if (d.getFullYear() === y && d.getMonth() === m) set[ymd(d)] = true;
    });
    return Object.keys(set).length;
  }
  function streakFor(memberId) {
    let cursor = new Date();
    if (!dayHasStamp(memberId, ymd(cursor))) cursor.setDate(cursor.getDate() - 1);
    let n = 0;
    let guard = 0;

  /* ------------------------- render: health ------------------------- */

          '<div class="health-head">' +
            '<span class="avatar sm tone-' + m.tone + '">' + avatarSVG(m.avatar) + '</span>' +
            '<div style="flex:1;min-width:0"><p class="m-name">' + esc(m.name) + '</p><p class="m-sub">3가지 중 ' + cnt + '개 완료</p></div>' +

          '<button class="toggle-chip ' + (h.exercise ? 'on' : '') + '" type="button" data-act="toggle-exercise" data-member="' + m.id + '">🤸 운동·스트레칭<span class="state">' + (h.exercise ? '완료' : '아직') + '</span></button>' +

  /* ------------------------- render: praise ------------------------- */
  function praiseHTML() {
    const target = safeMember(state.praiseTarget);

        '<div class="member-chips">' + state.members.map((m) =>
          '<button type="button" class="member-chip ' + (m.id === target.id ? 'on' : '') + '" data-act="praise-member" data-member="' + m.id + '">' +
            '<span class="avatar tone-' + m.tone + '">' + avatarSVG(m.avatar) + '</span>' + esc(m.name) + '</button>').join('') + '</div>' +
        '<div class="quick-row">' + PRAISE_QUICK.map((q) =>
          '<button type="button" class="quick" data-act="praise-quick" data-text="' + esc(q) + '">' + esc(q) + '</button>').join('') + '</div>' +
        '<textarea class="note" id="praiseNote" data-input="praise-note" placeholder="칭찬 한마디를 적어 주세요 (예: 스스로 숙제 다 함!)">' + esc(praiseDraft) + '</textarea>' +
        '<button class="btn btn-pink btn-block" type="button" data-act="send-praise" style="margin-top:9px">⭐ ' + esc(target.name) + '에게 별 · 도장 보내기</button>' +
      '</div>' +
      '<div class="card">' +
        '<div class="card-head"><h2>💮 도장 적립</h2><span class="pill-count">모두 ' + grandStampTotal() + '개</span></div>' +
        '<div class="totals">' + state.members.map((m) =>
          '<span class="total-chip"><span class="avatar tone-' + m.tone + '">' + avatarSVG(m.avatar) + '</span>' + esc(m.name) + ' 💮 ' + stampTotal(m.id) + '</span>').join('') + '</div>' +
        ledgerHTML() +
      '</div>' +
      '<div class="card">' +
        '<div class="card-head"><h2>💌 최근 칭찬</h2><span class="pill-count">' + state.praise.length + '개</span></div>' +
        feedHTML() +
      '</div>' +
      '<div class="card">' +
        '<div class="card-head"><h2>📅 도장 달력</h2></div>' +
        '<div class="member-chips">' + state.members.map((m) =>
          '<button type="button" class="member-chip ' + (m.id === safeMember(calSet).id ? 'on' : '') + '" data-act="cal-member" data-member="' + m.id + '">' +
            '<span class="avatar tone-' + m.tone + '">' + avatarSVG(m.avatar) + '</span>' + esc(m.name) + '</button>').join('') + '</div>' +
        calendarHTML(safeMember(calSet).id) +
      '</div>';
  }

  function grandStampTotal() {
    return state.stampLog.reduce((s, e) => s + (e.amount || 1), 0);
  }

  function ledgerHTML() {
    const log = state.stampLog.slice().sort((a, b) => b.at - a.at).slice(0, 25);
    if (!log.length) {
      return '<div class="empty"><span class="emoji">💮</span>아직 쌓인 도장이 없어요<br>루틴을 하나 마치면 도장이 쌓여요</div>';
    }
    return log.map((e) => {
      const m = memberById(e.memberId) || state.members[0];
      return '<div class="ledger-item">' +
        '<span class="avatar xxs tone-' + m.tone + '">' + avatarSVG(m.avatar) + '</span>' +
        '<span class="ledger-text">' + esc(m.name) + ' · ' + esc(e.text || '도장') +
          '<small>' + (e.kind === 'praise' ? '칭찬 도장' : '루틴 완료') + ' · ' + fmtWhen(e.at) + '</small></span>' +
        '<span class="ledger-amount">💮 +' + (e.amount || 1) + '</span>' +
      '</div>';
    }).join('');
  }

  function feedHTML() {
    const feed = state.praise.slice().sort((a, b) => b.at - a.at).slice(0, 30);
    if (!feed.length) {
      return '<div class="empty"><span class="emoji">💌</span>아직 남긴 칭찬이 없어요<br>첫 칭찬을 남겨 보세요</div>';
    }
    return feed.map((p) => {
      const m = memberById(p.memberId) || state.members[0];
      return '<div class="feed-item">' +
        '<span class="avatar xs tone-' + m.tone + '">' + avatarSVG(m.avatar) + '</span>' +
        '<span class="feed-body">' +
          '<span class="feed-head"><b>' + esc(m.name) + '</b><span class="feed-star">⭐ +1</span><span class="feed-time">' + fmtWhen(p.at) + '</span></span>' +
          '<span class="feed-text">' + esc(p.text || '칭찬 별을 보냈어요') + '</span>' +
        '</span>' +
        '<button class="mini mini-x" type="button" data-act="del-praise" data-id="' + p.id + '" aria-label="칭찬 지우기">✕</button>' +
      '</div>';
    }).join('');
  }

  function calendarHTML(memberId) {
    const y = calCursor.getFullYear();
    const mo = calCursor.getMonth();
    const first = new Date(y, mo, 1);
    const startPad = first.getDay();
    const days = new Date(y, mo + 1, 0).getDate();
    const cells = [];
    for (let i = 0; i < startPad; i++) cells.push('<div class="cal-cell empty"></div>');
    for (let d = 1; d <= days; d++) {
      const k = ymd(new Date(y, mo, d));
      const stamped = dayHasStamp(memberId, k);
      const isToday = k === tKey();
      cells.push('<div class="cal-cell ' + (stamped ? 'stamped' : '') + ' ' + (isToday ? 'today' : '') + '">' + d + '</div>');
    }
    return '<div class="cal">' +
      '<div class="cal-head">' +
        '<button class="mini" type="button" data-act="cal-prev" aria-label="이전 달">‹</button>' +
        '<p class="cal-title">' + y + '년 ' + (mo + 1) + '월</p>' +
        '<button class="mini" type="button" data-act="cal-next" aria-label="다음 달">›</button>' +
      '</div>' +
      '<div class="cal-grid">' + WEEK_MIN.map((w) => '<div class="cal-dow">' + w + '</div>').join('') + cells.join('') + '</div>' +
      '<p class="cal-count">이번 달 도장 <b>' + monthStamps(memberId) + '</b>개</p>' +
    '</div>';
  }

  /* ------------------------- render: chat ------------------------- */
  function chatHTML() {
    const me = safeMember(state.active.chat);
    const msgs = state.chat.slice().sort((a, b) => a.at - b.at);
    return '<div class="card chat-card">' +
        '<div class="card-head"><h2>💬 우리 가족 채팅</h2>' +
          '<button class="btn btn-ghost btn-tiny" type="button" data-act="toggle-lock">' + (state.chatLock ? '🔓 잠금 풀기' : '🔒 이 기기 잠금') + '</button>' +
        '</div>' +
        '<p class="card-desc">' + state.members.map((m) => esc(m.name)).join('·') + '가 말풍선과 스티커로 이야기해요</p>' +
        '<div class="member-chips">' + state.members.map((m) =>
          '<button type="button" class="member-chip ' + (m.id === me.id ? 'on' : '') + (state.chatLock && m.id !== me.id ? ' locked' : '') + '" data-act="chat-member" data-member="' + m.id + '">' +
            '<span class="avatar tone-' + m.tone + '">' + avatarSVG(m.avatar) + '</span>' + esc(m.name) + '</button>').join('') + '</div>' +
        (state.chatLock ? '<p class="lock-note">🔒 잠겨 있어요 — 이 기기에서는 ' + esc(me.name) + '(으)로 기록돼요</p>' : '') +
        '<p class="caption">한 번 고르면 이 기기에 기억돼요 · 메시지는 가족 모두와 실시간으로 공유돼요</p>' +
        '<div class="chat-feed" id="chatFeed">' + (msgs.length ? msgs.map((msg) => bubbleHTML(msg, me)).join('') : '<div class="empty"><span class="emoji">💬</span>아직 이야기가 없어요<br>첫 마디를 남겨 보세요</div>') + '</div>' +
        '<div class="chat-composer">' +
          '<input class="chat-input" id="chatInput" type="text" value="' + esc(chatDraft) + '" placeholder="' + esc(me.name) + '(으)로 한마디..." data-input="chat-draft" aria-label="메시지">' +
          '<button class="send" type="button" data-act="send-chat">보내기</button>' +
        '</div>' +
        '<div class="sticker-row">' + STICKERS.map((s) =>
          '<button class="sticker-btn" type="button" data-act="chat-sticker" data-sticker="' + esc(s) + '" aria-label="스티커 ' + esc(s) + '">' + s + '</button>').join('') + '</div>' +
        '<p class="caption">💡 스티커를 누르면 바로 보내져요</p>' +
      '</div>';
  }

  function bubbleHTML(msg, me) {
    const m = memberById(msg.memberId) || state.members[0];
    const mine = msg.memberId === me.id;
    const hearts = Array.isArray(msg.hearts) ? msg.hearts : [];
    const hearted = hearts.indexOf(me.id) >= 0;
    const isSticker = msg.type === 'sticker';
    return '<div class="bubble-row ' + (mine ? 'mine' : 'other') + '">' +
      (mine ? '' : '<span class="avatar xxs tone-' + m.tone + '">' + avatarSVG(m.avatar) + '</span>') +
      '<div class="bubble-wrap">' +
        (mine ? '' : '<p class="bubble-name">' + esc(m.name) + ' <span>' + fmtWhen(msg.at) + '</span></p>') +
        '<div class="bubble ' + (isSticker ? 'sticker' : '') + '">' + (isSticker ? esc(msg.text) : esc(msg.text)) + '</div>' +
        '<div class="bubble-actions">' +
          '<button class="react ' + (hearted ? 'on' : '') + '" type="button" data-act="chat-heart" data-id="' + msg.id + '" aria-label="하트">❤️' + (hearts.length ? ' ' + hearts.length : '') + '</button>' +
          '<button class="react del" type="button" data-act="chat-del" data-id="' + msg.id + '" aria-label="메시지 삭제">✕</button>' +
        '</div>' +
      '</div>' +
      (mine ? '<span class="avatar xxs tone-' + m.tone + '">' + avatarSVG(m.avatar) + '</span>' : '') +
    '</div>';
  }

  function scrollChat() {
    const f = qs('#chatFeed');
    if (f) f.scrollTop = f.scrollHeight;
  }

  /* ------------------------- render root ------------------------- */
  function render() {
    pendingRender = false;
    const dateEl = qs('#headerDate');
    if (dateEl) dateEl.textContent = fmtKoreanDate(new Date());
    renderTabbar();
    setHTML('#tab-home', homeHTML());
    setHTML('#tab-routine', routineHTML());
    setHTML('#tab-meals', mealsHTML());
    setHTML('#tab-schedule', scheduleHTML());
    setHTML('#tab-health', healthHTML());
    setHTML('#tab-praise', praiseHTML());
    setHTML('#tab-chat', chatHTML());
    qsa('.tab').forEach((s) => s.classList.toggle('on', s.dataset.tab === currentTab));
    save();
    if (currentTab === 'chat') scrollChat();
  }
  function setHTML(sel, html) {
    const el = qs(sel);
    if (el) el.innerHTML = html;
  }
  function toast(msg) {
    const el = qs('#toast');
    if (!el) return;
    el.textContent = msg;
    el.classList.add('on');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove('on'), 1900);
  }

  /* ------------------------- modal ------------------------- */
  function openModal(opts) {
    const root = qs('#modalRoot');
    if (!root) return;
    root.innerHTML = '<div class="modal-backdrop" data-act="close-modal"></div>' +
      '<div class="modal-sheet" role="dialog" aria-modal="true" aria-label="' + esc(opts.label || '설정') + '">' +
        '<div class="modal-head"><h2>' + (opts.title || '') + '</h2>' +
          '<button class="modal-x" type="button" data-act="close-modal" aria-label="닫기">✕</button></div>' +
        '<div class="modal-body">' + (opts.body || '') + '</div>' +
        (opts.footer ? '<div class="modal-foot">' + opts.footer + '</div>' : '') +
      '</div>';
    root.hidden = false;
    document.body.style.overflow = 'hidden';
    if (opts.onMount) opts.onMount(root);
  }
  function closeModal() {
    const root = qs('#modalRoot');
    if (!root) return;
    root.hidden = true;
    root.innerHTML = '';
    document.body.style.overflow = '';
    pendingConfirm = null;
    flushPendingRender();
  }
  function readFields(root) {
    const out = {};
    qsa('[data-field]', root).forEach((el) => { out[el.dataset.field] = String(el.value || '').trim(); });
    return out;
  }
  function fieldInput(name, label, value, placeholder, type) {
    return '<div class="form-row"><label>' + label + '</label>' +
      '<input data-field="' + name + '" type="' + (type || 'text') + '" value="' + esc(value == null ? '' : value) + '" placeholder="' + esc(placeholder || '') + '"' +
      (type === 'number' ? ' inputmode="numeric"' : ' autocomplete="off"') + '></div>';
  }
  function fieldSelect(name, label, options, value) {
    return '<div class="form-row"><label>' + label + '</label><select data-field="' + name + '">' +
      options.map((o) => '<option value="' + esc(o.v) + '"' + (String(o.v) === String(value) ? ' selected' : '') + '>' + esc(o.l) + '</option>').join('') +
      '</select></div>';
  }
  function memberOptions() {
    return state.members.map((m) => ({ v: m.id, l: m.name }));
  }
  function confirmModal(title, message, okLabel, onOk) {
    pendingConfirm = onOk;
    openModal({
      title: title,
      label: title,
      body: '<p class="confirm-text">' + message + '</p>',
      footer: '<button class="btn btn-ghost" type="button" data-act="close-modal">취소</button>' +
        '<button class="btn btn-pink" type="button" data-act="confirm-ok">' + okLabel + '</button>'
    });
  }

  /* ------------------------- modals ------------------------- */
  function openSettings() {
    const body = '<p class="form-note">' + (syncMode === 'live' ? '🟢 가족 모두와 실시간으로 연결돼 있어요.' : '⚪ 지금은 이 기기에만 저장돼요 · 인터넷이 되면 자동으로 이어져요.') + '</p>' +
      '<p class="form-note">가족 이름과 소개를 바꾸면 앱 전체에 바로 반영돼요.</p>' +
      '<div class="edit-list">' + state.members.map((m) =>
        '<div class="edit-row">' +
          '<span class="avatar xs tone-' + m.tone + '">' + avatarSVG(m.avatar) + '</span>' +
          '<div class="edit-fields">' +
            '<input class="edit-input" data-field="name_' + m.id + '" value="' + esc(m.name) + '" aria-label="이름">' +
            '<input class="edit-input small" data-field="sub_' + m.id + '" value="' + esc(m.sub) + '" placeholder="소개 한마디" aria-label="소개">' +
          '</div>' +
          '<select class="edit-select" data-field="avatar_' + m.id + '" aria-label="캐릭터">' +
            AVATARS.map((a) => '<option value="' + a.v + '"' + (a.v === m.avatar ? ' selected' : '') + '>' + a.l + '</option>').join('') +
          '</select>' +
        '</div>').join('') + '</div>' +
      '<div class="form-row"><label>우리 동네 (날씨 카드에 표시)</label>' +
        '<input data-field="place" value="' + esc(state.weather.place) + '"></div>' +
      '<div class="modal-actions-col">' +
        '<button class="btn btn-ghost" type="button" data-act="open-fixed">⚙️ 고정 항목 관리</button>' +
        '<button class="btn btn-ghost" type="button" data-act="reset-data">🧹 데이터 초기화</button>' +
      '</div>';
    openModal({
      title: '⚙️ 설정',
      label: '설정',
      body: body,
      footer: '<button class="btn btn-ghost" type="button" data-act="close-modal">닫기</button>' +
        '<button class="btn btn-sky" type="button" data-act="save-settings">저장</button>'
    });
  }

  function saveSettings() {
    const root = qs('#modalRoot');
    const v = readFields(root);
    state.members.forEach((m) => {
      const n = v['name_' + m.id];
      if (n) m.name = n.slice(0, 12);
      if (v['sub_' + m.id] != null) m.sub = v['sub_' + m.id].slice(0, 20);

  /* ------------------------- finders ------------------------- */
  function findRoutine(id) {
    const day = state.routines[tKey()] || {};
    for (let i = 0; i < state.members.length; i++) {
      const m = state.members[i];
      const list = day[m.id] || [];
      const idx = list.findIndex((x) => x.id === id);
      if (idx >= 0) return { member: m, list: list, index: idx, item: list[idx] };
    }
    return null;
  }
  function findTodo(id, memberId) {
    const day = state.todos[tKey()] || {};
    const ids = memberId ? [memberId] : state.members.map((m) => m.id);
    for (let i = 0; i < ids.length; i++) {
      const list = day[ids[i]] || [];
      const idx = list.findIndex((x) => x.id === id);
      if (idx >= 0) return { member: safeMember(ids[i]), list: list, index: idx, item: list[idx] };
    }
    return null;
  }

  /* ------------------------- timer ------------------------- */
  const timer = { mode: 'down', minutes: 10, remaining: 600, elapsed: 0, running: false, endAt: 0, startAt: 0, base: 0, iv: null, audio: null };

  function fmtClock(sec) {
    const s = Math.max(0, Math.floor(sec));
    const h = Math.floor(s / 3600);
    const m = Math.floor((s % 3600) / 60);
    const r = s % 60;
    return h > 0 ? h + ':' + pad2(m) + ':' + pad2(r) : pad2(m) + ':' + pad2(r);
  }
  function timerSeconds() { return timer.mode === 'down' ? timer.remaining : timer.elapsed; }
  function timerHintText() {
    if (timer.running) return timer.mode === 'down' ? '집중하는 중... 화이팅!' : '재는 중... 화이팅!';
    return timer.mode === 'down' ? timer.minutes + '분 · 시작을 눌러요' : '시작을 누르면 시간을 재요';
  }
  function timerHTML() {
    const secs = timerSeconds();
    return '<div class="timer-tabs">' +
        '<button type="button" data-act="timer-mode" data-mode="down" class="' + (timer.mode === 'down' ? 'on' : '') + '">⏳ 남은 시간</button>' +
        '<button type="button" data-act="timer-mode" data-mode="up" class="' + (timer.mode === 'up' ? 'on' : '') + '">⏱️ 재는 시간</button>' +
      '</div>' +
      '<p class="timer-hint" id="timerHint">' + timerHintText() + '</p>' +
      '<p class="timer-display' + (timer.mode === 'down' && secs === 0 ? ' done' : '') + '" id="timerDisplay">' + fmtClock(secs) + '</p>' +
      '<div class="row-2" style="margin-top:14px">' +
        '<button class="btn btn-mint" type="button" data-act="timer-toggle" id="timerToggle">' + (timer.running ? '⏸ 일시정지' : '▶ 시작') + '</button>' +
        '<button class="btn btn-ghost" type="button" data-act="timer-reset">↺ 초기화</button>' +
      '</div>' +
      '<div class="preset-row">' +
        [10, 20, 30].map((mm) => '<button type="button" class="chip ' + (timer.mode === 'down' && timer.minutes === mm ? 'on' : '') + '" data-act="timer-preset" data-min="' + mm + '">' + mm + '분</button>').join('') +
        '<label class="custom-min"><input id="customMin" type="number" min="1" max="180" inputmode="numeric" placeholder="직접" aria-label="직접 분 입력"><span>분</span></label>' +
        '<button type="button" class="btn btn-sky btn-tiny" data-act="timer-custom">맞추기</button>' +
      '</div>';
  }
  function renderTimerBody() {
    const el = qs('#timerBody');
    if (el) el.innerHTML = timerHTML();
  }
  function updateTimerDisplay() {
    const d = qs('#timerDisplay');
    const h = qs('#timerHint');
    if (d) {
      d.textContent = fmtClock(timerSeconds());
      d.classList.toggle('done', timer.mode === 'down' && timer.remaining === 0);
    }
    if (h) h.textContent = timerHintText();
  }
  function beep() {
    try {
      if (!timer.audio) {
        const Ctx = window.AudioContext || window.webkitAudioContext;
        if (Ctx) timer.audio = new Ctx();
      }
      const ctx = timer.audio;
      if (!ctx) return;
      if (ctx.state === 'suspended' && ctx.resume) ctx.resume();
      const o = ctx.createOscillator();
      const g = ctx.createGain();
      o.type = 'sine';
      o.frequency.value = 880;
      o.connect(g);
      g.connect(ctx.destination);
      const t = ctx.currentTime;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.2, t + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.9);
      o.start(t);
      o.stop(t + 1);
    } catch (e) { /* 소리는 없어도 괜찮아요 */ }
    if (navigator.vibrate) { try { navigator.vibrate([120, 80, 120]); } catch (e) { } }
  }
  function timerTick() {
    const now = Date.now();
    if (timer.mode === 'down') {
      timer.remaining = Math.max(0, Math.ceil((timer.endAt - now) / 1000));
      if (timer.remaining <= 0) { finishTimer(); return; }
    } else {
      timer.elapsed = timer.base + Math.floor((now - timer.startAt) / 1000);
    }
    updateTimerDisplay();
  }
  function startTimer() {
    if (timer.running) return;
    if (timer.mode === 'down' && timer.remaining <= 0) timer.remaining = timer.minutes * 60;
    timer.running = true;
    timer.endAt = Date.now() + timer.remaining * 1000;
    timer.startAt = Date.now();
    timer.base = timer.elapsed;
    clearInterval(timer.iv);
    timer.iv = setInterval(timerTick, 250);
    beepInit();
    renderTimerBody();
    updateTimerDisplay();
  }
  function beepInit() {
    try {
      if (!timer.audio) {
        const Ctx = window.AudioContext || window.webkitAudioContext;
        if (Ctx) timer.audio = new Ctx();
      }
    } catch (e) { }
  }
  function pauseTimer() {
    if (!timer.running) return;
    if (timer.mode === 'down') timer.remaining = Math.max(0, Math.ceil((timer.endAt - Date.now()) / 1000));
    else timer.elapsed = timer.base + Math.floor((Date.now() - timer.startAt) / 1000);
    timer.running = false;
    clearInterval(timer.iv);
    timer.iv = null;
    renderTimerBody();
    updateTimerDisplay();
  }
  function finishTimer() {
    timer.running = false;
    timer.remaining = 0;
    clearInterval(timer.iv);
    timer.iv = null;
    renderTimerBody();
    updateTimerDisplay();
    beep();
    toast('⏰ 시간 다 됐어요! 정말 잘했어요');
  }
  function resetTimer() {
    clearInterval(timer.iv);
    timer.iv = null;
    timer.running = false;
    timer.remaining = timer.minutes * 60;
    timer.elapsed = 0;
    timer.base = 0;
    renderTimerBody();
    updateTimerDisplay();
  }
  function setTimerMode(mode) {
    if (mode !== 'down' && mode !== 'up') return;
    clearInterval(timer.iv);
    timer.iv = null;
    timer.running = false;
    timer.mode = mode;
    if (mode === 'down') timer.remaining = timer.minutes * 60;
    else { timer.elapsed = 0; timer.base = 0; }
    renderTimerBody();
    updateTimerDisplay();
  }
  function setPreset(min) {
    const v = clamp(toInt(min, 10), 1, 180);
    clearInterval(timer.iv);
    timer.iv = null;
    timer.running = false;
    timer.mode = 'down';
    timer.minutes = v;
    timer.remaining = v * 60;
    renderTimerBody();
    updateTimerDisplay();
  }

  /* ------------------------- actions ------------------------- */
  const actions = {
    tab: (el) => { currentTab = el.dataset.tab; render(); },
    'open-settings': () => openSettings(),
    'save-settings': () => saveSettings(),
    'close-modal': () => closeModal(),

    'go-routine': (el) => { state.active.routine = el.dataset.member; currentTab = 'routine'; render(); },
    'stamp-member': (el) => { state.active.stamp = el.dataset.member; render(); },
    'stamp-calendar': () => { calSet = state.active.stamp; openStampCalendar(); },
    'cal-prev': () => { calCursor = new Date(calCursor.getFullYear(), calCursor.getMonth() - 1, 1); refreshCalendar(); },
    'cal-next': () => { calCursor = new Date(calCursor.getFullYear(), calCursor.getMonth() + 1, 1); refreshCalendar(); },
    'cal-member': (el) => { calSet = el.dataset.member; refreshCalendar(); },

    'mission-done': () => {
      const m = state.missions[tKey()];
      if (!m || m.done) return;
      m.done = true;
      state.missionTotal += 1;
      render();
      toast('가족 미션 성공! 함께 ' + state.missionTotal + '번 🎉');
    },
    'mission-reroll': () => {
      const cur = state.missions[tKey()];
      state.missions[tKey()] = { idx: pickMission(cur ? cur.idx : null), done: false };
      render();
      toast('새로운 미션을 뽑았어요');
    },

    'routine-member': (el) => { state.active.routine = el.dataset.member; render(); },
    'open-add-routine': (el) => openAddRoutine(el.dataset.member),
    'save-add-routine': () => saveAddRoutine(),
    'edit-routine': (el) => openEditRoutine(el.dataset.id),
    'save-edit-routine': (el) => saveEditRoutine(el.dataset.id),
    'toggle-routine': (el) => toggleRoutine(el.dataset.id),
    'pin-routine': (el) => pinRoutine(el.dataset.id),
    'del-routine': (el) => delRoutine(el.dataset.id),
    'open-fixed': () => openFixed(),
    'fixed-add': () => fixedAdd(),
    'fixed-del': (el) => fixedDel(el.dataset.id, el.dataset.member),

    'timer-mode': (el) => setTimerMode(el.dataset.mode),
    'timer-preset': (el) => setPreset(el.dataset.min),
    'timer-toggle': () => { if (timer.running) pauseTimer(); else startTimer(); },
    'timer-reset': () => resetTimer(),
    'timer-custom': () => {
      const inp = qs('#customMin');
      const v = toInt(inp ? inp.value : '', 0);
      if (!v) { toast('분을 먼저 입력해 주세요'); return; }
      if (v < 1 || v > 180) { toast('1분에서 180분 사이로 정해 주세요'); return; }
      setPreset(v);
      toast(v + '분으로 맞췄어요');
    },

    'meal-quick': (el) => {
      const key = el.dataset.meal;
      const text = el.dataset.text;
      const cur = state.meals[tKey()][key] || '';
      const parts = cur.split(',').map((s) => s.trim()).filter(Boolean);
      if (parts.indexOf(text) < 0) parts.push(text);
      state.meals[tKey()][key] = parts.join(', ');
      render();
    },

    'open-add-todo': (el) => openAddTodo(el.dataset.member),
    'save-add-todo': () => saveAddTodo(),
    'edit-todo': (el) => openEditTodo(el.dataset.id, el.dataset.member),
    'save-edit-todo': (el) => saveEditTodo(el.dataset.id, el.dataset.member),
    'toggle-todo': (el) => toggleTodo(el.dataset.id, el.dataset.member),
    'del-todo': (el) => delTodo(el.dataset.id, el.dataset.member),

    'water-plus': (el) => changeWater(el.dataset.member, 1),
    'water-minus': (el) => changeWater(el.dataset.member, -1),
    'toggle-meds': (el) => {
      const h = healthOf(el.dataset.member);
      h.meds = !h.meds;
      render();
      toast(h.meds ? '약·영양제 복용 체크!' : '복용 체크를 풀었어요');
    },
    'toggle-exercise': (el) => {
      const h = healthOf(el.dataset.member);
      h.exercise = !h.exercise;
      render();
      toast(h.exercise ? '운동 완료! 몸이 가벼워져요' : '운동 체크를 풀었어요');
    },

    'praise-member': (el) => { state.praiseTarget = el.dataset.member; render(); },
    'praise-quick': (el) => {
      const ta = qs('#praiseNote');
      const text = el.dataset.text || '';
      if (ta) {
        const cur = ta.value.trim();
        ta.value = cur ? cur + ' ' + text : text;
        praiseDraft = ta.value;
        ta.focus();
      } else {
        praiseDraft = text;
      }
      render();
    },
    'send-praise': () => sendPraise(),
    'del-praise': (el) => delPraise(el.dataset.id),

    'chat-member': (el) => {
      if (state.chatLock) { toast('🔒 잠겨 있어요. 잠금을 풀면 바꿀 수 있어요'); return; }
      state.active.chat = el.dataset.member;
      render();
    },
    'toggle-lock': () => {
      state.chatLock = !state.chatLock;
      render();
      toast(state.chatLock ? '🔒 이 기기 잠금 — ' + safeMember(state.active.chat).name + '(으)로 고정했어요' : '🔓 잠금을 풀었어요');
    },
    'send-chat': () => sendChat(),
    'chat-sticker': (el) => sendSticker(el.dataset.sticker),
    'chat-heart': (el) => toggleHeart(el.dataset.id),
    'chat-del': (el) => delChat(el.dataset.id),

    'reset-data': () => {
      confirmModal('🧹 데이터 초기화', '이 기기에 저장된 기록(루틴·할 일·도장·칭찬·채팅)이 모두 지워져요.<br>되돌릴 수 없어요.', '초기화', () => {
        try { localStorage.removeItem(STORE_KEY); localStorage.removeItem(STORE_DEV_KEY); } catch (e) { }
        state = blankState();
        calCursor = startOfMonth(new Date());
        calSet = state.active.stamp;
        chatDraft = '';
        praiseDraft = '';
        render();
        toast('새로 시작했어요 🌱');
      });
    }
  };

  function refreshCalendar() {
    render();
    const root = qs('#modalRoot');
    if (root && !root.hidden) openStampCalendar();
  }

  function toggleRoutine(id) {
    const found = findRoutine(id);
    if (!found) return;
    const item = found.item;
    const m = found.member;
    if (!item.done) {
      item.done = true;
      const amount = clamp(toInt(item.stamp, 1), 1, 20);
      const log = addLog(m.id, 'routine', item.title, amount);
      item.logId = log.id;
      render();
      toast('💮 ' + m.name + ' 도장 +' + amount + ' · 이번 달 ' + monthStampsNow(m.id) + '개');
    } else {
      item.done = false;
      if (item.logId) { removeLog(item.logId); item.logId = null; }
      render();
      toast('도장을 하나 돌려놓았어요');
    }
  }

  function pinRoutine(id) {
    const found = findRoutine(id);
    if (!found) return;
    const item = found.item;
    const m = found.member;
    if (item.fixedId) {
      const list = state.fixed[m.id] || [];
      const i = list.findIndex((f) => f.id === item.fixedId);
      if (i >= 0) list.splice(i, 1);
      item.fixedId = null;
      render();
      toast('고정을 풀었어요 (매일 올라오지 않아요)');
    } else {
      if (!state.fixed[m.id]) state.fixed[m.id] = [];
      const fx = { id: uid('fx'), title: item.title, tag: item.tag || '', stamp: item.stamp == null ? 1 : item.stamp };
      state.fixed[m.id].push(fx);
      item.fixedId = fx.id;
      render();
      toast('매일 아침 자동으로 올라오는 고정 항목이에요 📍');
    }
  }

  function delRoutine(id) {
    const found = findRoutine(id);
    if (!found) return;
    const wasFixed = !!found.item.fixedId;
    if (found.item.logId) removeLog(found.item.logId);
    found.list.splice(found.index, 1);
    render();
    toast(wasFixed ? '오늘 목록에서 지웠어요 · 고정 항목이라 내일 다시 올라와요' : '오늘 목록에서 지웠어요');
  }

  function toggleTodo(id, memberId) {
    const found = findTodo(id, memberId);
    if (!found) return;
    found.item.done = !found.item.done;
    render();
    if (found.item.done) toast('✔️ ' + found.member.name + ' 할 일 완료!');
  }

  function delTodo(id, memberId) {
    const found = findTodo(id, memberId);
    if (!found) return;
    found.list.splice(found.index, 1);
    render();
    toast('할 일을 지웠어요');
  }

  function healthOf(memberId) {
    const key = tKey();
    if (!state.health[key]) state.health[key] = {};
    if (!state.health[key][memberId]) state.health[key][memberId] = { water: 0, meds: false, exercise: false };
    return state.health[key][memberId];
  }
  function changeWater(memberId, delta) {
    const h = healthOf(memberId);
    h.water = clamp(h.water + delta, 0, 8);
    render();
    if (delta > 0 && h.water === 8) toast('물 8잔 완주! 💧 최고예요');
  }

  function sendPraise() {
    const ta = qs('#praiseNote');
    const text = String(ta ? ta.value : praiseDraft).trim();
    const m = safeMember(state.praiseTarget);
    const log = addLog(m.id, 'praise', text || '칭찬 별', 1);
    state.praise.push({ id: uid('pr'), memberId: m.id, text: text.slice(0, 120), at: Date.now(), logId: log.id });
    praiseDraft = '';
    render();
    toast('⭐ ' + m.name + '에게 별과 도장을 보냈어요');
  }

  function delPraise(id) {
    const i = state.praise.findIndex((p) => p.id === id);
    if (i < 0) return;
    const entry = state.praise[i];
    if (entry.logId) removeLog(entry.logId);
    state.praise.splice(i, 1);
    render();
    toast('칭찬을 지웠어요');
  }

  function sendChat() {
    const input = qs('#chatInput');
    const text = String(input ? input.value : chatDraft).trim();
    if (!text) { toast('한마디 적어 주세요'); return; }
    state.chat.push({ id: uid('ms'), memberId: state.active.chat, type: 'text', text: text.slice(0, 300), at: Date.now(), hearts: [] });
    chatDraft = '';
    render();
    scrollChat();
  }
  function sendSticker(emoji) {
    state.chat.push({ id: uid('ms'), memberId: state.active.chat, type: 'sticker', text: emoji, at: Date.now(), hearts: [] });
    render();
    scrollChat();
  }
  function toggleHeart(id) {
    const msg = state.chat.find((x) => x.id === id);
    if (!msg) return;
    if (!Array.isArray(msg.hearts)) msg.hearts = [];
    const me = state.active.chat;
    const i = msg.hearts.indexOf(me);
    if (i >= 0) msg.hearts.splice(i, 1);
    else msg.hearts.push(me);
    render();
  }
  function delChat(id) {
    const i = state.chat.findIndex((x) => x.id === id);
    if (i < 0) return;
    state.chat.splice(i, 1);
    render();
    toast('메시지를 지웠어요');
  }

  /* ------------------------- events ------------------------- */
  function bindEvents() {
    document.addEventListener('click', (e) => {
      const el = e.target.closest ? e.target.closest('[data-act]') : null;
      if (!el) return;
      const fn = actions[el.dataset.act];
      if (!fn) return;
      if (el.tagName === 'BUTTON' || el.tagName === 'A') e.preventDefault();
      fn(el);
    });

    document.addEventListener('input', (e) => {
      const el = e.target.closest ? e.target.closest('[data-input]') : null;
      if (!el) return;
      const k = el.dataset.input;
      if (k === 'chat-draft') chatDraft = el.value;
      else if (k === 'praise-note') praiseDraft = el.value;
    });

    document.addEventListener('change', (e) => {
      const el = e.target.closest ? e.target.closest('[data-input]') : null;
      if (!el) return;
      const k = el.dataset.input;
      if (k === 'meal') {
        state.meals[tKey()][el.dataset.meal] = el.value.slice(0, 80);
        save();
      } else if (k === 'memo') {
        const wk = weekKeyOf(new Date());
        if (!state.mealMemo[wk]) state.mealMemo[wk] = {};
        state.mealMemo[wk][el.dataset.day] = el.value.slice(0, 80);
        save();
      }
    });

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') { const root = qs('#modalRoot'); if (root && !root.hidden) closeModal(); }
      if (e.key === 'Enter' && e.target && e.target.id === 'chatInput') { e.preventDefault(); sendChat(); }
    });

    /* 입력창에서 손을 땠을 때, 미뤄 둔 다른 기기 기록을 반영해요 */
    document.addEventListener('focusout', () => { setTimeout(flushPendingRender, 0); });
  }

  /* ------------------------- midnight watch ------------------------- */
  function watchMidnight() {
    setInterval(() => {
      const k = tKey();
      if (k !== state.lastSeen) {
        state.lastSeen = k;
        ensureDay(state, k, false);
        save();
        render();
        toast('새로운 하루예요! 고정 항목이 올라왔어요 🌞');
      }
    }, 30000);
  }

  /* ------------------------- init ------------------------- */
  function init() {
    state = load();
    ensureDay(state, tKey(), false);
    state.lastSeen = tKey();
    if (!memberById(state.active.routine)) state.active.routine = state.members[0].id;
    if (!memberById(state.active.stamp)) state.active.stamp = state.members[0].id;
    if (!memberById(state.active.chat)) state.active.chat = state.members[0].id;
    if (!memberById(state.active.schedule)) state.active.schedule = state.members[0].id;
    if (!memberById(state.praiseTarget)) state.praiseTarget = state.active.stamp;
    if (!memberById(calSet)) calSet = state.active.stamp;
    bindEvents();
    render();
    watchMidnight();
    initSync();
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
  else init();
})();
</script>
</body>
</html>
